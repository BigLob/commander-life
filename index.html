  function sfyPaint() {
    const inner = app.querySelector('.sfy-bar .sfy-in, .sfy-dock .sfy-in');
    if (!inner) return;
    const btn = (a, icon, label, cls) => `<button type="button" class="sfy-b ${cls || ''}" data-a="${a}" aria-label="${label}">${SFY_ICON[icon]}</button>`;
    // Every state fills the same three cells: the words, the turn button's hole, the buttons.
    // The buttons end with the menu button's spot (shown only in the middle bar).
    const cells = (txt, ctl, song) => `<div class="sfy-text${song ? ' song' : ''}">${txt}</div><div class="sfy-hole"></div><div class="sfy-ctl">${ctl}<i class="sfy-mspot"></i></div>`;
    const msg = m => `<p>${esc(m)}</p>`;
    let html;
    if (!sfy.tok) html = cells(msg(sfyMsg || 'Control Spotify from here'), '<button type="button" class="sfy-pill" data-a="login">Connect Spotify</button>');
    else if (sfyDevices) {
      html = cells(msg(sfyMsg || (sfyDevices.length ? 'Play on' : 'No Spotify devices on. Open Spotify on a phone or the soundbar.')),
        sfyDevices.map(d => `<button type="button" class="sfy-pill alt${d.is_active ? ' on' : ''}" data-a="to:${esc(d.id)}">${esc(d.name)}</button>`).join('') +
        '<button type="button" class="sfy-pill alt" data-a="devices">Refresh</button><button type="button" class="sfy-pill alt" data-a="close">Close</button>');
    } else if (!sfyNow) html = cells(msg(sfyMsg || 'Loading Spotify…'), '');
    else if (!sfyNow.item && !sfyNow.device) html = cells(msg(sfyMsg || 'Nothing playing'), '<button type="button" class="sfy-pill" data-a="devices">Pick a device</button>');
    else {
      const it = sfyNow.item || {};
      const sub = it.artists ? it.artists.map(x => x.name).join(', ') : it.show ? it.show.name : '';
      html = cells(`<b>${esc(it.name || 'Nothing playing')}</b><span>${esc(sfyMsg || sub)}</span>`,
        btn('toggle', sfyNow.is_playing ? 'pause' : 'play', sfyNow.is_playing ? 'Pause' : 'Play', 'sfy-play') + btn('next', 'next', 'Next'), true);
    }
    // Only touch the bar when something changed; the turn button follows its hole.
    if (inner.dataset.html !== html) { inner.innerHTML = html; inner.dataset.html = html; placeTurn(); }
  }

  // The menu's Spotify remote field.
  const sfyIdInput = document.getElementById('sfyId');
  function syncSfy() {
    // Every layout has the bar since v1.35, so the field always shows.
    document.getElementById('sfyField').hidden = false;
    document.querySelectorAll('#segSpotify button').forEach(b => b.classList.toggle('on', (b.dataset.v === 'on') === !!sfy.on));
    document.getElementById('sfyIdRow').hidden = !sfy.on || !!SPOTIFY_CLIENT_ID || !!sfy.tok;
    if (document.activeElement !== sfyIdInput) sfyIdInput.value = sfy.id || '';
    const connect = document.getElementById('sfyConnect');
    connect.hidden = !sfy.on;
    connect.textContent = sfy.tok ? 'Disconnect Spotify' : 'Connect Spotify';
    // v1.54: no note while the remote is off (the user cut the explainer); the empty note is hidden.
    const sfyNote = document.getElementById('sfyNote');
    sfyNote.textContent = !sfy.on ? ''
      : sfy.tok ? 'Connected. Controls whatever this Spotify account is playing, on any device.'
      : !sfyId() ? 'Paste the Client ID of your Spotify developer app (its redirect URI must be ' + SFY_REDIRECT + ').'
      : sfyMsg || 'Sign in with the Spotify account that plays the music.';
    sfyNote.hidden = !sfyNote.textContent;
  }
  document.querySelectorAll('#segSpotify button').forEach(b => b.addEventListener('click', () => {
    sfy.on = b.dataset.v === 'on'; sfySave(); build(); syncMenu();
  }));
  sfyIdInput.addEventListener('input', () => { sfy.id = sfyIdInput.value.trim(); sfySave(); syncSfy(); });
  document.getElementById('sfyConnect').addEventListener('click', () => {
    if (sfy.tok) { sfyOut(); sfyPaint(); syncSfy(); } else sfyLogin();
  });

  // ---- menu ----
  const menu = document.getElementById('menu');
  const newGameBtn = document.getElementById('newGame');
  let armTimer = null;

  function syncMenu() {
    document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', +b.dataset.v === state.mode));
    document.querySelectorAll('#segStart button').forEach(b => b.classList.toggle('on', +b.dataset.v === state.start));
    document.querySelectorAll('#segLayout button').forEach(b => b.classList.toggle('on', state.ipad ? b.dataset.v === 'ipad' : b.dataset.v === state.layout2));
    document.querySelectorAll('#segSound button').forEach(b => b.classList.toggle('on', b.dataset.v === state.sound));
    document.getElementById('soundNow').textContent = { all: 'All', turn: 'Turn only', off: 'Off' }[state.sound];
    syncSpeaker();
    // Lights the layout actually in use here, which can differ from the one picked (see layoutOf()).
    const center = state.mode !== 1 && state.me === CENTER;
    const inUse = layoutOf(state.mode === SPLIT ? (center ? 4 : 2) : SIZE[state.mode]);
    document.querySelectorAll('#segLayout4 button').forEach(b => b.classList.toggle('on', b.dataset.v === (inUse === 'hub' ? 'ipad' : inUse)));
    document.getElementById('layoutField').hidden = !(state.mode === 2 || (state.mode === SPLIT && !center));
    // Three or four seats on the board: 3 or 4 players, or a Center phone in the two 1v1s.
    document.getElementById('layout4Field').hidden = !(state.mode === 3 || state.mode === 4 || state.mode === ARCH || (state.mode === SPLIT && center));
    document.querySelector('#segLayout4 [data-v="spot"]').hidden = center || state.mode === SPLIT;
    syncSfy();
    document.querySelector('#segLayout4 [data-v="quad"]').hidden = state.mode === 3;
    // In Archenemy the archenemy always goes first, and the life totals are set by the rules.
    document.getElementById('pickFirst').hidden = state.mode === 1 || state.mode === ARCH;
    document.getElementById('startField').hidden = state.mode === ARCH;
    document.getElementById('aeField').hidden = document.getElementById('schemesField').hidden = state.mode !== ARCH;
    document.querySelectorAll('#segSchemes button').forEach(b => b.classList.toggle('on', b.dataset.v === state.schemes));
    document.getElementById('schemesNote').textContent = state.schemes === 'app'
      ? 'The app shuffles and deals the schemes: tap the card button on the archenemy\'s seat.'
      : 'You play your own scheme cards; the app keeps the life totals.';
    // Who plays whom in the two 1v1s: Rand's pick sets both pairs.
    document.getElementById('pairsField').hidden = state.mode !== SPLIT;
    document.getElementById('sitoutField').hidden = state.mode !== 3;
    document.getElementById('pairsLabel').textContent = (state.names[pairMe()].trim() || DEFAULT_NAMES[pairMe()]) + ' plays';
    // A phone in the center has no seat of its own to concede or color.
    document.getElementById('colorField').hidden = center || !SHOW_DECKS;
    document.getElementById('meField').hidden = state.mode === 1;
    const edges = PEOPLE[state.mode];
    const me = center ? CENTER : edges.includes(state.me) ? state.me : 0;
    document.getElementById('meLabel').textContent = center ? 'This phone is in the center' : 'This phone is ' + (state.names[me].trim() || DEFAULT_NAMES[me]);
    [0, 1, 2, 3].forEach(e => {
      const row = document.getElementById('edge' + e);
      row.hidden = !edges.includes(e);
      row.querySelector('.pick').setAttribute('aria-label', 'This phone is ' + (state.names[e].trim() || DEFAULT_NAMES[e]));
    });
    document.querySelectorAll('#who .pick').forEach(pick => {
      pick.classList.toggle('on', +pick.dataset.v === me);
      pick.setAttribute('aria-pressed', +pick.dataset.v === me);
    });
    // This phone's player picks their deck (in "Solo", the one seat's).
    const mine = state.mode === 1 ? 0 : edges.includes(state.me) ? state.me : 0;
    document.getElementById('colorLabel').textContent = state.mode === 1 ? 'Deck' : (state.names[mine].trim() || DEFAULT_NAMES[mine]) + "'s deck";
    renderDecks(mine);
    state.names.forEach((n, i) => {
      const input = document.getElementById('name' + i);
      if (input !== document.activeElement) input.value = n;
    });
    disarm();
  }
  document.getElementById('who').addEventListener('click', e => {
    const b = e.target.closest('.pick');
    if (!b) return;
    state.me = +b.dataset.v; marking = []; save(); build(); syncMenu();
    if (amSpeaker()) { state.speaker.me = state.me; send({ 'speaker/me': state.me }); }
  });
  // New pairs start both 1v1s over, so once either has begun it takes a second tap.
  // v is Rand's opponent; a second tap on the same choice confirms once a game has begun.
  function applyPairs(v) {
    if (v === state.pairs) return;
    if (!DUELS.every(k => untouched(k)) && pairArm !== v) {
      disarm();
      pairArm = v;
      const mb = document.querySelector(`#segPairs [data-pv="${v}"]`);
      mb.classList.add('armed');
      mb.textContent = 'Tap again';
      paintMini();
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    // Logged under the old pairs, then started over under the new ones.
    pairArm = null;
    const patch = Object.assign({}, ...DUELS.map(resetGame));
    state.pairs = patch.pairs = v;
    marking = []; players = viewPlayers(); Object.assign(patch, reroll());
    send(patch); save(); build(); syncMenu();
  }
  // Who sits out of three players. A different player changes who's in the game, so like new pairs
  // it starts the game over, and once it has begun that takes a second tap.
  let sitArm = null;
  function applySitout(v) {
    if (v === state.sitout) return;
    if (!untouched(3) && sitArm !== v) {
      disarm();
      sitArm = v;
      const b = document.querySelector(`#segSitout [data-v="${v}"]`);
      b.classList.add('armed');
      b.textContent = 'Tap again';
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    sitArm = null;
    // Logged under the old players, then started over with the new ones.
    const patch = resetGame(3);
    state.sitout = patch.sitout = v;
    marking = []; players = viewPlayers(); Object.assign(patch, reroll());
    send(patch); save(); build(); syncMenu();
  }
  // Who the archenemy is. A new archenemy changes everyone's starting life, so it starts the game
  // over (logged first, the scheme deck shuffled again), and once it has begun that takes a second tap.
  let aeArm = null;
  function applyAe(v) {
    if (v === state.ae) return;
    if (!untouched(ARCH) && aeArm !== v) {
      disarm();
      aeArm = v;
      const b = document.querySelector(`#segAe [data-v="${v}"]`);
      b.classList.add('armed');
      b.textContent = 'Tap again';
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    aeArm = null;
    // Logged under the old archenemy, then started over with the new one's 40 life.
    const patch = resetGame(ARCH);
    state.ae = patch.ae = v;
    state.games[ARCH] = patch['games/' + ARCH] = blankGame(ARCH);
    marking = []; players = viewPlayers(); Object.assign(patch, reroll());
    send(patch); save(); build(); syncMenu();
  }
  function paintAe() {
    document.querySelectorAll('#segAe button').forEach(b => {
      const e = +b.dataset.v, name = state.names[e].trim() || DEFAULT_NAMES[e];
      b.classList.toggle('on', e === state.ae);
      b.classList.remove('armed');
      b.textContent = name;
      b.setAttribute('aria-label', name + ' is the archenemy');
    });
  }
  document.getElementById('segAe').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) applyAe(+b.dataset.v);
  });
  // The app's scheme deck or the group's own cards. Only what the archenemy's seat shows changes,
  // so it doesn't touch the game.
  document.getElementById('segSchemes').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.dataset.v === state.schemes) return;
    state.schemes = b.dataset.v;
    send({ schemes: state.schemes }); save(); build(); syncMenu();
  });
  function paintSitout() {
    document.querySelectorAll('#segSitout button').forEach(b => {
      const e = +b.dataset.v, name = state.names[e].trim() || DEFAULT_NAMES[e];
      b.classList.toggle('on', e === state.sitout);
      b.classList.remove('armed');
      b.textContent = name;
      b.setAttribute('aria-label', name + ' sits out');
    });
  }
  document.getElementById('segSitout').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) applySitout(+b.dataset.v);
  });
  document.getElementById('segPairs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) applyPairs(+b.dataset.pv);
  });

  // A deck's colors (its colors string, in card order) as mana symbols, one per color.
  const manaOf = k => '<i class="mana" aria-hidden="true">' + DECKS[k].colors.split('-').map(c =>
    `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="${MANA[c][0]}"/><path transform="translate(4.5 4.5) scale(.72)" fill="#111" d="${MANA[c][1]}"/></svg>`).join('') + '</i>';
  function renderDecks(mine) {
    const playing = colorOf(mine).slice(2);
    document.getElementById('colors').innerHTML = Object.keys(DECKS).map(k => {
      const d = DECKS[k], open = openDeck === k;
      return `<div>
        <button type="button" class="deck k-${k}${k === playing ? ' on' : ''}${open ? ' open' : ''}" data-open="${k}" aria-expanded="${open}" aria-label="${d.name}, ${d.commander}, ${d.colors}${k === playing ? ', playing' : ''}">
          <i class="art"><img src="${artUrl(k, 'art_crop')}" alt="" loading="lazy" onerror="this.remove()"></i>
          <span><b>${d.name}</b><small>${esc(d.commander)}</small></span>${manaOf(k)}</button>
        ${open ? `<div class="deck-more">
          <div class="card"><img src="${artUrl(k, 'normal')}" alt="${esc(d.commander)}" loading="lazy" onerror="this.remove()"></div>
          ${k === playing ? `<p class="playing">${esc(state.names[mine].trim() || DEFAULT_NAMES[mine])} is playing this deck</p>`
            : `<button type="button" class="action primary" data-play="${k}" data-e="${mine}">Play ${d.name}</button>`}
          <details class="field"><summary>Decklist &middot; 100 cards</summary><div class="decklist">
            <p class="cmdr">Commander: <b>${esc(d.commander)}</b></p>
            <ul>${d.cards.split('|').map(c => `<li>${esc(c)}</li>`).join('')}</ul>
            <p class="src">Card images from Scryfall.</p></div></details>
        </div>` : ''}</div>`;
    }).join('');
  }
  document.getElementById('colors').addEventListener('click', e => {
    const play = e.target.closest('[data-play]');
    if (play) {
      state.colors[+play.dataset.e] = play.dataset.play;
      send({ ['colors/' + play.dataset.e]: play.dataset.play });
      openDeck = null; buzz();
      save(); build(); syncMenu();
      return;
    }
    const row = e.target.closest('[data-open]');
    if (!row) return;
    openDeck = openDeck === row.dataset.open ? null : row.dataset.open;
    syncMenu();
    // The list was redrawn, so scroll the new copy of the row into view.
    if (openDeck) document.querySelector(`#colors [data-open="${openDeck}"]`).scrollIntoView({ block: 'start', behavior: 'smooth' });
  });

  // The other 1v1's totals, and who this player can pick to play (SPLIT on a player's own phone).
  let pairArm = null;
  // Whose opponent the menu picks: this phone's player, or Rand's on a Center phone.
  const pairMe = () => state.me === CENTER ? 0 : state.me;
  // Whoever is left over plays each other, so Rand's opponent is all the table needs to remember.
  const pairsFor = (me, opp) => me === 0 ? opp : opp === 0 ? me : [1, 2, 3].find(x => x !== me && x !== opp);
  function paintMini() {
    const mini = app.querySelector('.mini');
    if (!mini) return;
    const me = state.me, other = DUELS.find(k => k !== duelOf(me));
    const side = (e, j) => {
      const p = state.games[other][j];
      return `<span class="mini-p${outReason(p) ? ' out' : ''}"><i class="k-${bgOf(e)}"></i><span class="nm">${nameOf(e)}</span><b>${p.life}</b></span>`;
    };
    const es = edgesOf(other);
    const opts = [0, 1, 2, 3].filter(e => e !== me).map(e =>
      `<button type="button" data-e="${e}" class="${duelOf(e) === duelOf(me) ? 'on' : ''}${pairArm === pairsFor(me, e) ? ' armed' : ''}">${pairArm === pairsFor(me, e) ? 'Tap again' : nameOf(e)}</button>`).join('');
    mini.innerHTML = `<button type="button" class="mini-bar" aria-label="Other game, tap to choose who you play">${side(es[0], 0)}<span class="mini-vs">v</span>${side(es[1], 1)}</button>` +
      `<div class="mini-pick"><p>${nameOf(me)} plays</p><div>${opts}</div></div>`;
  }
  function onMini(e) {
    const mini = e.currentTarget;
    if (e.target.closest('.mini-bar')) { mini.classList.toggle('open'); return; }
    const b = e.target.closest('.mini-pick button');
    if (!b) return;
    const opp = +b.dataset.e, me = state.me;
    applyPairs(pairsFor(me, opp));
  }

  function paintPairs() {
    const name = e => state.names[e].trim() || DEFAULT_NAMES[e];
    const me = pairMe(), others = [0, 1, 2, 3].filter(x => x !== me);
    document.querySelectorAll('#segPairs button').forEach((b, k) => {
      const e = others[k], pv = pairsFor(me, e);
      b.dataset.pv = pv;
      b.classList.toggle('on', pv === state.pairs);
      b.classList.remove('armed');
      b.textContent = name(e);
      b.setAttribute('aria-label', `${name(me)} plays ${name(e)}`);
    });
  }
  function disarm() {
    clearTimeout(armTimer);
    pairArm = null;
    sitArm = null;
    paintPairs();
    paintSitout();
    paintMini();
    newGameBtn.classList.remove('armed');
    newGameBtn.textContent = state.mode === ARCH ? 'New game' : 'New game at ' + state.start;
    aeArm = null;
    paintAe();
  }
  function openMenu() { syncMenu(); menu.hidden = false; }
  function closeMenu() { menu.hidden = true; openDeck = null; document.getElementById('resultsField').hidden = true; disarm(); }

  menu.addEventListener('click', e => { if (e.target === menu) closeMenu(); });
  document.getElementById('closeMenu').addEventListener('click', closeMenu);
  document.getElementById('closeMenuTop').addEventListener('click', closeMenu);
  // Games nobody has touched yet pick up a new starting life right away. Returns the patch to send.
  function setStart(v) {
    const fresh = KEYS.filter(k => untouched(k));
    state.start = v;
    fresh.forEach(k => { state.games[k] = blankGame(k); });
    const reset = { start: state.start };
    fresh.forEach(k => { reset['games/' + k] = state.games[k]; });
    return reset;
  }
  document.querySelectorAll('#segMode button').forEach(b => b.addEventListener('click', () => {
    state.mode = +b.dataset.v; marking = [];
    const patch = Object.assign(DEFAULT_START[state.mode] ? setStart(DEFAULT_START[state.mode]) : {}, { mode: state.mode });
    send(patch); save(); build(); syncMenu();
  }));
  document.querySelectorAll('#segStart button').forEach(b => b.addEventListener('click', () => {
    send(setStart(+b.dataset.v));
    save(); build(); syncMenu();
  }));
  document.querySelectorAll('#segLayout4 button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.v === 'ipad') state.ipad = true; else { state.ipad = false; state.layout4 = b.dataset.v; }
    save(); build(); syncMenu();
  }));
  document.querySelectorAll('#segLayout button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.v === 'ipad') state.ipad = true; else { state.ipad = false; state.layout2 = b.dataset.v; }
    save(); build(); syncMenu();
  }));
  // Turning sound on plays a turn sound, so it's clear the phone isn't muted.
  document.querySelectorAll('#segSound button').forEach(b => b.addEventListener('click', () => {
    state.sound = b.dataset.v; save(); syncMenu(); turnSound(true);
  }));
  // Logs game k if it finished, starts it over, and returns the patch to send.
  function resetGame(k) {
    record(k);
    state.games[k] = blankGame(k);
    if (SIZE[k] > 1) { state.turns[k] = null; state.clock[k] = blankClock(SIZE[k]); }
    const patch = { ['games/' + k]: state.games[k], ['turns/' + k]: null, ['clock/' + k]: null };
    // A new Archenemy game shuffles every scheme back into the deck.
    if (isArch(k) && state.scheme) { state.scheme = patch.scheme = reshuffled(state.scheme); undoStack = []; }

  }
  // New game starts over the games this phone shows: in the two 1v1s, a player's phone restarts
  // only their own 1v1, so the other pair plays on.
  newGameBtn.addEventListener('click', () => {
    if (viewKeys().every(k => untouched(k)) || newGameBtn.classList.contains('armed')) {
      send(Object.assign({}, ...viewKeys().map(resetGame), reroll()));
      marking = []; save(); build(); closeMenu(); askFirst();
      return;
    }
    newGameBtn.classList.add('armed');
    newGameBtn.textContent = 'Tap again to reset everyone';

  });
  [0, 1, 2, 3].forEach(i => {
    const input = document.getElementById('name' + i);
    input.addEventListener('input', e => {
      state.names[i] = e.target.value; send({ ['names/' + i]: state.names[i] }); save(); build(); syncMenu();
    });
    // Leaving the box empty (or holding someone else's name) puts the default name back. Typing the
    // name of whoever sits out of three players (v1.5) means they play instead: before the game
    // has begun that's done right away, and after, the note points to Sitting out.
    input.addEventListener('change', () => {
      if (!badName(i, input.value)) return;
      const typed = input.value.trim(), j = DEFAULT_NAMES.findIndex(d => d.toLowerCase() === typed.toLowerCase());
      state.names[i] = input.value = DEFAULT_NAMES[i];
      send({ ['names/' + i]: state.names[i] }); save(); build(); syncMenu();
      if (j < 0) return;
      let note = `${DEFAULT_NAMES[j]} has their own name box.`;
      if (state.mode === 3 && j === state.sitout) {
        if (untouched(3)) { applySitout(i); note = `${DEFAULT_NAMES[j]} plays and ${DEFAULT_NAMES[i]} sits out.`; }
        else note = `To play ${DEFAULT_NAMES[j]} instead of ${DEFAULT_NAMES[i]}, tap ${DEFAULT_NAMES[i]} under Sitting out.`;
      }
      const el = document.getElementById('nameNote');
      el.textContent = note; el.hidden = false;
      clearTimeout(el.t); el.t = setTimeout(() => { el.hidden = true; }, 6000);
    });
  });
  document.getElementById('pickFirst').addEventListener('click', () => { closeMenu(); hideAsk(); pickFirst(); });
  // The popup after New game (v1.48): tap it to pick, or it goes once any total changes (update()).
  const firstAsk = document.getElementById('firstAsk');
  function askFirst() {
    if (state.mode === 1 || state.mode === ARCH) return;
    askKeys = viewKeys(); firstAsk.hidden = false;
  }
  function hideAsk() { askKeys = null; firstAsk.hidden = true; }
  document.getElementById('firstAskGo').addEventListener('click', () => { hideAsk(); pickFirst(); });
  document.getElementById('firstAskX').addEventListener('click', hideAsk);

  // This phone's own seat (v1.53 cut the menu's Concede, its last user here; the layouts use it).
  const mySeat = () => Math.max(0, players.findIndex(p => p.e === state.me));

  // ---- Archenemy's scheme deck (v1.25) ----
  // The app's own deck of schemes, shared by the whole table: any phone can open it from the
  // archenemy's seat and make a move (handy for a Center phone or iPad), and each move sends the
  // whole deck. A scheme set in motion pops up on every phone. With Schemes set to Our cards, none
  // of this shows: the group plays its physical scheme deck and the app keeps the totals.
  const sheet = document.getElementById('schemeSheet'), schBody = document.getElementById('schBody');
  let undoStack = [], building = false, reveal = false, schFilter = '', rebuildArm = false, rebuildTimer = 0;
  const schClock = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  // Card text as paragraphs: reminder text in italics, {U}-style symbols as small tokens.
  const cardText = n => (isCard(n) ? CARDS[n][1] : '').split('\n').map(line =>
    '<p>' + esc(line).replace(/\(([^)]*)\)/g, '<i>($1)</i>').replace(/\{([^}]+)\}/g, '<span class="sym">$1</span>') + '</p>').join('');
  const schemesOn = () => state.mode === ARCH && state.schemes === 'app';
  // The button on the archenemy's seat names the scheme in motion, or what to do next.
  function paintSchemeBtn() {
    const s = state.scheme;
    const text = !s ? 'Schemes' : s.current || (s.deck.length ? 'Set in motion' : 'Schemes');
    app.querySelectorAll('.sch-btn').forEach(b => {
      b.querySelector('span').textContent = text;
      b.classList.toggle('live', !!(s && s.current));
      b.setAttribute('aria-label', s && s.current ? 'Scheme in motion: ' + s.current : 'Schemes');
    });
  }
  function openSchemes() {
    building = !state.scheme; schFilter = ''; rebuildArm = false;
    renderSchemes(); sheet.hidden = false; sheet.scrollTop = schBody.scrollTop = 0; wake();
  }
  function closeSchemes() { sheet.hidden = true; building = false; rebuildArm = false; }
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSchemes(); });
  document.getElementById('schClose').addEventListener('click', closeSchemes);

  function renderSchemes() {
    if (building || !state.scheme) return renderBuilder();
    const s = state.scheme, ae = nameOf(state.ae);
    document.getElementById('schTitle').textContent = s.turn ? 'Turn ' + s.turn : 'Schemes';
    let html = `<p class="sch-stat"><b>${s.deck.length}</b> in the deck${s.ongoing.length ? ` &middot; <b>${s.ongoing.length}</b> ongoing` : ''}</p>`;
    if (s.current) {
      html += `<article class="sch-card${reveal ? ' reveal' : ''}">
          <div class="sch-type">${isOngoing(s.current) ? 'Ongoing scheme' : 'Scheme'}</div>
          <div class="sch-nm">${esc(s.current)}</div>
          <div class="sch-text">${cardText(s.current)}</div>
        </article>` + (isOngoing(s.current)
        ? '<button type="button" class="action gold" data-act="keep">Keep it in play</button>'
        : '<button type="button" class="action gold" data-act="done">Done: to the bottom</button>');
    } else if (s.deck.length) {
      html += `<button type="button" class="sch-motion" data-act="motion">Set in motion</button>
        <p class="sch-note">${s.turn ? '' : ae + ' goes first. '}${ae} sets a scheme in motion at the start of each of their turns, before playing anything.</p>`;
    } else {
      html += '<p class="sch-note">The scheme deck is empty. Abandon an ongoing scheme to put it back.</p>';
    }
    if (s.ongoing.length) {
      html += `<div class="sch-og"><span>Ongoing</span>${s.ongoing.map((n, i) => `
        <div class="og"><div class="og-head"><b>${esc(n)}</b><button type="button" data-abandon="${i}">Abandon</button></div><div class="sch-text small">${cardText(n)}</div></div>`).join('')}</div>`;
    }
    html += `<div class="sch-foot">
        <button type="button" class="ghost" data-act="undo"${undoStack.length ? '' : ' disabled'}>Undo</button>
        <button type="button" class="ghost${rebuildArm ? ' armed' : ''}" data-act="rebuild">${rebuildArm ? 'Tap again' : 'New scheme deck'}</button>
      </div>`;
    if (s.log.length) html += `<details class="field sch-log"><summary>History</summary><ul>${s.log.map(l => `<li>${esc(l)}</li>`).join('')}</ul></details>`;
    schBody.innerHTML = html;
    reveal = false;
  }

  // Scheme moves; each sends the whole scheme deck. Undo is this phone's own moves.
  function schemeMove(fn) {
    const s = state.scheme;
    if (!s) return;
    undoStack.push(JSON.stringify(s));
    if (undoStack.length > 40) undoStack.shift();
    const line = fn(s);
    if (line) s.log.unshift(schClock() + ' · ' + line);
    s.log = s.log.slice(0, 40);
    send({ scheme: s });
    save(); renderSchemes(); paintSchemeBtn(); buzz(); wake();
  }
  schBody.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (building) return builderClick(b);
    if (b.dataset.abandon != null) {
      const i = +b.dataset.abandon;
      return schemeMove(s => { const n = s.ongoing.splice(i, 1)[0]; if (!n) return ''; s.deck.push(n); return 'Abandoned ' + n + '.'; });
    }
    switch (b.dataset.act) {
      case 'motion':
        reveal = true;
        return schemeMove(s => {
          if (s.current || !s.deck.length) return '';
          s.current = s.deck.shift(); s.turn++;
          return `Turn ${s.turn}: set ${s.current} in motion.`;
        });
      case 'done': return schemeMove(s => { const n = s.current; s.deck.push(n); s.current = ''; return n + ' went to the bottom.'; });
      case 'keep': return schemeMove(s => { const n = s.current; s.ongoing.push(n); s.current = ''; return n + ' stays in play.'; });
      case 'undo': {
        const prev = undoStack.pop();
        if (!prev) return;
        state.scheme = normScheme(JSON.parse(prev));
        send({ scheme: state.scheme });
        save(); renderSchemes(); paintSchemeBtn(); buzz();
        return;
      }
      case 'rebuild':
        // Mid-game it takes a second tap; the current deck stays until the new one is shuffled.
        clearTimeout(rebuildTimer);
        if (state.scheme.turn && !rebuildArm) {
          rebuildArm = true; renderSchemes();
          rebuildTimer = setTimeout(() => { rebuildArm = false; if (!sheet.hidden && !building) renderSchemes(); }, 3000);
          return;
        }
        rebuildArm = false; building = true; schFilter = ''; renderSchemes(); schBody.scrollTop = 0;
    }
  });

  // The deck builder: deal at random from the sets picked, start from a Duskmourn Commander deck's
  // ten, or tick schemes by hand. The picks are kept on this phone.
  function renderBuilder() {
    document.getElementById('schTitle').textContent = 'Scheme deck';
    const pick = state.pick, sel = new Set(pick.selected), sets = new Set(pick.sets);
    const pool = poolFor(pick.sets), f = schFilter.trim().toLowerCase(), n = sel.size;
    const groups = SETS.map(([title, names]) => {
      const shown = names.filter(x => !f || x.toLowerCase().includes(f));
      if (!shown.length) return '';
      return `<div class="set-group"><h3>${esc(title)}<span>${names.filter(x => sel.has(x)).length} / ${names.length}</span></h3>${shown.map(x => `
        <label class="sch-row${sel.has(x) ? ' on' : ''}"><input type="checkbox" data-pick="${esc(x)}"${sel.has(x) ? ' checked' : ''}><span>${esc(x)}${isOngoing(x) ? '<em>Ongoing</em>' : ''}</span></label>`).join('')}</div>`;
    }).join('');
    const top = schBody.scrollTop;
    const ours = OURS.length === sel.size && OURS.every(x => sel.has(x));
    schBody.innerHTML = `
      <div class="field">
        <span>The cards we own</span>
        <div class="chips"><button type="button" data-ours aria-pressed="${ours}">Archenemy: Nicol Bolas<span>${OURS.length}</span></button></div>
      </div>
      <div class="field">
        <span>Or deal at random from</span>
        <div class="chips">${SETS.map(([t]) => `<button type="button" data-set="${esc(t)}" aria-pressed="${sets.has(t)}">${esc(t)}<span>${SET_POOLS[t].length}</span></button>`).join('')}</div>
        <button type="button" class="action" data-deal${pool.length ? '' : ' disabled'}>Deal ${Math.min(DEAL, pool.length)} at random</button>
      </div>
      <div class="field">
        <span>Or a Duskmourn Commander deck's ten</span>
        <div class="chips">${Object.keys(PRESETS).map(p => `<button type="button" data-preset="${esc(p)}" aria-pressed="${PRESETS[p].length === sel.size && PRESETS[p].every(x => sel.has(x))}">${esc(p)}</button>`).join('')}</div>
      </div>
      <div class="field">
        <span>Or pick your own</span>
        <input class="search" id="schFilter" type="search" placeholder="Filter by name" value="${esc(schFilter)}" autocomplete="off">
      </div>
      ${groups || '<p class="sch-note">No scheme matches that.</p>'}
      <div class="sch-build-foot">
        <p>${n >= MIN_SCHEMES ? n + ' schemes' : n + ' of ' + MIN_SCHEMES}</p>
        ${state.scheme ? '<button type="button" class="ghost" data-cancel>Cancel</button>' : ''}
        <button type="button" class="action gold" data-start${n < MIN_SCHEMES ? ' disabled' : ''}>Shuffle and start</button>
      </div>`;
    schBody.scrollTop = top;
  }
  function builderClick(b) {
    const pick = state.pick;
    if (b.dataset.set) {
      const t = b.dataset.set, cur = new Set(pick.sets);
      cur.has(t) ? cur.delete(t) : cur.add(t);
      pick.sets = SETS.map(x => x[0]).filter(x => cur.has(x));
    } else if (b.hasAttribute('data-ours')) {
      pick.selected = OURS.slice();
    } else if (b.dataset.preset != null) {
      pick.selected = PRESETS[b.dataset.preset].slice();
    } else if (b.hasAttribute('data-deal')) {
      pick.selected = shuffle(poolFor(pick.sets)).slice(0, DEAL);
    } else if (b.hasAttribute('data-cancel')) {
      building = false; renderSchemes(); return;
    } else if (b.hasAttribute('data-start')) {
      const list = pick.selected.filter(isCard);
      if (list.length < MIN_SCHEMES) return;
      state.scheme = normScheme({ deck: shuffle(list), ongoing: [], current: '', turn: 0, log: [schClock() + ' · Shuffled ' + list.length + ' schemes.'] });
      undoStack = []; building = false;
      send({ scheme: state.scheme });
      save(); renderSchemes(); paintSchemeBtn(); buzz(); schBody.scrollTop = 0;
      return;
    } else return;
    save(); renderBuilder();
  }
  schBody.addEventListener('change', e => {
    const n = e.target.dataset.pick;
    if (!n || !building) return;
    const pick = state.pick;
    pick.selected = e.target.checked ? [...new Set([...pick.selected, n])] : pick.selected.filter(x => x !== n);
    save(); renderBuilder();
  });
  schBody.addEventListener('input', e => {
    if (e.target.id !== 'schFilter') return;
    schFilter = e.target.value; renderBuilder();
    const el = document.getElementById('schFilter');
    el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  });
  // A scheme deck changed by another phone: a new scheme in motion pops up here too.
  function schemeArrived(was) {
    const s = state.scheme;
    undoStack = [];
    paintSchemeBtn();
    const fresh = s && s.current && (!was || was.current !== s.current);
    if (fresh && schemesOn() && menu.hidden) {
      reveal = true;
      if (sheet.hidden) openSchemes(); else if (!building) renderSchemes();
      try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch (e) {}
      return;
    }
    if (!sheet.hidden && !building) renderSchemes();
  }

  // ---- results ----
  // A game is logged when it finishes (see settle()), and again, harmlessly, when New game is tapped,
  // in case it finished on a phone that couldn't log it. Only a real finish counts: a table of two or
  // more, exactly one player left standing, and at least MIN_GAME_MINUTES on its clock. Results are
  // stored under the game's id, so logging it twice just writes the same entry. A result Firebase
  // won't take waits on this phone and goes up next time.
  const loadMine = () => { try { return JSON.parse(localStorage.getItem(RESULTS_KEY)) || {}; } catch (e) { return {}; } };
  const saveMine = all => { try { localStorage.setItem(RESULTS_KEY, JSON.stringify(all)); } catch (e) {} };
  const resultUrl = id => RESULTS_URL + (id ? '/' + id : '') + '.json';

  function record(k) {
    const n = SIZE[k], g = state.games[k], m = state.meta[k];
    if (n === 1 || !m.id || !m.at) return;
    const won = winners(k);
    const end = m.end || Date.now();
    const minutes = Math.round((end - m.at) / 60000);
    if (!won || minutes < MIN_GAME_MINUTES) return;
    // The turn in progress when the game ended runs to the end.
    const c = state.clock[k], cur = state.turns[k];
    const turnMs = i => (c.t[i] || 0) + (i === cur && c.at ? Math.max(0, end - c.at) : 0);
    const result = {
      at: end, minutes, players: n, start: isArch(k) ? AE_LIFE : state.start, turns: c.count || 0,
      // Archenemy games say so, and which seat was the archenemy (v1.25).
      ...(isArch(k) ? { mode: 'archenemy', schemes: state.schemes } : {}),
      seats: g.map((p, i) => {
        const e = edgesOf(k)[i];
        return {
          name: state.names[e].trim() || DEFAULT_NAMES[e], colors: bgOf(e),
          // No deck while decks aren't picked; `colors` is then just the background.
          deck: SHOW_DECKS ? DECKS[colorOf(e).slice(2)].name : '',
          life: p.life, out: outReason(p) || null, won: won.includes(i),
          ...(isArch(k) ? { ae: i === state.ae } : {}),
          turns: c.c[i] || 0, turnSecs: Math.round(turnMs(i) / 1000),
        };
      }),
    };
    const mine = loadMine();
    mine[m.id] = Object.assign({ pending: true }, result);
    saveMine(mine);
    upload(m.id, result);
  }
  function unlog(id) {
    const mine = loadMine();
    if (mine[id]) { delete mine[id]; saveMine(mine); }
    if (DB) fetch(resultUrl(id), { method: 'DELETE' }).catch(() => {});
  }
  function upload(id, result) {
    if (!DB) return Promise.resolve(false);
    return fetch(resultUrl(id), { method: 'PUT', body: JSON.stringify(result) })
      .then(res => {
        if (!res.ok) return false;
        const mine = loadMine();
        if (mine[id]) { delete mine[id].pending; saveMine(mine); }
        return true;
      })
      .catch(() => false);
  }

  const resultsEl = document.getElementById('results');
  const okResult = r => r && typeof r.at === 'number' && Array.isArray(r.seats);
  // Results from before v3.21 have only colors, and each color pair is one deck.
  const deckOf = x => typeof x.deck === 'string' ? x.deck : DECKS[x.colors] ? DECKS[x.colors].name : '';
  function showResults(all, note) {
    const list = Object.keys(all).filter(id => okResult(all[id])).sort((a, b) => all[b].at - all[a].at);
    resultsEl.innerHTML = (note ? `<p class="res-note">${esc(note)}</p>` : '') + (list.length ? list.map(id => {
      const r = all[id], win = r.seats.find(x => x.won) || {};
      // Archenemy: the heroes win as a team.
      const title = r.mode !== 'archenemy' ? esc(win.name) + ' won' : win.ae ? esc(win.name) + ', the archenemy, won' : 'The heroes beat ' + esc((r.seats.find(x => x.ae) || {}).name || 'the archenemy');
      const day = new Date(r.at).toLocaleDateString([], { month: 'short', day: 'numeric' });
      return `<div class="res-row">
        <div class="res-head"><b>${title}</b><span>${r.mode === 'archenemy' ? 'Archenemy &middot; ' : ''}${deckOf(win) ? esc(deckOf(win)) + ' &middot; ' : ''}${day} &middot; ${+r.minutes || 0} min${r.turns ? ` &middot; ${+r.turns} turns` : ''}${r.pending ? ' &middot; this phone only' : ''}</span>
          <button type="button" class="res-del" data-id="${esc(id)}">Delete</button></div>
        <div class="res-players">${r.seats.map(x => `<span class="${ARTS.includes(x.colors) ? 'k-' + x.colors : ''}${x.won ? ' won' : ''}" title="${esc(deckOf(x))}">${ARTS.includes(x.colors) ? swatch(x.colors) : '<i class="sw"></i>'}${esc(x.name)}${x.turns ? ` ${Math.round((+x.turnSecs || 0) / 60)}m` : ''}</span>`).join('')}</div>
      </div>`;
    }).join('') : '<p class="res-note">No finished games logged yet.</p>');
  }
  // The shared log, plus anything this phone logged that hasn't reached it yet (sent up now).
  let shown = {};
  function loadResults() {
    const mine = loadMine(), pending = {};
    Object.keys(mine).forEach(id => { if (mine[id].pending) pending[id] = mine[id]; });
    shown = Object.assign({}, mine);
    showResults(shown, 'Loading the shared log…');
    if (!DB) return showResults(shown, "Showing this phone's games.");
    fetch(resultUrl())
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(remote => {
        shown = Object.assign({}, remote && typeof remote === 'object' ? remote : {}, pending);
        showResults(shown);
        Object.keys(pending).forEach(id => upload(id, Object.assign({}, pending[id], { pending: undefined })));
      })
      .catch(() => showResults(shown, "Couldn't reach the shared log. Showing this phone's games."));
  }
  document.getElementById('resultsField').addEventListener('toggle', e => { if (e.target.open) loadResults(); });
  // The log stays out of sight: tapping the version line at the foot of the menu shows or hides it.
  const resultsField = document.getElementById('resultsField');
  document.getElementById('ver').addEventListener('click', () => {
    resultsField.hidden = !resultsField.hidden;
    resultsField.open = !resultsField.hidden;
    if (!resultsField.hidden) resultsField.scrollIntoView({ block: 'nearest' });
  });
  resultsEl.addEventListener('click', e => {
    const b = e.target.closest('.res-del');
    if (!b) return;
    if (!b.classList.contains('armed')) {
      resultsEl.querySelectorAll('.res-del.armed').forEach(x => { x.classList.remove('armed'); x.textContent = 'Delete'; });
      b.classList.add('armed'); b.textContent = 'Tap again';
      return;
    }
    unlog(b.dataset.id);
    delete shown[b.dataset.id]; showResults(shown);
  });

  // Random first player: the highlight runs around the table clockwise and slows to a stop. A Center
  // phone in the two 1v1s picks for both at once.
  // The winner then stays lit for 8 s with everyone else dimmed. A second pick cancels the first.
  const pickTimers = {};
  function pickFirst() {
    viewKeys().forEach(key => {
      const group = players.map((p, i) => i).filter(i => players[i].k === key);
      const own = group.map(i => seats[i]), n = group.length;
      const winner = Math.floor(Math.random() * n);
      const steps = 3 * n + winner + n * Math.floor(Math.random() * 2);
      const clear = () => own.flat().forEach(s => {
        s.classList.remove('lit', 'first', 'passed'); s.querySelector('.badge').hidden = true;
      });
      clearTimeout(pickTimers[key]);
      clear();
      let k = 0;
      const tick = () => {
        own.flat().forEach(s => s.classList.remove('lit'));
        // Backwards through the seats, which is clockwise, the way turns pass.
        const idx = (n - k % n) % n;
        if (k >= steps) {
          own.forEach((list, j) => list.forEach(s => s.classList.add(j === idx ? 'first' : 'passed')));
          own[idx].forEach(s => { s.querySelector('.badge').hidden = false; });
          try { navigator.vibrate && navigator.vibrate([80, 60, 80]); } catch (e) {}
          pickTimers[key] = setTimeout(clear, 8000);
          return;
        }
        own[idx].forEach(s => s.classList.add('lit'));
        buzz();
        k++;
        pickTimers[key] = setTimeout(tick, 60 + k * k * 1.6);
      };
      tick();
    });
  }

  // ---- live sync ----
  // Every device on the link shares one table in a Firebase Realtime Database, reached through its
  // REST API: a server-sent event stream delivers the table and every change to it, and taps go up
  // as server-side increments so taps on two phones at once both count. Without the database the
  // page keeps working on its own.
  const DB = 'https://commander-life-39708-default-rtdb.firebaseio.com';
  const TABLE_URL = DB + '/tables/t7q2xm4k.json';
  // Logged games sit beside the table, not in it, so nothing that resets the table touches them.
  // They stay under tables/, the only part of the database its rules open to the page.
  const RESULTS_URL = DB + '/tables/t7q2xm4k-results';

  const inc = d => ({ '.sv': { increment: d } });
  const allPaths = () => ['mode', 'start', 'pairs', 'sitout', 'ae', 'schemes', 'speaker/id', 'speaker/me', 'speaker/at', 'bgs/0', 'bgs/1', 'bgs/2', 'bgs/3', 'names/0', 'names/1', 'names/2', 'names/3',
    'colors/0', 'colors/1', 'colors/2', 'colors/3']
    .concat(...KEYS.map(k => [].concat(...Array.from({ length: SIZE[k] }, (_, i) =>
      ['life', 'cmd/0', 'cmd/1', 'cmd/2', 'conceded'].map(f => `games/${k}/${i}/${f}`)))),
      ...KEYS.map(k => [`meta/${k}/id`, `meta/${k}/at`, `meta/${k}/end`]), TURN_KEYS.map(k => 'turns/' + k),
      ...TURN_KEYS.map(k => [`clock/${k}/at`, `clock/${k}/count`].concat(
        ...Array.from({ length: SIZE[k] }, (_, i) => [`clock/${k}/t/${i}`, `clock/${k}/c/${i}`]))));
  const getAt = (root, path) => path.split('/').reduce((o, k) => o == null ? undefined : o[k], root);
  function setAt(path, v) {
    const keys = path.split('/'), last = keys.pop();
    keys.reduce((o, k) => o[k], state)[last] = v;
  }
  const shared = () => ({ mode: state.mode, start: state.start, pairs: state.pairs, sitout: state.sitout, ae: state.ae, schemes: state.schemes, scheme: state.scheme, speaker: state.speaker, bgs: state.bgs, names: state.names, colors: state.colors, games: state.games, meta: state.meta, turns: state.turns, clock: state.clock });

  // Own writes in flight (v1.21). The stream echoes each write back a round trip later, so during
  // fast taps it brought back totals this phone had already moved past (tap 40 to 37, then the
  // echo of the first tap showed 39 again): every phone's totals bounced, which read as heavy lag.
  // Now a path this phone is still writing is left alone (`pending`, per path), and HOLD ms after
  // its last write lands the table's value is taken, by then including every tap from every phone.
  const HOLD = 700;
  const pending = {}, landed = {}, trips = [];
  const held = p => pending[p] > 0 || Date.now() - (landed[p] || 0) < HOLD;
  // Increments fall back to plain values if the database refuses them.
  function send(patch) {
    if (!DB) return;
    const body = JSON.stringify(patch), keys = Object.keys(patch), t0 = Date.now();
    const plain = {};
    keys.forEach(k => { plain[k] = patch[k] && patch[k]['.sv'] ? getAt(state, k) : patch[k]; pending[k] = (pending[k] || 0) + 1; });
    const done = () => {
      const now = Date.now();
      trips.push(now - t0); if (trips.length > 15) trips.shift();
      keys.forEach(k => { pending[k] = Math.max(0, pending[k] - 1); if (!pending[k]) landed[k] = now; });
      showVer();
      setTimeout(() => { if (mirror) adopt(); }, HOLD + 50);
    };
    fetch(TABLE_URL, { method: 'PATCH', body })
      .then(res => {
        if (!res.ok && body !== JSON.stringify(plain)) return fetch(TABLE_URL, { method: 'PATCH', body: JSON.stringify(plain) });
      })
      .catch(() => {})
      .then(done);
  }

  function validValue(p, v) {
    if (p === 'mode') return MODES.includes(v);
    if (p === 'pairs') return [1, 2, 3].includes(v);
    if (p === 'sitout' || p === 'ae') return [0, 1, 2, 3].includes(v);
    if (p === 'schemes') return ['app', 'cards'].includes(v);
    if (p === 'speaker/id') return v === null || (typeof v === 'string' && /^[a-z0-9]{6,16}$/.test(v));
    if (p === 'speaker/me') return v === null || [0, 1, 2, 3, CENTER].includes(v);
    if (p === 'speaker/at') return v === null || (typeof v === 'number' && isFinite(v) && v > 0);
    if (p.startsWith('bgs/')) return ARTS.includes(v);
    if (p === 'start') return [20, 30, 40].includes(v);
    // A blank or wrong-box name from another phone (or someone mid-edit) is ignored; see badName.
    if (p.startsWith('names/')) return typeof v === 'string' && v.length <= 12 && !badName(+p.slice(6), v);
    if (p.startsWith('colors/')) return Object.prototype.hasOwnProperty.call(SCHEMES, v);
    if (p.endsWith('/conceded')) return typeof v === 'boolean';
    if (p.startsWith('clock/')) return v === null || (typeof v === 'number' && isFinite(v) && v >= 0);
    if (p.startsWith('turns/')) return v === null || (Number.isInteger(v) && v >= 0 && v < SIZE[p.slice(6)]);
    if (p.startsWith('meta/')) return v === null || (p.endsWith('/id') ? typeof v === 'string' && v.length <= 24 : typeof v === 'number' && isFinite(v));
    return typeof v === 'number' && isFinite(v) && Math.abs(v) < 1e6;
  }
  // Write `data` into the local copy of the table at `path`; null removes it.
  let mirror = null;
  function putIn(path, data) {
    const keys = path.split('/').filter(Boolean);
    if (!keys.length) { mirror = data; return; }
    if (!mirror || typeof mirror !== 'object') mirror = {};
    const last = keys.pop();
    const parent = keys.reduce((o, k) => (o[k] = o[k] && typeof o[k] === 'object' ? o[k] : {}), mirror);
    if (data === null) delete parent[last]; else parent[last] = data;
  }

  // Take every value the table holds over this phone's own.
  function adopt() {
    const changed = [];
    // Put back any blank or wrong-box name the table holds, unless someone here is typing it.
    const fix = {};
    [0, 1, 2, 3].forEach(i => {
      const v = getAt(mirror, 'names/' + i);
      if (typeof v === 'string' && badName(i, v) && document.activeElement !== document.getElementById('name' + i)) fix['names/' + i] = state.names[i];
    });
    // A table from before v1.6 has no backgrounds: this phone's own go up, so every phone shows the same.
    if (mirror && typeof mirror === 'object' && !mirror.bgs) state.bgs.forEach((b, e) => { fix['bgs/' + e] = b; });
    if (Object.keys(fix).length) send(fix);
    allPaths().forEach(p => {
      let v = getAt(mirror, p);
      const was = getAt(state, p);
      // A seat reset by a phone from before v3.0 carries no concession: it's back in.
      if (v === undefined && p.endsWith('/conceded') && getAt(mirror, p.slice(0, -'/conceded'.length))) v = false;
      // A table that holds no meta, turn or turn timer (cleared, or set up by an older phone) has none.
      if (v === undefined && /^(meta|turns|clock|speaker)\//.test(p) && mirror && typeof mirror === 'object') v = null;
      if (v !== undefined && v !== was && !held(p) && validValue(p, v)) { setAt(p, v); changed.push({ p, was }); }
    });
    hearPing();
    // The scheme deck (v1.25) goes up and comes back whole. While this phone's own move is still on
    // its way it's left alone, like any path (see held()). A table without one has none.
    if (mirror && typeof mirror === 'object' && !held('scheme')) {
      const sch = normScheme(mirror.scheme);
      if (JSON.stringify(sch) !== JSON.stringify(state.scheme)) {
        const was = state.scheme;
        state.scheme = sch;
        save();
        schemeArrived(was);
      }
    }
    // The speaker setting changes only the menu and the wake-up note, never the board.
    if (changed.some(x => x.p.startsWith('speaker/'))) syncSpeaker();
    changed.splice(0, changed.length, ...changed.filter(x => !x.p.startsWith('speaker/')));
    if (!changed.length) { save(); return; }
    save();
    if (changed.some(x => !/^(games|meta|turns|clock)\//.test(x.p))) {
      if (changed.some(x => ['mode', 'pairs', 'sitout', 'ae'].includes(x.p))) marking = [];
      build();
      if (!menu.hidden) syncMenu();
      return;
    }
    changed.forEach(({ p, was }) => {
      const [kind, k, j, f] = p.split('/');
      if (kind !== 'games') return;
      const i = players.findIndex(x => String(x.k) === k && x.j === +j);
      if (i < 0) return;
      if (f === 'life') showDelta(i, getAt(state, p) - was);
      update(i);
    });
    paintMini();
  }

  // ---- speaker phone (v1.20) ----
  // Usually only one phone is hooked up to the table's speaker. When it's set as the speaker phone,
  // every other phone's turn button (and its knockout and win sounds) sends a ping through the live
  // table instead of playing, and the speaker phone plays it: a clip from its own shuffled pools,
  // so nothing repeats across the table either. Life ticks still play on the phone that was tapped.
  // The speaker phone checks in every 30 s; if it hasn't for 90 s (it slept, or left), or this
  // phone is offline, each phone plays its own again so no tap goes silent.
  let live = false, pingSeen = null;
  const amSpeaker = () => state.speaker.id === state.phone;
  const speakerFresh = () => !!state.speaker.id && Date.now() - (state.speaker.at || 0) < 90e3;
  // v1.60: state.mineHere (this phone only, never synced) keeps this phone's own button sounds local
  // even while another phone is the speaker, so an iPad on the soundbar can play everyone else's.
  const remoteSpeaker = () => live && speakerFresh() && !amSpeaker() && !state.mineHere;
  function ring(k) { send({ 'ping/n': inc(1), 'ping/k': k, 'ping/by': state.phone }); }
  // A ping counts up; the speaker plays each new one. The first count a connection sees is only noted.
  function hearPing() {
    const n = getAt(mirror, 'ping/n'), k = getAt(mirror, 'ping/k');
    if (typeof n !== 'number' || pingSeen === null) return;
    if (n <= pingSeen) { pingSeen = n; return; }
    pingSeen = n;
    if (!amSpeaker() || getAt(mirror, 'ping/by') === state.phone) return;
    if (k === 'turn') turnSound(true);
    else if (k === 'out' || k === 'win') play(k, true);
  }
  function checkIn() {
    if (!amSpeaker() || document.visibilityState !== 'visible') return;
    wake();
    state.speaker.at = Date.now(); save();
    send({ 'speaker/at': state.speaker.at });
  }
  setInterval(checkIn, 30e3);
  document.addEventListener('visibilitychange', () => { checkIn(); unlock(); });
  function setSpeaker(here) {
    state.speaker = here ? { id: state.phone, me: state.me, at: Date.now() } : { id: null, me: null, at: null };
    send({ 'speaker/id': state.speaker.id, 'speaker/me': state.speaker.me, 'speaker/at': state.speaker.at });
    save(); syncSpeaker();
    if (here) { unlock(); wake(); turnSound(true); }
  }
  function syncSpeaker() {
    const here = amSpeaker(), other = !!state.speaker.id && !here;
    document.querySelectorAll('#segSpeaker button').forEach(b =>
      b.classList.toggle('on', b.dataset.v === (here ? 'here' : other ? '' : 'each')));
    document.getElementById('speakerNow').textContent = here ? 'This phone' : other && speakerFresh() ? 'Another phone' : 'Each phone';
    document.getElementById('mineBox').hidden = here;
    document.querySelectorAll('#segMine button').forEach(b => b.classList.toggle('on', (b.dataset.v === 'here') === !!state.mineHere));
    const e = state.speaker.me;
    const who = e === CENTER ? 'The Center phone' : e != null ? (state.names[e].trim() || DEFAULT_NAMES[e]) + "'s phone" : 'Another phone';
    document.getElementById('speakerNote').textContent =
      here ? 'Every turn button plays here. Keep this phone awake with the page open.'
      : other && speakerFresh() ? who + ' plays every turn button (it\'s on the speaker).'
      : other ? who + ' was the speaker but hasn\'t checked in, so each phone plays its own for now.'
      : 'Each phone plays its own turn button. Pick This phone on the one hooked up to the speaker.';
  }
  document.querySelectorAll('#segSpeaker button').forEach(b => b.addEventListener('click', () => setSpeaker(b.dataset.v === 'here')));
  document.querySelectorAll('#segMine button').forEach(b => b.addEventListener('click', () => {
    state.mineHere = b.dataset.v === 'here'; save(); syncSpeaker(); turnSound(true);
  }));
  // After a reload the speaker phone can't make sound until someone touches it, so it says so.

  // The footer shows the typical round trip of this phone's writes (v1.21), to see how fast each
  // device really syncs.
  function showVer() {
    // v1.53: just the version (the user cut "Sharing live with this table" and the round trip);
    // "offline" still shows when the phone has lost the table, since then it isn't syncing.
    document.getElementById('ver').textContent = 'v' + VERSION + (live ? '' : ' · offline');
  }
  function setLive(on) { live = on; showVer(); }
  let stream = null;
  function connect() {
    if (stream) stream.close();
    pingSeen = null;
    stream = new EventSource(TABLE_URL);
    stream.onopen = () => setLive(true);
    stream.onerror = () => setLive(stream.readyState === EventSource.OPEN); // it reconnects by itself
    stream.addEventListener('put', e => {
      const { path, data } = JSON.parse(e.data);
      // The first device here starts the table from its own game.
      if (path === '/' && data === null) {
        fetch(TABLE_URL, { method: 'PUT', body: JSON.stringify(shared()) }).catch(() => {});
        pingSeen = 0;
        return;
      }
      putIn(path, data);
      if (path === '/') pingSeen = getAt(mirror, 'ping/n') || 0;
      adopt();
    });
    stream.addEventListener('patch', e => {
      const { path, data } = JSON.parse(e.data);
      Object.keys(data).forEach(k => putIn(path + '/' + k, data[k]));
      adopt();
    });
    // The database ended the stream (its rules changed): carry on alone.
    stream.addEventListener('cancel', () => { stream.close(); setLive(false); });
  }
  setLive(false);
  if (DB && 'EventSource' in window) {
    connect();
    // A phone that slept may hold a dead stream; a fresh one brings the whole table back.
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') connect(); });
  }

  build();
  checkIn();
  sfyReturn().then(() => { sfyPaint(); syncSfy(); sfyKick(0); });
  // Sound on at load where the browser allows it (otherwise the first touch does it).
  unlock();
})();
</script>
</body>
</html>
