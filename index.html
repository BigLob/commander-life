/* The card fonts, served from fonts/: Matrix Bold (old card names) for names and totals, MPlantin
   (rules text) for everything else. Each has one weight, declared across the range so the browser
   never smears on a fake bold. Both are kept to plain ASCII (and Matrix's minus): their other
   symbols are blank or point at the wrong letters, so those fall back to Georgia. Matrix-Bold.woff
   has its line metrics fixed (the original's put the descent above the baseline and clipped names). */
@font-face { font-family: "Matrix"; src: url(fonts/Matrix-Bold.woff) format("woff"); font-weight: 100 900; font-display: swap; unicode-range: U+20-7E, U+2212; }
@font-face { font-family: "MPlantin"; src: url(fonts/Mplantin.woff) format("woff"); font-weight: 100 900; font-display: swap; unicode-range: U+20-7E; }

  --ink: #f4efe4;

  --turn: #ff4fa3;

  --f-ui: "MPlantin", Georgia, serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Color pairs players pick from: the seat in the first color, with the second laid over 30% of it
   in the player's chosen pattern. White only ever comes second, so the seat stays mostly dark. */
.k-gr { --seat: #2a6238; --seat-hi: #3f8a50; --accent: #c0442f; }
.k-uw { --seat: #1b4a84; --seat-hi: #2c69b3; --accent: #d9ccab; }
.k-rb { --seat: #8e2a1f; --seat-hi: #c0442f; --accent: #121014; }
.k-bu { --seat: #17161b; --seat-hi: #34303d; --accent: #2c69b3; }
.k-gw { --seat: #2a6238; --seat-hi: #3f8a50; --accent: #d9ccab; }

[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--table); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--table); color: var(--ink);
  font-family: var(--f-ui); font-size: 16px;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; touch-action: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--hot); outline-offset: -3px; }

#app {
  position: relative; height: 100%;
  padding-block: 6px;
  padding-left: max(6px, env(safe-area-inset-left, 0px));
  padding-right: max(6px, env(safe-area-inset-right, 0px));
}
/* Pinned: when the device turns, the board turns back so seats stay on the same physical edge. */
#app.pinned {
  position: fixed; top: 50%; left: 50%;
  width: var(--pin-w); height: var(--pin-h);
  transform: translate(-50%, -50%) rotate(var(--spin));
}
.board { height: 100%; display: grid; gap: 6px; }
.board.n2 { grid-template-areas: "top" "bottom"; grid-template-rows: 1fr 1fr; }
.board.n3 {
  grid-template-areas: "left right" "bottom bottom";
  grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr;
}
.board.n4 {
  grid-template-areas: "top top" "left right" "bottom bottom";
  grid-template-rows: 1.2fr 1.6fr 1.2fr; grid-template-columns: 1fr 1fr;
}
.board.n1 { grid-template: 1fr / 1fr; }
/* Head to head, side by side: each half of the phone faces one player and shows both totals, theirs
   on the left, so each player's colors run down one side. The top half is turned to the far player. */
.board.duel { grid-template: "tl tr" 1fr "bl br" 1fr / 1fr 1fr; }
.d-tl { grid-area: tl; }
.d-tr { grid-area: tr; }
.d-bl { grid-area: bl; }
.d-br { grid-area: br; }
.d-tl .face, .d-tr .face { --rot: 180deg; }

.seat {
  position: relative; overflow: hidden; border-radius: 18px;
  background: radial-gradient(120% 90% at 50% 45%, var(--seat-hi), var(--seat));
  transition: filter .3s;
}
.seat.out { filter: grayscale(.85) brightness(.7); }
.seat.marking::before {
  content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  border: 4px solid var(--ink); border-radius: inherit;
}
.seat.pick::after {
  content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none;
  border: 4px solid var(--ink); border-radius: inherit;
}

/* The face is the seat as its player sees it. Side seats are rotated toward their table edge.
   Script measures each seat and face into --sw/--sh and --cqw/--cqh (1% of width/height), standing
   in for container query units so older iPads (Safari 14/15) lay out the same. */
.face::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: var(--accent);
  -webkit-mask: var(--pattern) 0 0 / 100% 100% no-repeat; mask: var(--pattern) 0 0 / 100% 100% no-repeat;
}
/* The "Commander art" wallpaper: the seat's deck's commander art fills the face, turned with it so
   it's upright for its player, dimmed a little so the white totals stay readable. */
/* "Deck card": the top half of the picked card (name and art), scaled so that half covers the face. */
.face.carded::before {
  background: linear-gradient(rgba(0, 0, 0, .22), rgba(0, 0, 0, .22)), var(--card);
  background-size: 100% 100%, max(100%, calc(143.5 * var(--cqh, 1vh))) auto;
  background-position: 0 0, center top; background-repeat: no-repeat;
  -webkit-mask: none; mask: none;
}
.patterns button.carded::before { background: var(--card) center top / 100% auto no-repeat; -webkit-mask: none; mask: none; }
.face.arty::before, .patterns button.arty::before {
  background: linear-gradient(rgba(0, 0, 0, .22), rgba(0, 0, 0, .22)), var(--art) center / cover no-repeat;
  -webkit-mask: none; mask: none;
}
.face {
  position: absolute; top: 50%; left: 50%;
  width: calc(100 * var(--sw, 1vw)); height: calc(100 * var(--sh, 1vh));
  transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
}
/* Square table, one player per phone edge, clockwise from the bottom. Seat classes name the edge. */
.table .s0 { grid-area: bottom; }
.table .s1 { grid-area: left; }
.table .s2 { grid-area: top; }
.table .s3 { grid-area: right; }
.table .s1 .face, .table .s3 .face { width: calc(100 * var(--sh, 1vh)); height: calc(100 * var(--sw, 1vw)); }
.table .s1 .face { --rot: 90deg; }
.table .s2 .face { --rot: 180deg; }
.table .s3 .face { --rot: -90deg; }
/* On a player's own phone every seat faces them: no turning, side seats stay tall. */
.table.upright .face { --rot: 0deg; }
.table.upright .s1 .face, .table.upright .s3 .face { width: calc(100 * var(--sw, 1vw)); height: calc(100 * var(--sh, 1vh)); }
/* At four, the side seats are tall and meet at the menu button: + takes their top half, - the bottom. */
/* - and + always sit left and right of the total, level with it (v3.24): each zone is lifted by the
   same padding as the readout, so their centers line up. */
.table .zone { padding-bottom: calc(18 * var(--cqh, 1vh)); }
.n4 .zone { padding-bottom: calc(32 * var(--cqh, 1vh)); }

.zone {
  position: absolute; top: 0; bottom: 0; width: 50%;
  border: 0; background: transparent; padding: 0;
  color: var(--ink-2); touch-action: none;
  /* Sized by width too, so narrow seats keep room for the total between the signs. */
  font-family: var(--f-num); font-weight: 700; font-size: clamp(24px, min(calc(22 * var(--cqh, 1vh)), calc(15 * var(--cqw, 1vw))), 64px);
  display: flex; align-items: center;
  transition: background .12s;
}
.zone.minus { left: 0; justify-content: flex-start; padding-left: calc(6 * var(--cqw, 1vw)); }
.zone.plus { right: 0; justify-content: flex-end; padding-right: calc(6 * var(--cqw, 1vw)); }
.zone.press { background: rgba(255, 255, 255, .1); transition: none; }

.readout {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.name {
  position: absolute; top: calc(7 * var(--cqh, 1vh)); left: 0; right: 0; text-align: center;
  /* --fit shrinks a name that would overflow its seat, so every name shows in full on one line. */
  font-family: var(--f-name); font-size: calc(clamp(15px, calc(13 * var(--cqh, 1vh)), 34px) * var(--fit, 1)); font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink);
  /* Same black outline as the life total, thicker for the small type. */
  -webkit-text-stroke: .14em #000; paint-order: stroke fill;
}
.name .nm { display: inline-block; }
.name .why { display: block; margin-top: .2em; font-size: calc(.7em * var(--wfit, 1)); color: var(--ink); }
/* Corner names keep clear of the menu button in the middle of the table. */
.table .name { left: calc(6 * var(--cqw, 1vw)); right: auto; text-align: left; }
/* Bigger names still have to fit a narrow seat (see fitNames()). */
.name { max-width: calc(88 * var(--cqw, 1vw)); white-space: nowrap; overflow: hidden; }
.n3 .s3 .name { left: auto; right: calc(6 * var(--cqw, 1vw)); text-align: right; }
/* Narrow tiles: the name stays centered and clear of the menu button where the four tiles meet. */
.duel .name { margin-inline: auto; max-width: calc(76 * var(--cqw, 1vw)); }
.duel .name .why { font-size: calc(.6em * var(--wfit, 1)); letter-spacing: .06em; }
.life {
  position: relative;
  font-family: var(--f-num); font-weight: 800;
  font-size: min(calc(56 * var(--cqh, 1vh)), calc(44 * var(--cqw, 1vw))); line-height: .82;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  /* A black outline, drawn behind the fill, keeps the digits readable on any pattern. */
  -webkit-text-stroke: .06em #000; paint-order: stroke fill;
  text-shadow: 0 2px 18px rgba(0, 0, 0, .4);
}
/* Table seats lift the total a little so it clears the turn button below it. */
.table .readout { padding-bottom: calc(18 * var(--cqh, 1vh)); }
.table .life { font-size: min(calc(44 * var(--cqh, 1vh)), calc(44 * var(--cqw, 1vw))); }
.duel .life { font-size: min(calc(36 * var(--cqh, 1vh)), calc(50 * var(--cqw, 1vw))); }
/* Four players: the totals as big as each seat allows, scaled down for three digits (--ls). */
.n4 .readout { padding-bottom: calc(32 * var(--cqh, 1vh)); }
.n4 .life { font-size: calc(min(calc(var(--lh, 52) * var(--cqh, 1vh)), calc(var(--lw, 56) * var(--cqw, 1vw))) * var(--ls, 1)); }
.life[data-len="3"] { --ls: .75; }
.life[data-len="4"] { --ls: .58; }
.delta {
  -webkit-text-stroke-width: .08em;
  position: absolute; left: 100%; top: .06em; margin-left: .1em;
  font-size: .3em; font-weight: 700; letter-spacing: 0;
  opacity: 0; transition: opacity .25s;
}
.delta.show { opacity: .9; transition: none; }
.badge {
  position: absolute; top: calc(18 * var(--cqh, 1vh)); left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--table);
  font-size: clamp(12px, calc(8 * var(--cqh, 1vh)), 18px); font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  padding: .2em .8em; border-radius: 999px; pointer-events: none;
}

.tray {
  /* Commander damage sits in the seat's bottom-right corner, as its player sees it. */
  position: absolute; bottom: calc(6 * var(--cqh, 1vh)); right: calc(5 * var(--cqw, 1vw)); z-index: 2;
  display: flex; align-items: center; gap: .35em; white-space: nowrap;
  font-size: clamp(12px, min(calc(8.5 * var(--cqh, 1vh)), calc(4.3 * var(--cqw, 1vw))), 19px);
}
.chip {
  display: flex; align-items: center; gap: .35em;
  background: rgba(0, 0, 0, .28); border: 1px solid var(--line); border-radius: 999px;
  padding: .3em .7em; font-size: 1em; font-weight: 600; letter-spacing: .04em;
  touch-action: manipulation;
}
.chip .ct { max-width: 5.5em; overflow: hidden; text-overflow: ellipsis; }
.chip b { font-family: var(--f-num); font-weight: 800; font-variant-numeric: tabular-nums; }
.chip.hot { border-color: var(--hot); color: var(--hot); }
.chip.on { background: var(--seat-hi); border-color: var(--ink); color: var(--ink); }
.sw { width: .7em; height: .7em; border-radius: 50%; background: linear-gradient(135deg, var(--seat-hi) 50%, var(--accent) 50%); flex: none; }
/* Decks: each Starter Commander deck is one color pair, so picking a deck picks the seat's colors.
   The commander's art comes from Scryfall; until it loads (or if it can't) the colors show instead. */
.decks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.deck {
  display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; text-align: left;
  border-radius: 12px; border: 2px solid transparent; background: rgba(255, 255, 255, .06);
}
.deck .art {
  flex: none; width: 64px; height: 46px; border-radius: 9px; overflow: hidden;
  background: linear-gradient(135deg, var(--seat-hi) 50%, var(--accent) 50%);
}
.deck .art img, .decklist img { display: block; width: 100%; height: 100%; object-fit: cover; }
.deck span { display: flex; flex-direction: column; min-width: 0; }
.deck b { font-size: 17px; font-weight: 600; }
.deck small { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.decklist .card { width: min(100%, 230px); aspect-ratio: 488 / 680; margin: 0 auto 10px; border-radius: 11px; overflow: hidden; background: rgba(255, 255, 255, .06); }
.decklist ul { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 12px; font-size: 14px; line-height: 1.35; color: var(--ink-2); }
.decklist li { break-inside: avoid; padding-left: .8em; text-indent: -.8em; margin-bottom: .15em; }
.decklist .cmdr { margin: 0 0 8px; font-size: 15px; text-align: center; }
/* Any card in the list can be tapped to become the seat's wallpaper. */
.decklist [data-card] { border: 0; padding: 0; background: none; color: inherit; font: inherit; text-align: inherit; text-indent: inherit; touch-action: manipulation; }
.decklist [data-card].on { color: var(--hot); }
.decklist .hint { margin: 0 0 8px; font-size: 14px; color: var(--ink-2); text-align: center; }
.decklist .action.mini { display: block; margin: 0 auto 10px; }
.decklist .src { margin: 8px 0 0; font-size: 12px; color: var(--ink-2); opacity: .7; }
.deck.on, .patterns button.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--table) inset; }
.patterns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.patterns button {
  position: relative; overflow: hidden; height: 40px; border-radius: 10px; border: 2px solid transparent; padding: 0;
  background: var(--seat-hi);
}
.patterns button::before {
  content: ""; position: absolute; inset: 0; background: var(--accent);
  -webkit-mask: var(--pattern) 0 0 / 100% 100% no-repeat; mask: var(--pattern) 0 0 / 100% 100% no-repeat;
}
details.field > summary {
  display: flex; justify-content: space-between; align-items: center; cursor: pointer; list-style: none;
  font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
}
details.field > summary::-webkit-details-marker { display: none; }
details.field > summary::after { content: "+"; font-size: 20px; letter-spacing: 0; }
details.field[open] > summary::after { content: "\2212"; }
/* Spaced by margins: Safari lays out <details> as a block whatever its display says. */
details.field[open] > summary { margin-bottom: 10px; }
details.field .patterns { margin-top: 6px; }
/* Commander damage: the shield opens the attackers above it; while one is marked, only their chip shows. */
.cmd-btn {
  position: relative; display: grid; place-items: center;
  width: 2.4em; height: 2.4em; padding: 0; border-radius: 50%;
  background: transparent; border: 0;
  touch-action: manipulation;
}
/* The mask cuts the dagger out of its ::before; the shadows on the wrapper trace it in black. */
.cmd-btn .blade {
  width: 2em; height: 2em;
  filter: drop-shadow(1.5px 0 0 #000) drop-shadow(-1.5px 0 0 #000) drop-shadow(0 1.5px 0 #000) drop-shadow(0 -1.5px 0 #000);
}
.cmd-btn .blade::before {
  content: ""; display: block; width: 100%; height: 100%; background: currentColor;
  -webkit-mask: var(--blade) center / contain no-repeat; mask: var(--blade) center / contain no-repeat;
}
.cmd-btn b {
  position: absolute; top: -.3em; right: -.6em; min-width: 1.6em; padding: .05em .3em;
  border-radius: 999px; background: var(--ink); color: var(--table);
  font-family: var(--f-num); font-size: .8em; font-weight: 800; font-variant-numeric: tabular-nums;
}
.cmd-btn.hot { color: var(--hot); }
.cmd-btn.hot b { background: var(--hot); }
.pop {
  position: absolute; bottom: calc(100% + .5em); right: 0;
  display: none; gap: .35em; width: max-content; padding: .35em;
  border-radius: 999px; background: var(--table); box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
}
.seat.open .pop { display: flex; }
/* Upright side seats are too narrow for a row of attackers, so they stack. */
.upright .s1 .pop, .upright .s3 .pop { flex-direction: column; border-radius: 18px; }
.seat.marking .cmd-btn, .seat.marking .pop .chip:not(.on) { display: none; }
/* Side by side, each player concedes from the bottom-left corner of their own half. */
.flag {
  position: absolute; bottom: calc(6 * var(--cqh, 1vh)); left: calc(5 * var(--cqw, 1vw)); z-index: 2;
  display: flex; align-items: center; gap: .3em; height: 2.4em; padding: 0 .4em 0 .2em;
  font-size: clamp(12px, min(calc(8.5 * var(--cqh, 1vh)), calc(4.3 * var(--cqw, 1vw))), 19px);
  font-weight: 600; letter-spacing: .04em; white-space: nowrap;
  border: 0; border-radius: 999px; background: transparent; color: var(--ink);
  touch-action: manipulation;
}
.flag svg { width: 2em; height: 2em; flex: none; }
.flag span { -webkit-text-stroke: .14em #000; paint-order: stroke fill; }
.flag span:empty { display: none; }
.flag.armed { background: var(--hot); color: var(--table); }
.flag.armed span { -webkit-text-stroke: 0; }
/* Turn tracker: a pink button at the bottom center of every seat. Once someone has the turn, everyone
   else's button goes dark. */
.turn-btn {
  position: absolute; bottom: calc(6 * var(--cqh, 1vh)); left: 50%; transform: translateX(-50%); z-index: 2;
  width: 3.2em; height: 3.2em; padding: 0; border-radius: 50%;
  font-size: clamp(16px, min(calc(8.5 * var(--cqh, 1vh)), calc(6 * var(--cqw, 1vw))), 20px);
  background: var(--turn); border: 2px solid #000;
  touch-action: manipulation;
}
.seat.turn .turn-btn { box-shadow: 0 0 0 3px var(--ink), 0 0 18px 4px var(--turn); }
.seat.wait .turn-btn { background: var(--turn-dim); }
/* Side by side, a pink bar marks the turn along the player's two tiles where they meet the middle. */
.turn-bar {
  position: absolute; left: 0; right: 0; height: 7px; z-index: 3; pointer-events: none; display: none;
  background: var(--turn); box-shadow: 0 0 14px 2px rgba(255, 79, 163, .6);
}
.d-bl .turn-bar, .d-br .turn-bar { top: 0; }
.d-tl .turn-bar, .d-tr .turn-bar { bottom: 0; }
.duel .seat.turn .turn-bar { display: block; }
/* The tiles are narrow, so their dagger and flag are sized by width to stay tappable. */
.duel .tray, .duel .flag { font-size: clamp(14px, calc(8 * var(--cqw, 1vw)), 19px); }
.seat.marking .pop { display: flex; position: static; padding: 0; background: none; }

.menu-btn {
  position: absolute; z-index: 10; width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center; padding: 0;
  background: var(--table); border: 2px solid var(--line);
}
/* The Planeswalker flame, a PNG with its white background taken out. */
.menu-btn img { width: auto; height: 32px; display: block; pointer-events: none; }
.table + .menu-btn, .duel + .menu-btn { top: 50%; left: 50%; transform: translate(-50%, -50%); }
.n1 + .menu-btn { top: 16px; right: max(16px, calc(env(safe-area-inset-right, 0px) + 10px)); width: 46px; height: 46px; background: rgba(0, 0, 0, .3); }

/* Menu */
.menu {
  position: fixed; inset: 0; z-index: 20;
  display: grid; place-items: center; padding: 20px;
  background: rgba(0, 0, 0, .65); touch-action: manipulation;
}
.panel {
  width: min(100%, 360px); max-height: 100%; overflow-y: auto; touch-action: pan-y;
  display: flex; flex-direction: column; gap: 18px;
  padding: 22px 20px; border-radius: 20px;
  background: var(--panel); border: 1px solid var(--line);
}
.panel h2 {
  margin: 0; font-family: var(--f-name); font-weight: 800; font-size: 30px;
  letter-spacing: .04em; text-transform: uppercase; text-wrap: balance;
}
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255, 255, 255, .06); }
.seg button {
  border: 0; border-radius: 9px; background: transparent; padding: 10px 6px;
  font-size: 18px; font-weight: 600;
}
.seg button.on { background: var(--ink); color: var(--table); }
/* Five table sizes: each button takes the width its label needs, so "Just me" isn't cut off. */
#segMode { grid-auto-columns: auto; }
#segMode button { padding-inline: 4px; }
.action {
  border: 0; border-radius: 12px; padding: 14px; font-size: 19px; font-weight: 600;
  background: rgba(255, 255, 255, .1);
}
.action.primary { background: var(--ink); color: var(--table); }
.action.armed, .seg button.armed { background: var(--hot); color: var(--table); }
.action.mini { align-self: center; padding: 6px 18px; border-radius: 999px; font-size: 15px; }
.ghost { border: 1px solid var(--line); border-radius: 12px; background: transparent; padding: 12px; font-size: 17px; color: var(--ink); }
/* Back to game is as white as New game, so the way out is easy to find. */
#closeMenu { background: var(--ink); border-color: var(--ink); color: var(--table); }
/* Players: the ring picks whose phone this is, the field renames them. */
.who { display: grid; gap: 8px; }
.who-row { display: flex; align-items: center; gap: 10px; }
.who-row > span { font-size: 17px; font-weight: 600; }
.pick {
  flex: none; width: 40px; height: 40px; padding: 0; border-radius: 50%;
  border: 2px solid var(--line); background: transparent;
}
.pick.on { border-color: var(--ink); background: radial-gradient(circle, var(--ink) 0 34%, transparent 37%); }
.seg button { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who input {
  width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ink);
  font: 600 17px var(--f-ui); -webkit-user-select: text; user-select: text;
}
.who input:focus-visible { outline: 3px solid var(--hot); outline-offset: 0; }
.results { display: flex; flex-direction: column; gap: 8px; }
.res-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .06); }
.res-head { display: flex; align-items: baseline; gap: 8px; font-size: 16px; }
.res-head b { font-weight: 600; }
.res-head span { flex: 1; min-width: 0; color: var(--ink-2); font-size: 14px; }
.res-players { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--ink-2); }
.res-players span { display: flex; align-items: center; gap: .35em; }
.res-players .won { color: var(--ink); font-weight: 600; }
.res-del { flex: none; border: 1px solid var(--line); border-radius: 999px; background: transparent; padding: 3px 12px; font-size: 14px; color: var(--ink-2); }
.res-del.armed { background: var(--hot); border-color: var(--hot); color: var(--table); }
.res-note { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.35; }
.ver { margin: -12px 0 0; text-align: center; font-size: 12px; letter-spacing: .14em; color: var(--ink-2); opacity: .7; }

@media (prefers-reduced-motion: reduce) {
  .seat, .zone, .delta { transition: none; }
}
</style>
</head>
<body>
<div id="app"></div>

<div class="menu" id="menu" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <h2 id="menuTitle">Commander</h2>
    <div class="field">
      <span>Players</span>
      <div class="seg" id="segMode">
        <button type="button" id="mode1" data-v="1">Just me</button>
        <button type="button" id="mode2" data-v="2">2</button>
        <button type="button" id="mode3" data-v="3">3</button>
        <button type="button" id="mode4" data-v="4">4</button>
        <button type="button" id="mode5" data-v="5">1v1 ×2</button>
      </div>
    </div>
    <div class="field" id="pairsField">
      <span id="pairsLabel">Rand plays</span>
      <div class="seg" id="segPairs">
        <button type="button" data-v="1"></button>
        <button type="button" data-v="2"></button>
        <button type="button" data-v="3"></button>
      </div>
    </div>
    <div class="field" id="layoutField">
      <span>1v1 layout</span>
      <div class="seg" id="segLayout">
        <button type="button" data-v="split">Side by side</button>
        <button type="button" data-v="classic">Classic</button>
      </div>
    </div>
    <details class="field" id="meField" open>
      <summary id="meLabel">This phone is</summary>
      <div class="who" id="who">
        <div class="who-row" id="edge0"><button type="button" class="pick" data-v="0"></button><input id="name0" maxlength="12" autocomplete="off" aria-label="Player name" placeholder="Rand"></div>
        <div class="who-row" id="edge1"><button type="button" class="pick" data-v="1"></button><input id="name1" maxlength="12" autocomplete="off" aria-label="Player name" placeholder="Andrew"></div>
        <div class="who-row" id="edge2"><button type="button" class="pick" data-v="2"></button><input id="name2" maxlength="12" autocomplete="off" aria-label="Player name" placeholder="Trent"></div>
        <div class="who-row" id="edge3"><button type="button" class="pick" data-v="3"></button><input id="name3" maxlength="12" autocomplete="off" aria-label="Player name" placeholder="Lenn"></div>
        <div class="who-row"><button type="button" class="pick" data-v="4" aria-label="This phone is in the center of the table"></button><span>Center</span></div>
      </div>
    </details>
    <details class="field" id="colorField">
      <summary id="colorLabel">Your deck</summary>
      <div class="decks" id="colors"></div>
      <details class="field" id="listField">
        <summary id="listLabel">Decklist</summary>
        <div class="decklist" id="decklist"></div>
      </details>
      <div class="patterns" id="patterns"></div>
    </details>
    <div class="field">
      <span>Starting life</span>
      <div class="seg" id="segStart">
        <button type="button" id="start20" data-v="20">20</button>
        <button type="button" id="start30" data-v="30">30</button>
        <button type="button" id="start40" data-v="40">40</button>
      </div>
    </div>
    <button type="button" class="action primary" id="newGame">New game</button>
    <button type="button" class="action" id="pickFirst">Pick who goes first</button>
    <button type="button" class="action mini" id="concede">Concede</button>
    <details class="field" id="resultsField" hidden>
      <summary>Results</summary>
      <div class="results" id="results"></div>
    </details>
    <button type="button" class="ghost" id="closeMenu">Back to game</button>
    <p class="ver" id="ver"></p>
  </div>
</div>

  if (!state.meta || typeof state.meta !== 'object') state.meta = {};

  // In the two 1v1s, the edge Rand (edge 0) plays; the other two play each other.
  // v3.20 made Rand v Lenn the default; phones that saved v3.16's default (Trent) move over once.
  if (![1, 2, 3].includes(state.pairs) || !state.pairs320) { state.pairs = 3; state.pairs320 = true; }
  delete state.clock; // left over from v1.2's sync
  // Whose phone this is (by their default edge); their seat sits at its bottom and every seat faces
  // them. CENTER is a phone lying in the middle of the table, each seat facing its own edge.
  // Kept on this phone only.
  if (![0, 1, 2, 3, CENTER].includes(state.me)) state.me = 0;
  delete state.flip; // left over from v1.9
  // How a two-player table is laid out on this phone: 'split' (side by side) or 'classic'. Kept on this phone only.
  if (!['split', 'classic'].includes(state.layout2)) state.layout2 = 'split';
  // Per table size, the player whose turn it is (null before anyone's started).
  if (!state.turns || typeof state.turns !== 'object') state.turns = {};
  TURN_KEYS.forEach(k => { if (!Number.isInteger(state.turns[k])) state.turns[k] = null; });
  // Per table size, the invisible turn timer: when the current turn began, how many turns have been
  // taken, and per player their turns (c) and total turn time in ms (t). Null counts as 0.
  if (!state.clock || typeof state.clock !== 'object') state.clock = {};
  TURN_KEYS.forEach(k => {
    const c = state.clock[k];
    if (!c || typeof c !== 'object' || !c.t || !c.c) state.clock[k] = blankClock(SIZE[k]);
  });

  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const nameOf = e => esc(state.names[e].trim() || DEFAULT_NAMES[e]);
  // The edges playing game k, in seat order.
  const edgesOf = k => k === 'a' ? [0, state.pairs] : k === 'b' ? [1, 2, 3].filter(e => e !== state.pairs) : PEOPLE[k];
  const duelOf = e => e === 0 || e === state.pairs ? 'a' : 'b';
  // The players this phone shows, as { k: their game, j: their seat in it, e: their edge }. In the
  // two 1v1s a player's phone shows just their own 1v1; a Center phone shows all four.
  let players = [];
  function viewPlayers() {
    if (state.mode !== SPLIT) return PEOPLE[state.mode].map((e, j) => ({ k: state.mode, j, e }));
    const all = [0, 1, 2, 3].map(e => ({ k: duelOf(e), j: edgesOf(duelOf(e)).indexOf(e), e }));
    return state.me === CENTER ? all : all.filter(p => p.k === duelOf(state.me));
  }
  const viewKeys = () => [...new Set(players.map(p => p.k))];
  const playerOf = i => state.games[players[i].k][players[i].j];
  const edgeOf = i => players[i].e;
  const colorOf = e => 'k-' + (SCHEMES[state.colors[e]] ? state.colors[e] : DEFAULT_COLORS[e]);
  const patternOf = e => PATTERNS[state.patterns[e]] ? state.patterns[e] : 'marble';
  // The player's picked card if it's in the deck they're playing now, else their commander.
  const cardOf = e => { const k = colorOf(e).slice(2); return deckCards(k).includes(state.cards[e]) ? state.cards[e] : DECKS[k].commander; };
  // Where player i sits on this phone: the table turns so this phone's player is at the bottom.
  // Rand's layout is the reference; on everyone else's phone the left and right seats swap, which
  // matches how the group actually sits.
  function posOf(i) {
    // A player's own 1v1 sits like a two-player table: them at the bottom, their opponent across.
    if (state.mode === SPLIT) return state.me === CENTER ? edgeOf(i) : edgeOf(i) === state.me ? 0 : 2;
    const edges = EDGES[state.mode], n = edges.length;
    const k = Math.max(0, PEOPLE[state.mode].indexOf(state.me));
    const pos = edges[(i - k + n) % n];
    return k && pos % 2 ? 4 - pos : pos;
  }

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const untouched = g => g.every(p => p.life === state.start && p.cmd.every(c => c === 0) && !p.conceded);

  const app = document.getElementById('app');
  // Per player, their seat elements: one, or two in the side-by-side layout (one in each half).
  let seats = [];
  const deltas = [];
  // Per seat, the opponent slot whose commander damage is being marked (null when off).
  let marking = [];

  // ---- wake lock & haptics ----
  let lock = null;
  async function wake() {
    if (lock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
    catch (e) {}
  }
  document.addEventListener('visibilitychange', wake);
  // ---- hold the board still when the device rotates ----
  // window.orientation is what iOS reports; positive means the device turned counterclockwise.
  const angle = () => typeof window.orientation === 'number' ? window.orientation
    : (screen.orientation && screen.orientation.angle) || 0;
  const baseAngle = angle();
  function pin() {
    const turn = ((angle() - baseAngle) % 360 + 360) % 360;
    app.classList.toggle('pinned', turn !== 0);
    if (!turn) return;
    const sideways = turn % 180 !== 0;
    app.style.setProperty('--spin', -turn + 'deg');
    app.style.setProperty('--pin-w', (sideways ? innerHeight : innerWidth) + 'px');
    app.style.setProperty('--pin-h', (sideways ? innerWidth : innerHeight) + 'px');
  }
  // iOS can report the new size a beat after the rotation event, so check again shortly after.
  const repin = () => { pin(); setTimeout(pin, 300); };
  addEventListener('resize', repin);
  addEventListener('orientationchange', repin);
  pin();
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

  // ---- rendering ----
  function oppsOf(i) {
    if (state.mode === 1) return [0, 1, 2].map(k => ({ label: 'Opp ' + (k + 1), color: k + 1 }));
    const { k, j } = players[i];
    return edgesOf(k).filter((e, s) => s !== j).map(e => ({ label: nameOf(e), color: e }));
  }

  // Side by side, this phone's player takes the left column and the opponent the right: in the top
  // half, turned to face the opponent, that puts the opponent on their own left too.
  const duelSpots = i => i === mySeat() ? ['d-bl', 'd-tl'] : ['d-tr', 'd-br'];

  function build() {
    players = viewPlayers();
    const n = players.length;
    const duel = n === 2 && state.layout2 === 'split';
    app.innerHTML = '';
    const board = document.createElement('div');
    board.className = duel ? 'board duel'
      : 'board n' + n + (n > 1 ? ' table' : '') + (n > 1 && state.me !== CENTER ? ' upright' : '');
    seats = [];
    for (let i = 0; i < n; i++) {
      // The first spot is the one in the player's own half; it carries their concede flag.
      seats[i] = (duel ? duelSpots(i) : ['s' + posOf(i)]).map((spot, k) => makeSeat(i, spot, duel && !k));
      seats[i].forEach(seat => board.appendChild(seat));
      deltas[i] = { sum: 0, t: null };
    }
    app.appendChild(board);
    const mb = document.createElement('button');
    mb.type = 'button';
    mb.className = 'menu-btn';
    mb.setAttribute('aria-label', 'Menu');
    mb.innerHTML = ICON_MENU;
    mb.addEventListener('click', openMenu);
    app.appendChild(mb);
    seats.forEach((_, i) => update(i));
    paintTurn();
    measure();
  }

  function makeSeat(i, spot, flag) {
    const seat = document.createElement('section');
    const e = edgeOf(i);
    seat.className = `seat ${spot} ${colorOf(e)}`;
    seat.style.setProperty('--pattern', patternUrl(patternOf(e)));
    seat.style.setProperty('--art', `url(${artUrl(colorOf(e).slice(2), 'art_crop')})`);
    if (patternOf(e) === CARD) seat.style.setProperty('--card', `url(${cardUrl(cardOf(e))})`);
    const opps = oppsOf(i);
    seat.innerHTML = `
      <div class="face${patternOf(e) === ART ? ' arty' : patternOf(e) === CARD ? ' carded' : ''}">
        <button type="button" class="zone minus" aria-label="${nameOf(e)} lose 1 life">&minus;</button>
        <button type="button" class="zone plus" aria-label="${nameOf(e)} gain 1 life">+</button>
        <div class="readout">
          <div class="name"></div>
          <div class="life"><span class="num"></span><span class="delta"></span></div>
        </div>
        <div class="badge" hidden>Goes first</div>
        <div class="tray">
          <div class="pop">
            ${opps.map((o, s) => `<button type="button" class="chip ${colorOf(o.color)}" data-slot="${s}" aria-label="Mark commander damage from ${o.label}"><i class="sw"></i><span class="ct">${o.label}</span><b>0</b></button>`).join('')}
          </div>
          <button type="button" class="cmd-btn" aria-label="Commander damage" aria-expanded="false">${ICON_CMD}<b hidden></b></button>
        </div>
        ${state.mode > 1 ? `<button type="button" class="turn-btn" aria-label="${nameOf(e)}'s turn"></button>` : ''}
        ${flag ? `<button type="button" class="flag" aria-label="Concede">${ICON_FLAG}<span></span></button>` : ''}
      </div>
      <i class="turn-bar" aria-hidden="true"></i>`;
    bindZone(seat.querySelector('.minus'), i, -1);
    bindZone(seat.querySelector('.plus'), i, 1);
    seat.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
      seat.classList.remove('open');
      toggleMarking(i, +c.dataset.slot);
    }));
    const cmdBtn = seat.querySelector('.cmd-btn');
    cmdBtn.addEventListener('click', () => {
      cmdBtn.setAttribute('aria-expanded', seat.classList.toggle('open'));
      buzz();
    });
    if (flag) bindFlag(seat.querySelector('.flag'), i);
    if (state.mode > 1) seat.querySelector('.turn-btn').addEventListener('click', () => tapTurn(i));
    return seat;
  }

  // Size each seat and its face from the actual layout (see .face in the styles).
  function measure() {
    seats.flat().forEach(seat => {
      seat.style.setProperty('--sw', seat.clientWidth / 100 + 'px');
      seat.style.setProperty('--sh', seat.clientHeight / 100 + 'px');
      const face = seat.querySelector('.face');
      face.style.setProperty('--cqw', face.offsetWidth / 100 + 'px');
      face.style.setProperty('--cqh', face.offsetHeight / 100 + 'px');
    });
    fitNames();
  }
  // Every name on the board is drawn at one size: the largest at which each name still fits its
  // seat, so the side seats' names match the top and bottom ones. An "out" line too wide for its
  // seat shrinks on its own (--wfit). Layout widths, so a turned seat measures the same as an
  // upright one.
  function fitNames() {
    // Only names already filled in: during build() the later seats have none yet.
    const names = Array.from(app.querySelectorAll('.name')).filter(el => el.querySelector('.nm'));
    if (!names.length) return;
    names.forEach(el => { el.style.setProperty('--fit', 1); el.style.setProperty('--wfit', 1); });
    const room = el => parseFloat(getComputedStyle(el).maxWidth);
    const sizes = names.map(el => {
      const base = parseFloat(getComputedStyle(el).fontSize);
      return { el, base, px: base * Math.min(1, room(el) / el.querySelector('.nm').offsetWidth * .98) };
    });
    const px = Math.min(...sizes.map(x => x.px));
    sizes.forEach(({ el, base }) => el.style.setProperty('--fit', (px / base).toFixed(3)));
    names.forEach(el => {
      const why = el.querySelector('.why .nm');
      if (why && why.offsetWidth > room(el)) el.style.setProperty('--wfit', (room(el) / why.offsetWidth * .98).toFixed(3));
    });
  }
  // The card fonts arrive after the first layout; names are fitted again in them.
  if (document.fonts) document.fonts.ready.then(fitNames);
  if ('ResizeObserver' in window) new ResizeObserver(measure).observe(app);
  else addEventListener('resize', () => setTimeout(measure, 50));

  function outReason(p) {
    if (p.conceded) return 'conceded';
    if (p.cmd.some(c => c >= CMD_LETHAL)) return CMD_LETHAL + ' commander';
    if (p.life <= 0) return 'no life';
    return '';
  }

  const slotsOf = seat => Array.from(seat.querySelectorAll('.chip'), c => +c.dataset.slot);

  function update(i) {
    if (!seats[i]) return;
    const p = playerOf(i);
    const why = outReason(p);
    const label = state.mode === 1 ? 'Life' : nameOf(edgeOf(i));
    let refit = false;
    seats[i].forEach(seat => {
      seat.querySelector('.num').textContent = p.life;
      seat.querySelector('.life').dataset.len = String(p.life).length;
      seat.classList.toggle('out', !!why);
      const name = seat.querySelector('.name');
      const html = `<span class="nm">${label}</span>` + (why ? `<span class="why"><span class="nm">out, ${why}</span></span>` : '');
      if (name.innerHTML !== html) { name.innerHTML = html; refit = true; }

      seat.classList.toggle('marking', marking[i] != null);
      seat.querySelectorAll('.chip').forEach(c => {
        const slot = +c.dataset.slot, v = p.cmd[slot], on = marking[i] === slot;
        c.querySelector('b').textContent = v;
        c.classList.toggle('on', on);
        c.classList.toggle('hot', !on && v >= CMD_LETHAL - 6);
        c.setAttribute('aria-pressed', on);
      });
      // The shield carries the most commander damage taken from any one attacker.
      const most = Math.max(0, ...slotsOf(seat).map(slot => p.cmd[slot]));
      const cmdBtn = seat.querySelector('.cmd-btn'), badge = cmdBtn.querySelector('b');
      badge.hidden = !most;
      badge.textContent = most;
      cmdBtn.classList.toggle('hot', most >= CMD_LETHAL - 6);
      cmdBtn.setAttribute('aria-expanded', seat.classList.contains('open'));
      const flag = seat.querySelector('.flag');
      if (flag && !flag.classList.contains('armed')) {
        flag.querySelector('span').textContent = p.conceded ? 'Rejoin' : '';
        flag.setAttribute('aria-label', p.conceded ? 'Rejoin' : 'Concede');
      }
    });
    if (refit) fitNames();
  }

  function showDelta(i, d) {
    const st = deltas[i], els = seats[i].map(s => s.querySelector('.delta'));
    st.sum += d;
    clearTimeout(st.t);
    els.forEach(el => {
      el.textContent = st.sum > 0 ? '+' + st.sum : st.sum < 0 ? '−' + -st.sum : '±0';
      el.classList.add('show');
    });
    st.t = setTimeout(() => { els.forEach(el => el.classList.remove('show')); st.sum = 0; }, 1600);
  }

  // ---- changes ----
  // While an attacker is toggled on, life lost is also tallied as their commander damage.
  // The game's invisible clock starts with its first change or its first turn, whichever comes
  // first, and stops the moment one player is left (see settle()). A logged result is timed by it.
  // Each game (k) has its own clock, so the two 1v1s start, end and are logged on their own.
  function touch(k) {
    if (!untouched(state.games[k]) || (state.turns[k] != null && state.meta[k].id)) return;
    const m = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), at: Date.now(), end: null };
    state.meta[k] = m;
    send({ [`meta/${k}/id`]: m.id, [`meta/${k}/at`]: m.at, [`meta/${k}/end`]: null });
  }
  const finished = k => SIZE[k] > 1 && state.games[k].filter(p => !outReason(p)).length === 1;
  // The game ends the moment one player is left, and the phone that made that change logs it right
  // then. A change that brings someone back (a mistap) takes the entry out again until the real finish.
  // The end time is shared, so a later New game on any phone logs the same time.
  function settle(k, was) {
    const m = state.meta[k], now = finished(k);
    if (was === now || !m.id) return;
    m.end = now ? Date.now() : null;
    send({ [`meta/${k}/end`]: m.end });
    save();
    if (now) record(k); else unlog(m.id);
  }
  function changeLife(i, d) {
    const { k, j } = players[i];
    touch(k);
    const was = finished(k);
    const p = playerOf(i), slot = marking[i];
    const at = `games/${k}/${j}/`, bump = { [at + 'life']: inc(d) };
    p.life += d;
    if (slot != null) {
      const was = p.cmd[slot];
      p.cmd[slot] = Math.max(0, was - d);
      bump[at + 'cmd/' + slot] = inc(p.cmd[slot] - was);
    }
    send(bump);
    showDelta(i, d); update(i); save(); buzz();
    settle(k, was);
  }
  // ---- turns ----
  // Tapping the button of the player whose turn it is passes it on, clockwise (the order of the
  // edges, starting at the bottom), past anyone who is out. Tapping anyone else's makes it theirs,
  // which starts the tracker or corrects it.
  function tapTurn(i) {
    const { k, j } = players[i], n = SIZE[k], g = state.games[k];
    let next = j;
    if (state.turns[k] === j) {
      for (let s = 1; s < n; s++) if (!outReason(g[(j + s) % n])) { next = (j + s) % n; break; }
    }
    setTurn(k, next);
    buzz();
  }
  // Each new turn is counted, and the time since the last one began goes to whoever had it.
  // Increments, so two phones passing turns at once both count.
  function setTurn(k, j) {
    touch(k);
    const c = state.clock[k], prev = state.turns[k], now = Date.now();
    const patch = { ['turns/' + k]: j, [`clock/${k}/at`]: now };
    if (prev != null && prev < SIZE[k] && c.at) {
      const d = Math.max(0, now - c.at);
      c.t[prev] = (c.t[prev] || 0) + d;
      patch[`clock/${k}/t/${prev}`] = inc(d);
    }
    c.c[j] = (c.c[j] || 0) + 1;
    c.count = (c.count || 0) + 1;
    c.at = now;
    patch[`clock/${k}/c/${j}`] = inc(1);
    patch[`clock/${k}/count`] = inc(1);
    state.turns[k] = j;
    send(patch); save(); paintTurn();
  }
  // A seat waits (its button goes dark) while someone else in its own game has the turn.
  function paintTurn() {
    seats.forEach((list, i) => {
      const { k, j } = players[i], t = state.turns[k], on = t === j;
      const wait = !on && Number.isInteger(t) && t < SIZE[k];
      list.forEach(s => {
        s.classList.toggle('turn', on);
        s.classList.toggle('wait', wait);
        const b = s.querySelector('.turn-btn');
        if (b) b.setAttribute('aria-pressed', on);
      });
    });
  }

  function toggleConcede(i) {
    const { k, j } = players[i];
    touch(k);
    const was = finished(k), p = playerOf(i);
    p.conceded = !p.conceded;
    send({ [`games/${k}/${j}/conceded`]: p.conceded });
    marking[i] = null;
    update(i); save(); buzz();
    settle(k, was);
  }
  // Side by side, both players share this phone, so each concedes (or rejoins) from their own half.
  // Like the menu's Concede, it takes a second tap within 3 seconds.
  function bindFlag(flag, i) {
    let t = null;
    flag.addEventListener('click', () => {
      clearTimeout(t);
      if (flag.classList.contains('armed')) {
        flag.classList.remove('armed');
        toggleConcede(i);
        return;
      }
      flag.classList.add('armed');
      flag.querySelector('span').textContent = playerOf(i).conceded ? 'Rejoin?' : 'Concede?';
      buzz();
      t = setTimeout(() => { flag.classList.remove('armed'); update(i); }, 3000);
    });
  }
  function toggleMarking(i, slot) {
    marking[i] = marking[i] === slot ? null : slot;
    update(i); buzz(); wake();
  }

  // Tap = ±1, hold = ±10 then repeats.
  function bindZone(btn, i, sign) {
    let timer = null, rep = null, long = false, active = false;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      active = true; long = false;
      btn.classList.add('press');
      wake();
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      timer = setTimeout(() => {
        long = true; changeLife(i, 10 * sign);
        rep = setInterval(() => changeLife(i, 10 * sign), 550);
      }, 450);
    });
    const end = apply => {
      if (!active) return;
      active = false;
      clearTimeout(timer); clearInterval(rep);
      btn.classList.remove('press');
      if (apply && !long) changeLife(i, sign);
    };
    btn.addEventListener('pointerup', () => end(true));
    btn.addEventListener('pointercancel', () => end(false));
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('click', e => { if (e.detail === 0) changeLife(i, sign); }); // keyboard
  }

  // ---- menu ----
  const menu = document.getElementById('menu');
  const newGameBtn = document.getElementById('newGame');
  const concedeBtn = document.getElementById('concede');
  let armTimer = null;

  function syncMenu() {
    document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', +b.dataset.v === state.mode));
    document.querySelectorAll('#segStart button').forEach(b => b.classList.toggle('on', +b.dataset.v === state.start));
    document.querySelectorAll('#segLayout button').forEach(b => b.classList.toggle('on', b.dataset.v === state.layout2));
    const center = state.mode !== 1 && state.me === CENTER;
    document.getElementById('layoutField').hidden = !(state.mode === 2 || (state.mode === SPLIT && !center));
    document.getElementById('pickFirst').hidden = state.mode === 1;
    // Who plays whom in the two 1v1s: Rand's pick sets both pairs.
    document.getElementById('pairsField').hidden = state.mode !== SPLIT;
    document.getElementById('pairsLabel').textContent = (state.names[0].trim() || DEFAULT_NAMES[0]) + ' plays';
    // A phone in the center has no seat of its own to concede or color.
    document.getElementById('concede').hidden = state.mode === 1 || center;
    document.getElementById('colorField').hidden = center;
    document.getElementById('meField').hidden = state.mode === 1;
    const edges = PEOPLE[state.mode];
    const me = center ? CENTER : edges.includes(state.me) ? state.me : 0;
    document.getElementById('meLabel').textContent = center ? 'This phone is in the center' : 'This phone is ' + (state.names[me].trim() || DEFAULT_NAMES[me]);
    [0, 1, 2, 3].forEach(e => {
      const row = document.getElementById('edge' + e);
      row.hidden = !edges.includes(e);
      row.querySelector('.pick').setAttribute('aria-label', 'This phone is ' + (state.names[e].trim() || DEFAULT_NAMES[e]));
    });
    document.querySelectorAll('#who .pick').forEach(pick => {
      pick.classList.toggle('on', +pick.dataset.v === me);
      pick.setAttribute('aria-pressed', +pick.dataset.v === me);
    });
    // This phone's player picks their colors and pattern (in "Just me", the one seat's).
    const mine = state.mode === 1 ? 0 : edges.includes(state.me) ? state.me : 0;
    document.getElementById('colorLabel').textContent = state.mode === 1 ? 'Deck' : (state.names[mine].trim() || DEFAULT_NAMES[mine]) + "'s deck";
    document.getElementById('colors').innerHTML = Object.keys(DECKS).map(k => {
      const d = DECKS[k];
      return `<button type="button" class="deck k-${k}${colorOf(mine) === 'k-' + k ? ' on' : ''}" data-v="${k}" data-e="${mine}" aria-label="${d.name}, ${d.commander}, ${d.colors}">
        <i class="art"><img src="${artUrl(k, 'art_crop')}" alt="" loading="lazy" onerror="this.remove()"></i>
        <span><b>${d.name}</b><small>${esc(d.commander)}</small></span></button>`;
    }).join('');
    const deck = DECKS[colorOf(mine).slice(2)];
    const on = c => patternOf(mine) === CARD && cardOf(mine) === c ? ' class="on"' : '';
    document.getElementById('listLabel').textContent = deck.name + ' decklist';
    document.getElementById('decklist').innerHTML = `
      <div class="card"><img src="${patternOf(mine) === CARD ? cardUrl(cardOf(mine)) : artUrl(colorOf(mine).slice(2), 'normal')}" alt="${esc(patternOf(mine) === CARD ? cardOf(mine) : deck.commander)}" loading="lazy" onerror="this.remove()"></div>
      <p class="hint">Tap a card to make its top half your wallpaper.</p>
      <button type="button" class="action mini" data-random="${mine}">Random card</button>
      <p class="cmdr">Commander: <button type="button" data-card="${esc(deck.commander)}" data-e="${mine}"${on(deck.commander)}><b>${esc(deck.commander)}</b></button></p>
      <ul>${deck.cards.split('|').map(c => `<li><button type="button" data-card="${esc(c.replace(/^\d+ /, ''))}" data-e="${mine}"${on(c.replace(/^\d+ /, ''))}>${esc(c)}</button></li>`).join('')}</ul>
      <p class="src">100 cards. Card images from Scryfall.</p>`;
    document.getElementById('patterns').innerHTML =
      `<button type="button" class="arty${patternOf(mine) === ART ? ' on' : ''}" style="--art: url(${artUrl(colorOf(mine).slice(2), 'art_crop')})" data-v="${ART}" data-e="${mine}" aria-label="Commander art" title="Commander art"></button>` +
      `<button type="button" class="carded${patternOf(mine) === CARD ? ' on' : ''}" style="--card: url(${cardUrl(cardOf(mine))})" data-v="${CARD}" data-e="${mine}" aria-label="Deck card: ${esc(cardOf(mine))}" title="Deck card: ${esc(cardOf(mine))}"></button>` +
      PATTERN_LIST.map(([k, name, n]) =>
      `<button type="button" class="${colorOf(mine)}${patternOf(mine) === k ? ' on' : ''}" style="--pattern: ${patternUrl(k)}" data-v="${k}" data-e="${mine}" data-n="${n}" aria-label="${name}" title="${n}. ${name}"></button>`).join('');
    state.names.forEach((n, i) => {
      const input = document.getElementById('name' + i);
      if (input !== document.activeElement) input.value = n;
    });
    disarm();
  }
  document.getElementById('who').addEventListener('click', e => {
    const b = e.target.closest('.pick');
    if (!b) return;
    state.me = +b.dataset.v; marking = []; save(); build(); syncMenu();
  });
  // New pairs start both 1v1s over, so once either has begun it takes a second tap.
  document.getElementById('segPairs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || +b.dataset.v === state.pairs) return;
    if (!DUELS.every(k => untouched(state.games[k])) && !b.classList.contains('armed')) {
      disarm();
      b.classList.add('armed');
      b.textContent = 'Tap again';
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    // Logged under the old pairs, then started over under the new ones.
    const patch = Object.assign({}, ...DUELS.map(resetGame));
    state.pairs = patch.pairs = +b.dataset.v;
    marking = []; send(patch); save(); build(); syncMenu();
  });

  document.getElementById('colors').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    state.colors[+b.dataset.e] = b.dataset.v;
    send({ ['colors/' + b.dataset.e]: b.dataset.v });
    save(); build(); syncMenu();
  });
  document.getElementById('patterns').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    state.patterns[+b.dataset.e] = b.dataset.v;
    send({ ['patterns/' + b.dataset.e]: b.dataset.v });
    save(); build(); syncMenu();
  });
  // Picking a card (or a random one) from the decklist makes it the wallpaper.
  function useCard(e, name) {
    state.cards[e] = name; state.patterns[e] = CARD;
    send({ ['cards/' + e]: name, ['patterns/' + e]: CARD });
    save(); build(); syncMenu(); buzz();
  }
  document.getElementById('decklist').addEventListener('click', e => {
    const b = e.target.closest('[data-card], [data-random]');
    if (!b) return;
    if (b.dataset.random != null) useCard(+b.dataset.random, randomCard(colorOf(+b.dataset.random).slice(2)));
    else useCard(+b.dataset.e, b.dataset.card);
  });

  function paintPairs() {
    const name = e => state.names[e].trim() || DEFAULT_NAMES[e];
    document.querySelectorAll('#segPairs button').forEach(b => {
      const e = +b.dataset.v;
      b.classList.toggle('on', e === state.pairs);
      b.classList.remove('armed');
      b.textContent = name(e);
      b.setAttribute('aria-label', `${name(0)} plays ${name(e)}, ${[1, 2, 3].filter(x => x !== e).map(name).join(' plays ')}`);
    });
  }
  function disarm() {
    clearTimeout(armTimer);
    paintPairs();
    newGameBtn.classList.remove('armed');
    newGameBtn.textContent = 'New game at ' + state.start;
    concedeBtn.classList.remove('armed');
    concedeBtn.textContent = playerOf(mySeat()).conceded ? 'Rejoin' : 'Concede';
  }
  function openMenu() { syncMenu(); menu.hidden = false; }
  function closeMenu() { menu.hidden = true; document.getElementById('resultsField').hidden = true; disarm(); }

  menu.addEventListener('click', e => { if (e.target === menu) closeMenu(); });
  document.getElementById('closeMenu').addEventListener('click', closeMenu);
  // Games nobody has touched yet pick up a new starting life right away. Returns the patch to send.
  function setStart(v) {
    const fresh = KEYS.filter(k => untouched(state.games[k]));
    state.start = v;
    fresh.forEach(k => { state.games[k] = blankGame(SIZE[k], state.start); });
    const reset = { start: state.start };
    fresh.forEach(k => { reset['games/' + k] = state.games[k]; });
    return reset;
  }
  document.querySelectorAll('#segMode button').forEach(b => b.addEventListener('click', () => {
    state.mode = +b.dataset.v; marking = [];
    const patch = Object.assign(DEFAULT_START[state.mode] ? setStart(DEFAULT_START[state.mode]) : {}, { mode: state.mode });
    send(patch); save(); build(); syncMenu();
  }));
  document.querySelectorAll('#segStart button').forEach(b => b.addEventListener('click', () => {
    send(setStart(+b.dataset.v));
    save(); build(); syncMenu();
  }));
  document.querySelectorAll('#segLayout button').forEach(b => b.addEventListener('click', () => {
    state.layout2 = b.dataset.v; save(); build(); syncMenu();
  }));
  // Logs game k if it finished, starts it over, and returns the patch to send.
  function resetGame(k) {
    record(k);
    state.games[k] = blankGame(SIZE[k], state.start);
    if (SIZE[k] > 1) { state.turns[k] = null; state.clock[k] = blankClock(SIZE[k]); }
    return { ['games/' + k]: state.games[k], ['turns/' + k]: null, ['clock/' + k]: null };
  }
  // New game starts over the games this phone shows: in the two 1v1s, a player's phone restarts
  // only their own 1v1, so the other pair plays on.
  newGameBtn.addEventListener('click', () => {
    if (viewKeys().every(k => untouched(state.games[k])) || newGameBtn.classList.contains('armed')) {
      send(Object.assign({}, ...viewKeys().map(resetGame)));
      marking = []; save(); build(); closeMenu();
      return;
    }
    newGameBtn.classList.add('armed');
    newGameBtn.textContent = 'Tap again to reset everyone';
    armTimer = setTimeout(disarm, 3000);
  });
  [0, 1, 2, 3].forEach(i => {
    const input = document.getElementById('name' + i);
    input.addEventListener('input', e => {
      state.names[i] = e.target.value; send({ ['names/' + i]: state.names[i] }); save(); build(); syncMenu();
    });
    // Leaving the box empty (or holding someone else's name) puts the default name back.
    input.addEventListener('change', () => {
      if (!badName(i, input.value)) return;
      state.names[i] = input.value = DEFAULT_NAMES[i];
      send({ ['names/' + i]: state.names[i] }); save(); build(); syncMenu();
    });
  });
  document.getElementById('pickFirst').addEventListener('click', () => { closeMenu(); pickFirst(); });

  // Conceding (or taking it back) only touches this phone's seat, and takes a second tap.
  const mySeat = () => Math.max(0, players.findIndex(p => p.e === state.me));
  concedeBtn.addEventListener('click', () => {
    if (!concedeBtn.classList.contains('armed')) {
      const conceded = playerOf(mySeat()).conceded;
      disarm();
      concedeBtn.classList.add('armed');
      concedeBtn.textContent = conceded ? 'Tap again to rejoin' : 'Tap again to concede';
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    toggleConcede(mySeat()); closeMenu();
  });

  // ---- results ----
  // A game is logged when it finishes (see settle()), and again, harmlessly, when New game is tapped,
  // in case it finished on a phone that couldn't log it. Only a real finish counts: a table of two or
  // more, exactly one player left standing, and at least MIN_GAME_MINUTES on its clock. Results are
  // stored under the game's id, so logging it twice just writes the same entry. A result Firebase
  // won't take waits on this phone and goes up next time.
  const loadMine = () => { try { return JSON.parse(localStorage.getItem(RESULTS_KEY)) || {}; } catch (e) { return {}; } };
  const saveMine = all => { try { localStorage.setItem(RESULTS_KEY, JSON.stringify(all)); } catch (e) {} };
  const resultUrl = id => RESULTS_URL + (id ? '/' + id : '') + '.json';

  function record(k) {
    const n = SIZE[k], g = state.games[k], m = state.meta[k];
    if (n === 1 || !m.id || !m.at) return;
    const alive = g.map((p, i) => i).filter(i => !outReason(g[i]));
    const end = m.end || Date.now();
    const minutes = Math.round((end - m.at) / 60000);
    if (alive.length !== 1 || minutes < MIN_GAME_MINUTES) return;
    // The turn in progress when the game ended runs to the end.
    const c = state.clock[k], cur = state.turns[k];
    const turnMs = i => (c.t[i] || 0) + (i === cur && c.at ? Math.max(0, end - c.at) : 0);
    const result = {
      at: end, minutes, players: n, start: state.start, turns: c.count || 0,
      seats: g.map((p, i) => {
        const e = edgesOf(k)[i];
        return {
          name: state.names[e].trim() || DEFAULT_NAMES[e], colors: colorOf(e).slice(2), pattern: patternOf(e),
          deck: DECKS[colorOf(e).slice(2)].name, card: patternOf(e) === CARD ? cardOf(e) : null,
          life: p.life, out: outReason(p) || null, won: i === alive[0],
          turns: c.c[i] || 0, turnSecs: Math.round(turnMs(i) / 1000),
        };
      }),
    };
    const mine = loadMine();
    mine[m.id] = Object.assign({ pending: true }, result);
    saveMine(mine);
    upload(m.id, result);
  }
  function unlog(id) {
    const mine = loadMine();
    if (mine[id]) { delete mine[id]; saveMine(mine); }
    if (DB) fetch(resultUrl(id), { method: 'DELETE' }).catch(() => {});
  }
  function upload(id, result) {
    if (!DB) return Promise.resolve(false);
    return fetch(resultUrl(id), { method: 'PUT', body: JSON.stringify(result) })
      .then(res => {
        if (!res.ok) return false;
        const mine = loadMine();
        if (mine[id]) { delete mine[id].pending; saveMine(mine); }
        return true;
      })
      .catch(() => false);
  }

  const resultsEl = document.getElementById('results');
  const okResult = r => r && typeof r.at === 'number' && Array.isArray(r.seats);
  // Results from before v3.21 have only colors, and each color pair is one deck.
  const deckOf = x => typeof x.deck === 'string' ? x.deck : DECKS[x.colors] ? DECKS[x.colors].name : '';
  function showResults(all, note) {
    const list = Object.keys(all).filter(id => okResult(all[id])).sort((a, b) => all[b].at - all[a].at);
    resultsEl.innerHTML = (note ? `<p class="res-note">${esc(note)}</p>` : '') + (list.length ? list.map(id => {
      const r = all[id], win = r.seats.find(x => x.won) || {};
      const day = new Date(r.at).toLocaleDateString([], { month: 'short', day: 'numeric' });
      return `<div class="res-row">
        <div class="res-head"><b>${esc(win.name)} won</b><span>${esc(deckOf(win))} &middot; ${day} &middot; ${+r.minutes || 0} min${r.turns ? ` &middot; ${+r.turns} turns` : ''}${r.pending ? ' &middot; this phone only' : ''}</span>
          <button type="button" class="res-del" data-id="${esc(id)}">Delete</button></div>
        <div class="res-players">${r.seats.map(x => `<span class="${SCHEMES[x.colors] ? 'k-' + x.colors : ''}${x.won ? ' won' : ''}" title="${esc(deckOf(x))}"><i class="sw"></i>${esc(x.name)}${x.turns ? ` ${Math.round((+x.turnSecs || 0) / 60)}m` : ''}</span>`).join('')}</div>
      </div>`;
    }).join('') : '<p class="res-note">No finished games logged yet.</p>');
  }
  // The shared log, plus anything this phone logged that hasn't reached it yet (sent up now).
  let shown = {};
  function loadResults() {
    const mine = loadMine(), pending = {};
    Object.keys(mine).forEach(id => { if (mine[id].pending) pending[id] = mine[id]; });
    shown = Object.assign({}, mine);
    showResults(shown, 'Loading the shared log…');
    if (!DB) return showResults(shown, "Showing this phone's games.");
    fetch(resultUrl())
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(remote => {
        shown = Object.assign({}, remote && typeof remote === 'object' ? remote : {}, pending);
        showResults(shown);
        Object.keys(pending).forEach(id => upload(id, Object.assign({}, pending[id], { pending: undefined })));
      })
      .catch(() => showResults(shown, "Couldn't reach the shared log. Showing this phone's games."));
  }
  document.getElementById('resultsField').addEventListener('toggle', e => { if (e.target.open) loadResults(); });
  // The log stays out of sight: tapping the version line at the foot of the menu shows or hides it.
  const resultsField = document.getElementById('resultsField');
  document.getElementById('ver').addEventListener('click', () => {
    resultsField.hidden = !resultsField.hidden;
    resultsField.open = !resultsField.hidden;
    if (!resultsField.hidden) resultsField.scrollIntoView({ block: 'nearest' });
  });
  resultsEl.addEventListener('click', e => {
    const b = e.target.closest('.res-del');
    if (!b) return;
    if (!b.classList.contains('armed')) {
      resultsEl.querySelectorAll('.res-del.armed').forEach(x => { x.classList.remove('armed'); x.textContent = 'Delete'; });
      b.classList.add('armed'); b.textContent = 'Tap again';
      return;
    }
    unlog(b.dataset.id);
    delete shown[b.dataset.id]; showResults(shown);
  });

  // Random first player: the highlight runs around the table clockwise and slows to a stop. A Center
  // phone in the two 1v1s picks for both at once.
  function pickFirst() {
    viewKeys().forEach(key => {
      const group = players.map((p, i) => i).filter(i => players[i].k === key);
      const own = group.map(i => seats[i]), n = group.length;
      const winner = Math.floor(Math.random() * n);
      const steps = 3 * n + winner + n * Math.floor(Math.random() * 2);
      own.flat().forEach(s => { s.classList.remove('pick'); s.querySelector('.badge').hidden = true; });
      let k = 0;
      const tick = () => {
        own.flat().forEach(s => s.classList.remove('pick'));
        const idx = k % n;
        own[idx].forEach(s => s.classList.add('pick'));
        buzz();
        if (k >= steps) {
          const badges = own[idx].map(s => s.querySelector('.badge'));
          badges.forEach(b => { b.hidden = false; });
          setTimeout(() => { badges.forEach(b => { b.hidden = true; }); own[idx].forEach(s => s.classList.remove('pick')); }, 3000);
          setTurn(key, players[group[idx]].j);
          return;
        }
        k++;
        setTimeout(tick, 60 + k * k * 1.6);
      };
      tick();
    });
  }

  // ---- live sync ----
  // Every device on the link shares one table in a Firebase Realtime Database, reached through its
  // REST API: a server-sent event stream delivers the table and every change to it, and taps go up
  // as server-side increments so taps on two phones at once both count. Without the database the
  // page keeps working on its own.
  const DB = 'https://commander-life-39708-default-rtdb.firebaseio.com';
  const TABLE_URL = DB + '/tables/t7q2xm4k.json';
  // Logged games sit beside the table, not in it, so nothing that resets the table touches them.
  // They stay under tables/, the only part of the database its rules open to the page.
  const RESULTS_URL = DB + '/tables/t7q2xm4k-results';

  const inc = d => ({ '.sv': { increment: d } });
  const allPaths = () => ['mode', 'start', 'pairs', 'names/0', 'names/1', 'names/2', 'names/3',
    'colors/0', 'colors/1', 'colors/2', 'colors/3', 'patterns/0', 'patterns/1', 'patterns/2', 'patterns/3',
    'cards/0', 'cards/1', 'cards/2', 'cards/3']
    .concat(...KEYS.map(k => [].concat(...Array.from({ length: SIZE[k] }, (_, i) =>
      ['life', 'cmd/0', 'cmd/1', 'cmd/2', 'conceded'].map(f => `games/${k}/${i}/${f}`)))),
      ...KEYS.map(k => [`meta/${k}/id`, `meta/${k}/at`, `meta/${k}/end`]), TURN_KEYS.map(k => 'turns/' + k),
      ...TURN_KEYS.map(k => [`clock/${k}/at`, `clock/${k}/count`].concat(
        ...Array.from({ length: SIZE[k] }, (_, i) => [`clock/${k}/t/${i}`, `clock/${k}/c/${i}`]))));
  const getAt = (root, path) => path.split('/').reduce((o, k) => o == null ? undefined : o[k], root);
  function setAt(path, v) {
    const keys = path.split('/'), last = keys.pop();
    keys.reduce((o, k) => o[k], state)[last] = v;
  }
  const shared = () => ({ mode: state.mode, start: state.start, pairs: state.pairs, names: state.names, colors: state.colors, patterns: state.patterns, cards: state.cards, games: state.games, meta: state.meta, turns: state.turns, clock: state.clock });

  // Increments fall back to plain values if the database refuses them.
  function send(patch) {
    if (!DB) return;
    const body = JSON.stringify(patch);
    const plain = {};
    Object.keys(patch).forEach(k => { plain[k] = patch[k] && patch[k]['.sv'] ? getAt(state, k) : patch[k]; });
    fetch(TABLE_URL, { method: 'PATCH', body })
      .then(res => {
        if (!res.ok && body !== JSON.stringify(plain)) return fetch(TABLE_URL, { method: 'PATCH', body: JSON.stringify(plain) });
      })
      .catch(() => {});
  }

  function validValue(p, v) {
    if (p === 'mode') return MODES.includes(v);
    if (p === 'pairs') return [1, 2, 3].includes(v);
    if (p === 'start') return [20, 30, 40].includes(v);
    // A blank or wrong-box name from another phone (or someone mid-edit) is ignored; see badName.
    if (p.startsWith('names/')) return typeof v === 'string' && v.length <= 12 && !badName(+p.slice(6), v);
    if (p.startsWith('colors/')) return Object.prototype.hasOwnProperty.call(SCHEMES, v);
    if (p.startsWith('patterns/')) return Object.prototype.hasOwnProperty.call(PATTERNS, v);
    if (p.startsWith('cards/')) return v === null || Object.prototype.hasOwnProperty.call(CARD_IMG, v);
    if (p.endsWith('/conceded')) return typeof v === 'boolean';
    if (p.startsWith('clock/')) return v === null || (typeof v === 'number' && isFinite(v) && v >= 0);
    if (p.startsWith('turns/')) return v === null || (Number.isInteger(v) && v >= 0 && v < SIZE[p.slice(6)]);
    if (p.startsWith('meta/')) return v === null || (p.endsWith('/id') ? typeof v === 'string' && v.length <= 24 : typeof v === 'number' && isFinite(v));
    return typeof v === 'number' && isFinite(v) && Math.abs(v) < 1e6;
  }
  // Write `data` into the local copy of the table at `path`; null removes it.
  let mirror = null;
  function putIn(path, data) {
    const keys = path.split('/').filter(Boolean);
    if (!keys.length) { mirror = data; return; }
    if (!mirror || typeof mirror !== 'object') mirror = {};
    const last = keys.pop();
    const parent = keys.reduce((o, k) => (o[k] = o[k] && typeof o[k] === 'object' ? o[k] : {}), mirror);
    if (data === null) delete parent[last]; else parent[last] = data;
  }

  // Take every value the table holds over this phone's own.
  function adopt() {
    const changed = [];
    // Put back any blank or wrong-box name the table holds, unless someone here is typing it.
    const fix = {};
    [0, 1, 2, 3].forEach(i => {
      const v = getAt(mirror, 'names/' + i);
      if (typeof v === 'string' && badName(i, v) && document.activeElement !== document.getElementById('name' + i)) fix['names/' + i] = state.names[i];
    });
    if (Object.keys(fix).length) send(fix);
    allPaths().forEach(p => {
      let v = getAt(mirror, p);
      const was = getAt(state, p);
      // A seat reset by a phone from before v3.0 carries no concession: it's back in.
      if (v === undefined && p.endsWith('/conceded') && getAt(mirror, p.slice(0, -'/conceded'.length))) v = false;
      // A table that holds no meta, turn or turn timer (cleared, or set up by an older phone) has none.
      if (v === undefined && /^(meta|turns|clock)\//.test(p) && mirror && typeof mirror === 'object') v = null;
      if (v !== undefined && v !== was && validValue(p, v)) { setAt(p, v); changed.push({ p, was }); }
    });
    if (!changed.length) return;
    save();
    if (changed.some(x => !/^(games|meta|turns|clock)\//.test(x.p))) {
      if (changed.some(x => x.p === 'mode' || x.p === 'pairs')) marking = [];
      build();
      if (!menu.hidden) syncMenu();
      return;
    }
    if (changed.some(x => x.p.startsWith('turns/'))) paintTurn();
    changed.forEach(({ p, was }) => {
      const [kind, k, j, f] = p.split('/');
      if (kind !== 'games') return;
      const i = players.findIndex(x => String(x.k) === k && x.j === +j);
      if (i < 0) return;
      if (f === 'life') showDelta(i, getAt(state, p) - was);
      update(i);
    });
  }

  function setLive(on) {
    document.getElementById('ver').textContent =
      'v' + VERSION + ' · ' + (on ? 'Sharing live with this table' : 'Offline, this phone only');
  }
  let stream = null;
  function connect() {
    if (stream) stream.close();
    stream = new EventSource(TABLE_URL);
    stream.onopen = () => setLive(true);
    stream.onerror = () => setLive(stream.readyState === EventSource.OPEN); // it reconnects by itself
    stream.addEventListener('put', e => {
      const { path, data } = JSON.parse(e.data);
      // The first device here starts the table from its own game.
      if (path === '/' && data === null) {
        fetch(TABLE_URL, { method: 'PUT', body: JSON.stringify(shared()) }).catch(() => {});
        return;
      }
      putIn(path, data);
      adopt();
    });
    stream.addEventListener('patch', e => {
      const { path, data } = JSON.parse(e.data);
      Object.keys(data).forEach(k => putIn(path + '/' + k, data[k]));
      adopt();
    });
    // The database ended the stream (its rules changed): carry on alone.
    stream.addEventListener('cancel', () => { stream.close(); setLive(false); });
  }
  setLive(false);
  if (DB && 'EventSource' in window) {
    connect();
    // A phone that slept may hold a dead stream; a fresh one brings the whole table back.
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') connect(); });
  }

  build();
})();
</script>
</body>
</html>
