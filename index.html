/* The card fonts, served from fonts/: Matrix Bold (old card names) for names and totals, MPlantin
   (rules text) for everything else. Each has one weight, declared across the range so the browser
   never smears on a fake bold. Both are kept to plain ASCII (and Matrix's minus): their other
   symbols are blank or point at the wrong letters, so those fall back to Georgia. Matrix-Bold.woff
   has its line metrics fixed (the original's put the descent above the baseline and clipped names). */
@font-face { font-family: "Matrix"; src: url(fonts/Matrix-Bold.woff) format("woff"); font-weight: 100 900; font-display: swap; unicode-range: U+20-7E, U+2212; }
/* Life totals in Beleren Bold (v3.31), the font on Magic card names. Only the digits, + and - are
   kept (fonts/Beleren-Bold-digits.woff), all a total needs. */
@font-face { font-family: "Beleren"; src: url(fonts/Beleren-Bold-digits.woff) format("woff"); font-weight: 100 900; font-display: block; unicode-range: U+20, U+2B, U+2D, U+30-39, U+B1, U+2212; }
/* v1.47: Mplantin-text.woff is Mplantin.woff with its Unicode map rebuilt from its Mac Roman table
   (the original's non-ASCII map was scrambled: ’ drew Ê, – drew ·), keeping only the characters
   checked by eye, so accents, curly quotes, dashes and … in song titles show in the card-text font. */
@font-face { font-family: "MPlantin"; src: url(fonts/Mplantin-text.woff) format("woff"); font-weight: 100 900; font-display: swap; unicode-range: U+20-7E, U+A1-A3, U+A5, U+A7-AB, U+AE, U+B1, U+B4-B6, U+B8, U+BA-BB, U+BF-CF, U+D1, U+D3-D6, U+D8-DC, U+DF-EF, U+F1-F6, U+F8-FC, U+FF, U+131, U+152-153, U+178, U+192, U+2013-2014, U+2018-2019, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2122; }

/* Color pairs, one per deck. The seat shows its commander's art; these colors paint the seat while
   the art loads, and the swatches and chips that stand for the player. */
.k-gr { --seat: #2a6238; --seat-hi: #3f8a50; --accent: #c0442f; }
.k-uw { --seat: #1b4a84; --seat-hi: #2c69b3; --accent: #d9ccab; }
.k-rb { --seat: #8e2a1f; --seat-hi: #c0442f; --accent: #121014; }
.k-bu { --seat: #17161b; --seat-hi: #34303d; --accent: #2c69b3; }
.k-gw { --seat: #2a6238; --seat-hi: #3f8a50; --accent: #d9ccab; }
/* Living Energy (Aetherdrift, Saheeli): only a background (v1.6), so only its seat colors. */
.k-le { --seat: #4a2f6e; --seat-hi: #6b4a9a; --accent: #2f8a6a; }
/* v1.10 backgrounds: each new precon's commander and its alternate commander (both only backgrounds). */
.k-le2 { --seat: #2a5a4e; --seat-hi: #3f8070; --accent: #c0442f; }  /* Pia Nalaar, Living Energy's alternate */
.k-em, .k-em2 { --seat: #2a3a5e; --seat-hi: #3f5a8a; --accent: #c9a440; }  /* Eternal Might: Temmet, Hashaton */
.k-rt, .k-rt2 { --seat: #5e2240; --seat-hi: #8a3460; --accent: #d9ccab; }  /* Revival Trance: Terra, Celes */
.k-bq, .k-lo { --seat: #14261c; --seat-hi: #2a4a34; --accent: #4fd17a; }  /* We Are the Borg: Borg Queen, Locutus */
.k-pi, .k-ja { --seat: #7a1c1c; --seat-hi: #a83232; --accent: #d9b24a; }  /* Federation Fleet: Picard, Janeway */
.k-sp, .k-ki { --seat: #1d4f6e; --seat-hi: #2f7aa0; --accent: #3f8a50; }  /* Landing Party: Spock, Kirk */
.k-wo, .k-ko { --seat: #5a1a14; --seat-hi: #8e2a1f; --accent: #c9a440; }  /* Klingon Fury: Worf, Kor */

[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--table); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--table); color: var(--ink);
  font-family: var(--f-ui); font-size: 16px;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
/* v1.63: the board and the first-player pill take no panning or zooming. This was on the body until
   v1.62, which (iPad Safari counts every ancestor's touch-action) also stopped the menu scrolling. */
#app, .first-ask { touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--hot); outline-offset: -3px; }

#app {
  position: relative; height: 100%;
  padding-block: 6px;
  padding-left: max(6px, env(safe-area-inset-left, 0px));
  padding-right: max(6px, env(safe-area-inset-right, 0px));
}
/* Pinned: when the device turns, the board turns back so seats stay on the same physical edge. */
#app.pinned {
  position: fixed; top: 50%; left: 50%;
  width: var(--pin-w); height: var(--pin-h);
  transform: translate(-50%, -50%) rotate(var(--spin));
}
.board { height: 100%; display: grid; gap: 6px; }
.board.n2 { grid-template-areas: "top" "bottom"; grid-template-rows: 1fr 1fr; }
.board.n3 {
  grid-template-areas: "left right" "bottom bottom";
  grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr;
}
.board.n4 {
  grid-template-areas: "top top" "left right" "bottom bottom";
  grid-template-rows: 1.2fr 1.6fr 1.2fr; grid-template-columns: 1fr 1fr;
}
/* Quadrants (v3.34, a 4-player layout option): a quarter each, in seating order going clockwise
   from this phone's player at bottom left. The seats keep their edge classes, so a Center phone
   still turns each one to face its owner's side and an upright phone faces them all to its owner. */
.board.n4.quad { grid-template-areas: "left top" "bottom right"; grid-template-rows: 1fr 1fr; }
/* Big button (v1.22, a 4-player layout option, made for an iPad on the table): Table's seats on the
   phone's edges with a huge turn button where the side seats meet. v1.23: the side seats run right
   up to the middle (v1.22 left an empty cell round the button), so all of it is tap area; their
   totals are moved clear of the button (hubLife()). */
.board.n4.hub { grid-template-rows: 1fr 1.4fr 1fr; }
/* iPad at 3 players (v1.61): the side seats tall, the button where they meet. v1.62: true thirds
   (the user's ask): the side seats take two thirds of the height, so each seat is a third of the screen. */
.board.n3.hub:not(.sfy) { grid-template-rows: 2fr 1fr; }
/* On a Center phone the side seats' tops face the middle, under the button, so their names go to
   the bottom, by their player's own edge. */
.hub:not(.upright) .s1 .name, .hub:not(.upright) .s3 .name { top: auto; bottom: calc(7 * var(--cqh, 1vh)); }
.hub ~ .turn-big { border-width: 5px; box-shadow: 0 0 0 3px var(--line), 0 0 44px rgba(255, 179, 71, .6), 0 8px 20px rgba(0, 0, 0, .55); }
.hub + .menu-btn { transform: none; z-index: 11; }
/* iPad at three seats (v1.64): a bigger menu button, at the top middle (placeTurn()). */
.n3.hub + .menu-btn { width: 72px; height: 72px; border-width: 3px; transform: none; }
.n3.hub + .menu-btn img { height: 44px; }
/* Spotlight (v3.35, the default at 3 and 4 players): whoever has the turn takes the bottom half
   (v3.36; it was the top), the others share the top in turn order after them. Everyone faces this
   phone's player. */
.board.spot { grid-template-areas: "a b c" "main main main"; grid-template-rows: 1fr 1fr; grid-template-columns: repeat(3, 1fr); }
.board.spot.n3 { grid-template-areas: "a b" "main main"; grid-template-columns: 1fr 1fr; }
.sp-main { grid-area: main; }
.sp-1 { grid-area: a; }
.sp-2 { grid-area: b; }
.sp-3 { grid-area: c; }
.board.n1 { grid-template: 1fr / 1fr; }
/* The button box (v1.44, the user's ask): in Classic and Side by side, without the Spotify bar, each
   seat is a third shorter, pulled in to its short edge, and the middle third holds the turn and menu
   buttons, both bigger (sized in placeTurn()). */
.board.n2.table.boxed { grid-template-areas: "top" "mid" "bottom"; grid-template-rows: 1fr 1fr 1fr; }
.board.duel.boxed { grid-template: "tl tr" 1fr "mid mid" 1fr "bl br" 1fr / 1fr 1fr; }
.btn-box {
  grid-area: mid; min-height: 0; border-radius: 18px; border: 2px solid var(--line);
  background: radial-gradient(ellipse at 50% 50%, rgba(255, 179, 71, .16), transparent 62%), var(--table);
}
.boxed ~ .turn-big { border-width: 4px; box-shadow: 0 0 0 3px var(--line), 0 0 36px rgba(255, 179, 71, .6), 0 8px 18px rgba(0, 0, 0, .55); }
.boxed + .menu-btn img { height: 36px; }
/* Head to head, side by side: each half of the phone faces one player and shows both totals, theirs
   on the left, so each player's colors run down one side. The top half is turned to the far player. */
.board.duel { grid-template: "tl tr" 1fr "bl br" 1fr / 1fr 1fr; }
.d-tl { grid-area: tl; }
.d-tr { grid-area: tr; }
.d-bl { grid-area: bl; }
.d-br { grid-area: br; }
.d-tl .face, .d-tr .face { --rot: 180deg; }
/* Couch (v1.28): the phone faces two people sitting side by side, so it's one seat each, upright,
   Rand on the left and Lenn on the right. */
.board.couch { grid-template: "cl cr" 1fr / 1fr 1fr; }
.d-cl { grid-area: cl; }
.d-cr { grid-area: cr; }
/* Spotify remote (v1.31, menu → Spotify, this phone only; every layout since v1.35). Where the
   seats face one way (Side by side, Couch, Spotlight, 1) the bar takes the top of the phone; where
   they sit round the edges (Classic, Table, Big button, Quadrants) it takes the middle, so every
   total stays on the outside and the turn button sits in the bar's hole (.sfy-hole). */
.board.duel.sfy { grid-template: "sp sp" 1fr "tl tr" 2fr "bl br" 2fr / 1fr 1fr; }
.board.duel.couch.sfy { grid-template: "sp sp" 1fr "cl cr" 4fr / 1fr 1fr; }
/* Side by side with the bar (v1.36): the phone faces this side only (the user: nobody sits at the
   far end), so the turned top half is left out and the upright half takes the rest. */
.board.duel.half.sfy { grid-template: "sp sp" 1fr "bl br" 4fr / 1fr 1fr; }
.half.sfy ~ .turn-big { top: 79%; }
.board.n1.sfy { grid-template: "sp" 1fr "one" 4fr / 1fr; }
.board.n1.sfy .seat { grid-area: one; }
.board.spot.sfy { grid-template-areas: "sp sp sp" "a b c" "main main main"; grid-template-rows: 1fr 2fr 2fr; }
.board.spot.n3.sfy { grid-template-areas: "sp sp" "a b" "main main"; }
.board.n2.table.sfy { grid-template-areas: "top" "sp" "bottom"; grid-template-rows: 2fr 1fr 2fr; }
.board.n3.table.sfy:not(.spot) { grid-template-areas: "left right" "sp sp" "bottom bottom"; grid-template-rows: 2fr 1fr 2fr; }
.board.n4.quad.sfy { grid-template-areas: "left top" "sp sp" "bottom right"; grid-template-rows: 2fr 1fr 2fr; grid-template-columns: 1fr 1fr; }
.couch.sfy ~ .turn-big { top: 79%; }
.sfy-bar {
  grid-area: sp; position: relative; min-height: 0; min-width: 0; overflow: hidden; border-radius: 18px;
  padding: 10px 12px; background: #121212; border: 1px solid var(--line); color: #fff; touch-action: manipulation;
}
/* On top: the song over its buttons, the menu button in the bottom-right corner. */
.sfy-in { height: 100%; min-width: 0; display: grid; grid-template: "txt" auto "ctl" 1fr / 1fr; gap: 6px; }
.sfy-hole { grid-area: hole; display: none; }
/* In the middle, wide (Classic, 3 players, Quadrants). v1.46 (the user's sketch): the turn button
   takes the right third, full height; on the left the song and artist fill the top and play, next
   and the menu button sit in a row under them (the menu button over .sfy-mspot, by placeTurn()). */
.table:not(.spot) > .sfy-bar .sfy-in { grid-template: "txt hole" 1fr "ctl hole" auto / 1fr 36%; column-gap: 10px; }
.sfy-mspot { display: none; flex: none; width: 42px; height: 42px; }
.table:not(.spot) > .sfy-bar .sfy-mspot { display: block; }
.table:not(.spot) > .sfy-bar .sfy-hole { display: block; }
/* v1.42: the song and artist wrap to fill the space left of the turn button, down to the buttons
   (the user's ask), and stop there by whole lines (sfyFit() sets each one's line count). */
.table:not(.spot) > .sfy-bar .sfy-text { min-height: 0; overflow: hidden; }
.table:not(.spot) > .sfy-bar .sfy-text > * { flex: none; overflow-wrap: anywhere; }
.table:not(.spot) > .sfy-bar .sfy-text b { -webkit-line-clamp: none; font-size: calc(17px * var(--sfb, 1)); }
.table:not(.spot) > .sfy-bar .sfy-text span { white-space: normal; line-height: 1.25; display: -webkit-box; -webkit-box-orient: vertical; font-size: calc(14px * var(--sfs, 1)); }
.table:not(.spot) > .sfy-bar .sfy-ctl { padding-right: 0; justify-content: flex-start; }
/* 4-player Table and Big button (v1.37, the user's pick from two mockups): no bar. The board is Big
   button (huge turn button where the side seats meet), play/pause and next sit in a dock at the
   bottom of the bottom seat (this phone's player, or Rand on a Center phone), and the menu button
   at the top middle of that seat. */
.sfy-dock {
  position: absolute; z-index: 6; left: 50%; bottom: 12px; translate: -50% 0; max-width: 92%;
  padding: 6px 14px; border-radius: 30px; background: rgba(0, 0, 0, .55); color: #fff; touch-action: manipulation;
}
.sfy-dock .sfy-in { display: flex; align-items: center; justify-content: center; gap: 10px; }
.sfy-dock .sfy-hole, .sfy-dock .sfy-text.song { display: none; }
.sfy-dock .sfy-text p { font-size: 13px; text-align: center; }
.sfy-dock .sfy-ctl { padding: 0; justify-content: center; max-height: 120px; }
/* v1.41: play/pause at the seat's middle (the user's ask), next to its right. An invisible spacer the
   size of next on the left balances it; only while a song shows (the .song text comes before). */
.sfy-dock .sfy-text.song ~ .sfy-ctl::before { content: ''; flex: none; width: 54px; height: 54px; }
/* The dock sits at left 50%, so it may only take half the seat's width, and play and next wrapped
   onto two lines (v1.46); a song's buttons stay on one. */
.sfy-dock .sfy-text.song ~ .sfy-ctl { flex-wrap: nowrap; }
.sfy-text { grid-area: txt; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sfy-text b { font-size: 17px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.sfy-text span { font-size: 14px; color: #b3b3b3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sfy-text p { margin: 0; font-size: 15px; color: #b3b3b3; line-height: 1.3; }
.sfy-ctl { grid-area: ctl; min-width: 0; min-height: 0; padding-right: 48px; display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 8px; overflow-y: auto; }
.sfy-ctl button.sfy-b {
  flex: none; width: 46px; height: 46px; padding: 10px; border: 0; border-radius: 50%;
  display: grid; place-items: center; background: transparent; color: #fff;
}
/* v1.47: next is the big one (the user: it's tapped most), play/pause the small green one. */
.sfy-ctl button.sfy-play { width: 46px; height: 46px; padding: 12px; background: #1ed760; color: #000; }
.sfy-ctl button.sfy-b[data-a="next"] { width: 54px; height: 54px; padding: 8px; }
.sfy-ctl svg { width: 100%; height: 100%; fill: currentColor; pointer-events: none; }
.sfy-pill { border: 0; border-radius: 999px; padding: 9px 16px; background: #1ed760; color: #000; font-size: 15px; font-weight: 700; }
.sfy-pill.alt { background: rgba(255, 255, 255, .12); color: #fff; }
.sfy-pill.on { outline: 2px solid #1ed760; }
#app .sfy-bar .menu-btn { top: auto; left: auto; right: 8px; bottom: 8px; width: 42px; height: 42px; margin: 0; transform: none; }
#app .table:not(.spot) > .sfy-bar .menu-btn { right: auto; left: 8px; }
#app .sfy-bar .menu-btn img { height: 25px; }
/* Spotify's green, so the way in is easy to spot. */
#sfyConnect { align-self: center; padding: 8px 22px; border-radius: 999px; font-size: 16px; background: #1ed760; color: #000; }

.seat {
  position: relative; overflow: hidden; border-radius: 18px;
  background: radial-gradient(120% 90% at 50% 45%, var(--seat-hi), var(--seat));
  transition: filter .3s;
}
.seat.out { filter: grayscale(.85) brightness(.7); }
.seat.marking::before {
  content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  border: 4px solid var(--ink); border-radius: inherit;
}
/* Pick who goes first. Not `.pick`: that's the menu's "This phone is" ring, and it shrank the
   highlighted seat to a 40px see-through circle, so the winner vanished (fixed in v1.9). The
   highlight runs round in gold, then the winner keeps a thick pulsing gold frame and a big banner
   while everyone else goes dark. */
.seat.lit::after, .seat.first::after {
  content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none;
  border: 5px solid var(--turn); border-radius: inherit;
  box-shadow: inset 0 0 24px rgba(255, 179, 71, .7);
}
.seat.first::after { border-width: 7px; animation: firstGlow .9s ease-in-out infinite alternate; }
@keyframes firstGlow {
  from { box-shadow: inset 0 0 18px rgba(255, 179, 71, .55); }
  to { box-shadow: inset 0 0 60px rgba(255, 179, 71, .95); }
}
.seat.passed { filter: grayscale(.9) brightness(.35); }
/* The winner (v1.24): a gold frame and a gold total for as long as the game stays won, and for the
   first 10 s (.cheer) a pulsing frame, a crowned "Winner" banner and confetti over the whole phone.
   Every phone shows it, not just the one that made the last change. */
.seat.won::after {
  content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none;
  border: 6px solid var(--turn); border-radius: inherit;
  box-shadow: inset 0 0 30px rgba(255, 179, 71, .7);
}
.seat.cheer::after { border-width: 8px; animation: firstGlow .7s ease-in-out infinite alternate; }
.seat.won .num { color: var(--turn); }
.seat.cheer .life { animation: winBeat 1.1s ease-in-out infinite; }
@keyframes winBeat { 0%, 100% { scale: 1; } 50% { scale: 1.08; } }
.badge.win-badge {
  display: flex; flex-direction: column; align-items: center; gap: .1em; font-size: clamp(18px, min(calc(14 * var(--cqh, 1vh)), calc(15 * var(--cqw, 1vw))), 56px);
  background: linear-gradient(110deg, #b06a14 0%, var(--turn) 30%, #fff1c9 45%, var(--turn) 60%, #b06a14 100%);
  background-size: 250% 100%;
  animation: badgePop .5s cubic-bezier(.3, 1.6, .5, 1), winShine 1.6s linear .5s infinite;
}
.badge.win-badge[hidden] { display: none; }
.win-badge svg { width: 1.4em; height: auto; fill: #1a1208; }
@keyframes winShine { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
.win-flash {
  position: fixed; inset: 0; z-index: 14; pointer-events: none;
  background: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), rgba(255, 226, 163, .85), rgba(255, 179, 71, .35) 40%, transparent 75%);
  animation: winFlash 1.1s ease-out forwards;
}
@keyframes winFlash { from { opacity: 1; } to { opacity: 0; } }

/* The face is the seat as its player sees it. Side seats are rotated toward their table edge.
   Script measures each seat and face into --sw/--sh and --cqw/--cqh (1% of width/height), standing
   in for container query units so older iPads (Safari 14/15) lay out the same. */
/* Every seat's background is its deck's commander art (v3.25, the only option): it fills the face,
   turned with it so it's upright for its player, dimmed a little so the white totals stay readable. */
.face::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(rgba(0, 0, 0, .22), rgba(0, 0, 0, .22)), var(--art) var(--artpos, center) / cover no-repeat;
}
.face {
  position: absolute; top: 50%; left: 50%;
  width: calc(100 * var(--sw, 1vw)); height: calc(100 * var(--sh, 1vh));
  transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
}
/* Square table, one player per phone edge, clockwise from the bottom. Seat classes name the edge. */
.table .s0 { grid-area: bottom; }
.table .s1 { grid-area: left; }
.table .s2 { grid-area: top; }
.table .s3 { grid-area: right; }
.table .s1 .face, .table .s3 .face { width: calc(100 * var(--sh, 1vh)); height: calc(100 * var(--sw, 1vw)); }
.table .s1 .face { --rot: 90deg; }
.table .s2 .face { --rot: 180deg; }
.table .s3 .face { --rot: -90deg; }
/* On a player's own phone every seat faces them: no turning, side seats stay tall. */
.table.upright .face { --rot: 0deg; }
.table.upright .s1 .face, .table.upright .s3 .face { width: calc(100 * var(--sw, 1vw)); height: calc(100 * var(--sh, 1vh)); }
/* Tap zones: the left half of a seat (as its player sees it) loses life, the right half gains it.
   They show no - or + (v3.26). */
.zone {
  position: absolute; top: 0; bottom: 0; width: 50%;
  border: 0; background: transparent; padding: 0; touch-action: none;
  transition: background .12s;
}
.zone.minus { left: 0; }
.zone.plus { right: 0; }
.zone.press { background: rgba(255, 255, 255, .1); transition: none; }

.readout {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.name {
  position: absolute; top: calc(7 * var(--cqh, 1vh)); left: 0; right: 0; text-align: center;
  /* --fit shrinks a name that would overflow its seat, so every name shows in full on one line. */
  font-family: var(--f-name); font-size: calc(clamp(15px, calc(13 * var(--cqh, 1vh)), 34px) * var(--fit, 1)); font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink);
  /* Same black outline as the life total, thicker for the small type. */
  -webkit-text-stroke: .14em #000; paint-order: stroke fill;
}
.name .nm { display: inline-block; }
.name .why { display: block; margin-top: .2em; font-size: calc(.7em * var(--wfit, 1)); color: var(--ink); }
/* Corner names keep clear of the menu button in the middle of the table. */
.table .name { left: calc(6 * var(--cqw, 1vw)); right: auto; text-align: left; }
/* Bigger names still have to fit a narrow seat (see fitNames()). */
.name { max-width: calc(88 * var(--cqw, 1vw)); white-space: nowrap; overflow: hidden; }
.n3 .s3 .name { left: auto; right: calc(6 * var(--cqw, 1vw)); text-align: right; }
/* iPad view on a Center phone (v1.62): the right seat's name moves to the bottom, where the right
   corner holds its dagger, so it goes back to the left. */
.n3.hub:not(.upright) .s3 .name { left: calc(6 * var(--cqw, 1vw)); right: auto; text-align: left; }
/* Narrow tiles: the name stays centered and clear of the menu button where the four tiles meet. */
.duel .name { margin-inline: auto; max-width: calc(76 * var(--cqw, 1vw)); }
.duel .name .why { font-size: calc(.6em * var(--wfit, 1)); letter-spacing: .06em; }
.life {
  /* Beleren's digits ride high in their line box; this drops the ink onto the readout's center. */
  position: relative; top: .09em;
  font-family: var(--f-num); font-weight: 800;
  font-size: min(calc(56 * var(--cqh, 1vh)), calc(44 * var(--cqw, 1vw))); line-height: .82;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  /* A black outline, drawn behind the fill, keeps the digits readable on any art. */
  -webkit-text-stroke: .06em #000; paint-order: stroke fill;
  text-shadow: 0 2px 18px rgba(0, 0, 0, .4);
}
/* Table seats center the total, lifted just a little (v3.29) so it clears the turn button below it. */
.table .readout { padding-bottom: calc(8 * var(--cqh, 1vh)); }
.table .life { font-size: min(calc(44 * var(--cqh, 1vh)), calc(44 * var(--cqw, 1vw))); }
.duel .life { font-size: min(calc(36 * var(--cqh, 1vh)), calc(50 * var(--cqw, 1vw))); }
/* Four players: the totals as big as each seat allows, between the name and the turn button. The
   totals sit near the middle of the seat (v3.29), a touch high to clear the button; turned side seats
   (Center) keep theirs off the menu button. */
.n4 .readout { padding-bottom: calc(18 * var(--cqh, 1vh)); }
.n4 .life { font-size: min(calc(52 * var(--cqh, 1vh)), calc(56 * var(--cqw, 1vw))); }
.n4.upright .s1 .readout, .n4.upright .s3 .readout { padding-bottom: calc(4 * var(--cqh, 1vh)); }
.n4:not(.upright) .s1 .readout, .n4:not(.upright) .s3 .readout { padding-bottom: calc(20 * var(--cqh, 1vh)); }
.n4:not(.upright) .s1 .life, .n4:not(.upright) .s3 .life { font-size: min(calc(40 * var(--cqh, 1vh)), calc(56 * var(--cqw, 1vw))); }
/* Then every total on the board is drawn at one size, the smallest of those (fitLife()), so no seat's
   number dwarfs another's; three or four digits shrink to fit (--ls). Specific enough to beat the
   per-seat sizes above. */
.board.fitted .seat .face .life { font-size: calc(var(--life) * var(--ls, 1)); }
.life[data-len="3"] { --ls: .75; }
.life[data-len="4"] { --ls: .58; }
.delta {
  -webkit-text-stroke-width: .08em;
  position: absolute; left: 100%; top: .06em; margin-left: .1em;
  font-size: .3em; font-weight: 700; letter-spacing: 0;
  opacity: 0; transition: opacity .25s;
}
.delta.show { opacity: .9; transition: none; }
.badge {
  /* Across the middle of the winner's seat, over their total, so nobody can miss it. */
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 6;
  background: radial-gradient(circle at 35% 30%, #ffe2a3, var(--turn) 58%, #b06a14); color: #1a1208;
  border: 3px solid #000; box-shadow: 0 0 28px rgba(255, 179, 71, .8), 0 5px 14px rgba(0, 0, 0, .6);
  /* Wraps to two lines in a narrow seat rather than being cut off. */
  font-size: clamp(14px, min(calc(11 * var(--cqh, 1vh)), calc(12 * var(--cqw, 1vw))), 40px);
  font-weight: 700; letter-spacing: .1em; line-height: 1.1; text-transform: uppercase; text-align: center;
  width: max-content; max-width: 90%; padding: .35em .8em; border-radius: .6em; pointer-events: none;
  animation: badgePop .45s cubic-bezier(.3, 1.6, .5, 1);
}
@keyframes badgePop { from { transform: translate(-50%, -50%) scale(.3); } to { transform: translate(-50%, -50%) scale(1); } }

.tray {
  /* Commander damage sits in the seat's bottom-right corner, as its player sees it. */
  position: absolute; bottom: calc(6 * var(--cqh, 1vh)); right: calc(5 * var(--cqw, 1vw)); z-index: 2;
  display: flex; align-items: center; gap: .35em; white-space: nowrap;
  font-size: clamp(12px, min(calc(8.5 * var(--cqh, 1vh)), calc(4.3 * var(--cqw, 1vw))), 19px);
}
.chip {
  display: flex; align-items: center; gap: .35em;
  background: rgba(0, 0, 0, .28); border: 1px solid var(--line); border-radius: 999px;
  padding: .3em .7em; font-size: 1em; font-weight: 600; letter-spacing: .04em;
  touch-action: manipulation;
}
.chip { padding-left: .35em; }
.chip .ct { max-width: 5.5em; overflow: hidden; text-overflow: ellipsis; }
.chip b { font-family: var(--f-num); font-weight: 800; font-variant-numeric: tabular-nums; }
.chip.hot { border-color: var(--hot); color: var(--hot); }
.chip.on { background: var(--seat-hi); border-color: var(--ink); color: var(--ink); }
/* A player's mark (attacker chips, Results): a round crop of their commander's art (v3.29), on their
   seat colors until it loads. */
.sw {
  width: 1.5em; height: 1.5em; border-radius: 50%; flex: none;
  background: linear-gradient(135deg, var(--seat-hi) 50%, var(--accent) 50%) center / cover;
  box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .7);
}
/* Decks: each Starter Commander deck is one color pair, so picking a deck picks the seat's colors.
   The commander's art comes from Scryfall; until it loads (or if it can't) the colors show instead. */
.decks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.deck {
  display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; text-align: left;
  border-radius: 12px; border: 2px solid transparent; background: rgba(255, 255, 255, .06);
}
.deck .art {
  flex: none; width: min(64px, 14vw); height: 46px; border-radius: 9px; overflow: hidden;
  background: linear-gradient(135deg, var(--seat-hi) 50%, var(--accent) 50%);
}
.deck .art img, .decklist img { display: block; width: 100%; height: 100%; object-fit: cover; }
.deck span { flex: 1; display: flex; flex-direction: column; min-width: 0; }
/* Tapping a deck opens it (its commander card, a Play button, its list); only Play changes decks. */
.deck { width: 100%; box-sizing: border-box; }
/* Each deck's colors as mana symbols, one per color, like a card's mana cost. */
.deck .mana { flex: none; display: flex; gap: 2px; }
.deck .mana svg { width: 23px; height: 23px; display: block; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .6)); }
.decks > div { min-width: 0; }
.deck.open { border-color: var(--line); }
.deck-more { display: grid; gap: 10px; padding: 10px 4px 8px; }
.deck-more .card { width: min(100%, 230px); aspect-ratio: 488 / 680; margin: 0 auto; border-radius: 11px; overflow: hidden; background: rgba(255, 255, 255, .06); }
.deck-more .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
.deck-more .playing { margin: 0; text-align: center; font-size: 15px; color: var(--hot); }
.deck b { font-size: min(17px, 4.2vw); font-weight: 600; line-height: 1.15; }
.deck small { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.decklist ul { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 12px; font-size: 14px; line-height: 1.35; color: var(--ink-2); }
.decklist li { break-inside: avoid; padding-left: .8em; text-indent: -.8em; margin-bottom: .15em; }
.decklist .cmdr { margin: 0 0 8px; font-size: 15px; text-align: center; }
.decklist .src { margin: 8px 0 0; font-size: 12px; color: var(--ink-2); opacity: .7; }
.deck.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--table) inset; }
details.field > summary {
  display: flex; justify-content: space-between; align-items: center; cursor: pointer; list-style: none;
  font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
}
details.field > summary::-webkit-details-marker { display: none; }
details.field > summary::after { content: "+"; font-size: 20px; letter-spacing: 0; }
details.field[open] > summary::after { content: "\2212"; }
/* Spaced by margins: Safari lays out <details> as a block whatever its display says. */
details.field[open] > summary { margin-bottom: 10px; }
/* The folded field's current setting, next to its label (Sound, Speaker). */
details.field > summary .sum-v { flex: 1; margin-left: .7em; color: var(--ink); letter-spacing: .06em; }
/* Commander damage: the shield opens the attackers above it; while one is marked, only their chip shows. */
.cmd-btn {
  position: relative; display: grid; place-items: center;
  width: 2.4em; height: 2.4em; padding: 0; border-radius: 50%;
  background: transparent; border: 0;
  touch-action: manipulation;
}
/* The mask cuts the dagger out of its ::before; the shadows on the wrapper trace it in black. */
.cmd-btn .blade {
  width: 2em; height: 2em;
  filter: drop-shadow(1.5px 0 0 #000) drop-shadow(-1.5px 0 0 #000) drop-shadow(0 1.5px 0 #000) drop-shadow(0 -1.5px 0 #000);
}
.cmd-btn .blade::before {
  content: ""; display: block; width: 100%; height: 100%; background: currentColor;
  -webkit-mask: var(--blade) center / contain no-repeat; mask: var(--blade) center / contain no-repeat;
}
.cmd-btn b {
  position: absolute; top: -.3em; right: -.6em; min-width: 1.6em; padding: .05em .3em;
  border-radius: 999px; background: var(--ink); color: var(--table);
  font-family: var(--f-num); font-size: .8em; font-weight: 800; font-variant-numeric: tabular-nums;
}
.cmd-btn.hot { color: var(--hot); }
.cmd-btn.hot b { background: var(--hot); }
.pop {
  position: absolute; bottom: calc(100% + .5em); right: 0;
  display: none; gap: .35em; width: max-content; padding: .35em;
  border-radius: 999px; background: var(--table); box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
}
.seat.open .pop { display: flex; }
/* Upright side seats are too narrow for a row of attackers, so they stack. */
.upright .s1 .pop, .upright .s3 .pop { flex-direction: column; border-radius: 18px; }
.seat.marking .cmd-btn, .seat.marking .pop .chip:not(.on) { display: none; }
/* The turn button (v1.3) replaces the turn tracker: one big gold button in the middle of the
   table. Tapping it plays a random goofy sound (see turnSound()); nothing is tracked. Magic's tap
   symbol on it, from the Mana font's SVGs. */
.turn-big {
  position: absolute; z-index: 10; top: 50%; left: 50%; translate: -50% -50%;
  width: 96px; height: 96px; padding: 0; border-radius: 50%; display: grid; place-items: center;
  border: 3px solid #000; color: #1a1208; touch-action: manipulation;
  background: radial-gradient(circle at 35% 30%, #ffe2a3, var(--turn) 58%, #b06a14);
  box-shadow: 0 0 0 2px var(--line), 0 0 22px rgba(255, 179, 71, .55), 0 5px 12px rgba(0, 0, 0, .55);
}
.turn-big svg { width: 58%; height: 58%; fill: currentColor; pointer-events: none; }
.turn-big.boing { animation: boing .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes boing { 0% { scale: 1; } 25% { scale: .8 1.1; } 55% { scale: 1.15 .9; } 100% { scale: 1; } }
.has-mini .turn-big { margin-top: 20px; }
/* "Solo": the total fills the middle, so the button sits at the bottom. */
.n1 ~ .turn-big { top: auto; bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 14px)); translate: -50% 0; width: 84px; height: 84px; }
/* The tiles are narrow, so their dagger is sized by width to stay tappable. */
.duel .tray { font-size: clamp(14px, calc(8 * var(--cqw, 1vw)), 19px); }
/* The deck's mana symbols in the seat's bottom-left corner, as its player sees it (v3.38), level
   with the dagger opposite. Taps go through them to the life zone. */
.seat-mana {
  position: absolute; bottom: calc(6 * var(--cqh, 1vh)); left: calc(5 * var(--cqw, 1vw)); z-index: 2;
  height: 2.4em; display: flex; align-items: center; pointer-events: none;
  font-size: clamp(12px, min(calc(8.5 * var(--cqh, 1vh)), calc(4.3 * var(--cqw, 1vw))), 19px);
}
.seat-mana .mana { display: flex; gap: .15em; }
.seat-mana svg { display: block; width: 1.25em; height: 1.25em; filter: drop-shadow(0 0 0 #000) drop-shadow(0 1px 1.5px rgba(0, 0, 0, .8)); }
.duel .seat-mana { font-size: clamp(14px, calc(8 * var(--cqw, 1vw)), 19px); }
.seat.marking .pop { display: flex; position: static; padding: 0; background: none; }

/* In the two 1v1s a player's phone shows its own 1v1 and, in a strip on top, the other game's totals.
   Tapping the strip lets this player pick who they play. */
#app.has-mini { padding-top: 46px; }
/* div.mini, not .mini: the menu's small buttons (Concede) are .action.mini, and this pulled them to the top. */
div.mini { position: absolute; top: 6px; left: max(6px, env(safe-area-inset-left, 0px)); right: max(6px, env(safe-area-inset-right, 0px)); z-index: 11; }
.mini-bar {
  width: 100%; height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 0 12px; border-radius: 12px; background: var(--table); border: 2px solid var(--line);
  font-family: var(--f-name); font-size: 15px; color: #fff;
}
.mini-p { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mini-p .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-p b { font-family: var(--f-num); font-size: 20px; line-height: 1; }
.mini-p.out { opacity: .45; }
.mini-p i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex: none; }
.mini-vs { opacity: .6; font-size: 12px; }
.mini-pick { display: none; margin-top: 6px; padding: 10px; border-radius: 12px; background: var(--table); border: 2px solid var(--line); }
.mini.open .mini-pick { display: block; }
.mini-pick p { margin: 0 0 8px; font-size: 14px; color: var(--ink-2); }
.mini-pick div { display: flex; gap: 8px; }
.mini-pick button { flex: 1; padding: 10px 4px; border-radius: 10px; border: 2px solid var(--line); background: transparent; font-family: var(--f-name); font-size: 15px; color: #fff; }
.mini-pick button.on { background: #fff; color: #000; }
.mini-pick button.armed { border-color: var(--hot); }
.has-mini .menu-btn { margin-top: 20px; }
.menu-btn {
  position: absolute; z-index: 10; width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center; padding: 0;
  background: var(--table); border: 2px solid var(--line);
}
/* The Planeswalker flame, a PNG with its white background taken out. */
.menu-btn img { width: auto; height: 32px; display: block; pointer-events: none; }
/* Beside the turn button (v1.3; before, the menu button had the middle to itself). */
.table + .menu-btn, .duel + .menu-btn { top: 50%; left: calc(50% + 58px); transform: translateY(-50%); width: 46px; height: 46px; }
.table + .menu-btn img, .duel + .menu-btn img { height: 27px; }
/* Couch: the totals fill the middle, so both buttons sit lower, clear of them and of the corner icons. */
.couch ~ .turn-big, .couch + .menu-btn { top: 74%; }
.n1 + .menu-btn { top: 16px; right: max(16px, calc(env(safe-area-inset-right, 0px) + 10px)); width: 46px; height: 46px; background: rgba(0, 0, 0, .3); }

/* Menu */
/* The "Pick who goes first" popup after New game (v1.48). It leaves the seats tappable: any change
   to a total sends it away too. */
.first-ask {
  position: fixed; z-index: 15; top: 50%; left: 50%; translate: -50% -50%;
  display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 999px;
  background: rgba(10, 12, 16, .88); border: 2px solid var(--line); box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
  animation: askIn .35s cubic-bezier(.3, 1.5, .5, 1);
}
.first-ask[hidden] { display: none; }
@keyframes askIn { from { scale: .6; opacity: 0; } }
.first-go {
  padding: 16px 26px; border: 3px solid #000; border-radius: 999px; white-space: nowrap;
  font-family: var(--f-name); font-size: 22px; letter-spacing: .03em; color: #1a1208;
  background: radial-gradient(circle at 35% 30%, #ffe2a3, var(--turn) 58%, #b06a14);
  box-shadow: 0 0 22px rgba(255, 179, 71, .55);
}
.first-x { flex: none; width: 44px; height: 44px; padding: 11px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .1); }
.first-x svg { display: block; width: 100%; height: 100%; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; fill: none; }
.menu {
  position: fixed; inset: 0; z-index: 20;
  /* v1.63: the whole overlay scrolls, not the panel. v1.61's fix (the panel's max-height inside a
     grid row) still didn't scroll on the iPad, so nothing here depends on a height resolving: the
     panel takes its full height and the screen-sized overlay scrolls it. Its auto margins center it
     when it fits and go to 0 when it doesn't, so the top stays reachable. */
  display: flex; flex-direction: column; padding: 20px;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  background: rgba(0, 0, 0, .65); touch-action: pan-y;
}
.panel {
  flex: none; margin: auto; width: min(100%, 360px);
  display: flex; flex-direction: column; gap: 18px;
  padding: 22px 20px; border-radius: 20px;
  background: var(--panel); border: 1px solid var(--line);
}
.panel h2 {
  margin: 0; font-family: var(--f-name); font-weight: 800; font-size: 30px;
  letter-spacing: .04em; text-transform: uppercase; text-wrap: balance;
}
.menu-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back-icon {
  flex: none; width: 44px; height: 44px; margin: -6px -8px -6px 0; padding: 8px;
  border: 0; background: transparent; color: var(--ink);
}
.back-icon svg { display: block; width: 100%; height: 100%; fill: currentColor; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255, 255, 255, .06); }
.seg button {
  border: 0; border-radius: 9px; background: transparent; padding: 10px 6px;
  font-size: 18px; font-weight: 600;
}
.seg button.on { background: var(--ink); color: var(--table); }
/* Five table sizes: each button takes the width its label needs, so "Solo" isn't cut off. */
#segMode { grid-auto-columns: auto; }
/* Six since Archenemy (v1.25): a flex row that wraps rather than cutting labels off. */
#segMode { display: flex; flex-wrap: wrap; }
#segMode button { flex: 1 1 auto; }
#segMode button { padding-inline: 4px; }
/* v1.61: four 1v1 layouts since iPad joined, and the long "The speaker phone": wrap rather than cut. */
#segLayout, #segMine { display: flex; flex-wrap: wrap; }
#segLayout button, #segMine button { flex: 1 1 auto; padding-inline: 8px; }
.action {
  border: 0; border-radius: 12px; padding: 14px; font-size: 19px; font-weight: 600;
  background: rgba(255, 255, 255, .1);
}
.action.primary { background: var(--ink); color: var(--table); }
.action.armed, .seg button.armed { background: var(--hot); color: var(--table); }
.action.mini { align-self: center; padding: 6px 18px; border-radius: 999px; font-size: 15px; }
.ghost { border: 1px solid var(--line); border-radius: 12px; background: transparent; padding: 12px; font-size: 17px; color: var(--ink); }
/* Back to game is as white as New game, so the way out is easy to find. */
#closeMenu { background: var(--ink); border-color: var(--ink); color: var(--table); }
/* Players: the ring picks whose phone this is, the field renames them. */
.who { display: grid; gap: 8px; }
.who-row { display: flex; align-items: center; gap: 10px; }
.who-row > span { font-size: 17px; font-weight: 600; }
.name-note { margin: 2px 0 0; font-size: 15px; color: var(--hot); }
.speaker-note { margin: 4px 0 0; font-size: 14px; line-height: 1.35; opacity: .8; }
.pick {
  flex: none; width: 40px; height: 40px; padding: 0; border-radius: 50%;
  border: 2px solid var(--line); background: transparent;
}
.pick.on { border-color: var(--ink); background: radial-gradient(circle, var(--ink) 0 34%, transparent 37%); }
.seg button { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who input {
  width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ink);
  font: 600 17px var(--f-ui); -webkit-user-select: text; user-select: text;
}
.who input:focus-visible { outline: 3px solid var(--hot); outline-offset: 0; }
.results { display: flex; flex-direction: column; gap: 8px; }
.res-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .06); }
.res-head { display: flex; align-items: baseline; gap: 8px; font-size: 16px; }
.res-head b { font-weight: 600; }
.res-head span { flex: 1; min-width: 0; color: var(--ink-2); font-size: 14px; }
.res-players { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--ink-2); }
.res-players span { display: flex; align-items: center; gap: .35em; }
.res-players .won { color: var(--ink); font-weight: 600; }
.res-del { flex: none; border: 1px solid var(--line); border-radius: 999px; background: transparent; padding: 3px 12px; font-size: 14px; color: var(--ink-2); }
.res-del.armed { background: var(--hot); border-color: var(--hot); color: var(--table); }
.res-note { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.35; }
/* v1.61, the user's ask: on an iPad (a big screen both ways) the menu and its buttons are a third
   bigger. Each item is zoomed, not the panel. */
@media (min-width: 700px) and (min-height: 700px) {
  .menu .panel { width: min(100%, 480px); gap: 22px; padding: 28px 26px; }
  .sch-sheet .panel { width: min(100%, 640px); }
  .menu .panel > * { zoom: 1.33; }
}
.ver { margin: -12px 0 0; text-align: center; font-size: 12px; letter-spacing: .14em; color: var(--ink-2); opacity: .7; }

/* Archenemy (v1.25). The archenemy's name is gold with a crown. */
.seat.arch .name > .nm { color: var(--turn); }
.seat.arch .name svg { width: 1.15em; height: auto; margin-right: .3em; vertical-align: -.05em; fill: var(--turn); stroke: #000; stroke-width: 1.6; paint-order: stroke fill; overflow: visible; }
/* The scheme button, in the archenemy's bottom-left corner (as they see it), level with the dagger.
   It names the scheme in motion, gold while one is. */
.sch-btn {
  position: absolute; bottom: calc(6 * var(--cqh, 1vh)); left: calc(5 * var(--cqw, 1vw)); z-index: 2;
  display: flex; align-items: center; gap: .3em; height: 2.4em; max-width: calc(52 * var(--cqw, 1vw)); padding: 0 .7em 0 .3em;
  font-size: clamp(12px, min(calc(8.5 * var(--cqh, 1vh)), calc(4.3 * var(--cqw, 1vw))), 19px);
  font-weight: 600; letter-spacing: .03em; white-space: nowrap;
  border: 1px solid var(--line); border-radius: 999px; background: rgba(0, 0, 0, .45); color: var(--ink);
  touch-action: manipulation;
}
.sch-btn svg { width: 1.7em; height: 1.7em; flex: none; }
.sch-btn span { overflow: hidden; text-overflow: ellipsis; }
.sch-btn.live { background: var(--turn); border-color: #000; color: #1a1208; }
.sch-btn.live svg rect:last-of-type { stroke: #1a1208; }
.upright .s1 .sch-btn, .upright .s3 .sch-btn { max-width: calc(46 * var(--cqw, 1vw)); }
.seat.marking .sch-btn { display: none; }
/* The spotlight's small seats have no room for the scheme's name: just the card, gold while one is in motion. */
.spot .seat:not(.sp-main) .sch-btn { padding-right: .3em; }
.spot .seat:not(.sp-main) .sch-btn span { display: none; }
.sch-btn.live circle { fill: var(--turn); }

/* The scheme sheet: like the menu, a little wider for the card text. */
.sch-sheet .panel { width: min(100%, 480px); gap: 14px; }
.sch-body { display: flex; flex-direction: column; gap: 14px; }
.sch-body > * { flex: none; }
.sch-stat { margin: -6px 0 0; font-size: 15px; color: var(--ink-2); }
.sch-stat b { color: var(--turn); font-weight: 600; }
.sch-card {
  display: flex; flex-direction: column; gap: 10px; padding: 16px;
  border: 2px solid var(--turn); border-radius: 14px;
  background: linear-gradient(160deg, rgba(255, 179, 71, .14), rgba(0, 0, 0, .2));
}
.sch-type { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--turn); }
.sch-nm { font-family: var(--f-name); font-size: 30px; line-height: 1.05; text-wrap: balance; }
.sch-text { font-size: 18px; line-height: 1.4; -webkit-user-select: text; user-select: text; }
.sch-text p { margin: 0 0 .5em; }
.sch-text p:last-child { margin-bottom: 0; }
.sch-text i { color: var(--ink-2); }
.sch-text.small { font-size: 15px; }
.sym {
  display: inline-block; min-width: 1.5em; padding: 0 .3em; border-radius: 999px; text-align: center;
  background: rgba(255, 255, 255, .12); border: 1px solid var(--line); font-size: .8em; font-weight: 600; line-height: 1.45;
}
.reveal { animation: reveal .5s ease-out; }
@keyframes reveal { from { transform: translateY(10px) scale(.96); opacity: .2; } to { transform: none; opacity: 1; } }
.sch-motion {
  border: 3px solid #000; border-radius: 16px; padding: 22px 12px; width: 100%; color: #1a1208;
  background: radial-gradient(circle at 35% 30%, #ffe2a3, var(--turn) 58%, #b06a14);
  box-shadow: 0 0 22px rgba(255, 179, 71, .45);
  font-family: var(--f-name); font-size: 32px; letter-spacing: .04em; text-transform: uppercase;
}
.sch-note { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ink-2); text-align: center; text-wrap: pretty; }
.action.gold { background: var(--turn); color: #1a1208; }
.action:disabled, .ghost:disabled { opacity: .4; cursor: not-allowed; }
.ghost.armed { background: var(--hot); border-color: var(--hot); color: var(--table); }
.sch-og { display: flex; flex-direction: column; gap: 8px; }
.sch-og > span { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.og { display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 10px 12px; border-left: 3px solid var(--turn); border-radius: 8px; background: rgba(255, 255, 255, .05); }
.og-head { display: flex; align-items: center; gap: 10px; }
.og-head b { flex: 1; min-width: 0; font-family: var(--f-name); font-size: 20px; font-weight: 400; line-height: 1.1; }
.og button { flex: none; border: 1px solid var(--line); border-radius: 10px; background: transparent; padding: 8px 12px; font-size: 16px; font-weight: 600; }
.sch-foot { display: flex; gap: 8px; }
.sch-foot .ghost { flex: 1; }
.sch-log ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); border-radius: 999px; background: transparent; padding: 8px 14px; font-size: 16px; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--table); border-color: var(--ink); }
.chips button span { opacity: .6; margin-left: .3em; font-variant-numeric: tabular-nums; }
.set-group { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.set-group > h3 { margin: 0; padding: 10px 12px; display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; letter-spacing: .06em; background: rgba(255, 255, 255, .05); }
.set-group > h3 span { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sch-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); min-height: 46px; font-size: 17px; cursor: pointer; }
.sch-row input { width: 20px; height: 20px; flex: none; accent-color: var(--turn); }
.sch-row.on { background: rgba(255, 179, 71, .1); }
.sch-row em { margin-left: .5em; font-style: normal; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--turn); }
.search {
  width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ink);
  font: 600 17px var(--f-ui); -webkit-user-select: text; user-select: text;
}
.search:focus-visible { outline: 3px solid var(--hot); outline-offset: 0; }
/* The builder's count and Start stay in reach at the bottom of the sheet while the list scrolls. */
.sch-build-foot {
  position: sticky; bottom: -22px; margin: 0 -20px -22px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; background: var(--panel); border-top: 1px solid var(--line);
}
.sch-build-foot p { flex: 1; margin: 0; font-size: 17px; font-weight: 600; }
.sch-build-foot .action, .sch-build-foot .ghost { flex: none; }

@media (prefers-reduced-motion: reduce) {
  .seat, .zone, .delta { transition: none; }
  .seat.cheer::after, .seat.cheer .life, .badge.win-badge, .reveal { animation: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<!-- After New game (v1.48): one tap picks who goes first. Only on the phone that started the game,
     since each phone's pick is its own random draw. -->
<div class="first-ask" id="firstAsk" hidden>
  <button type="button" class="first-go" id="firstAskGo">Pick who goes first</button>
  <button type="button" class="first-x" id="firstAskX" aria-label="Not now"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div class="menu" id="menu" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="menu-head">
      <h2 id="menuTitle">Commander</h2>
      <!-- A second way back, at the top, so nobody has to scroll to the foot of the menu.
           Magic's untap symbol, from the Mana font's SVGs (github.com/andrewgioia/mana; symbol (c) Wizards). -->
      <button type="button" class="back-icon" id="closeMenuTop" aria-label="Back to game"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15.773 4.737v12.874l3.355-4.714c1.39 1.751 2.084 3.778 2.084 6.073 0 1.148-0.219 1.936-0.657 2.356-0.439 0.423-1.232 0.635-2.379 0.635-3.173 0-6.558-1.632-10.153-4.895l-3.762 3.715c5.258 4.323 9.956 6.482 14.097 6.482 2.477 0 4.451-0.746 5.916-2.242 1.465-1.495 2.198-3.485 2.198-5.96 0-3.022-1.15-6.316-3.445-9.883l4.713-2.763-11.967-1.678z"/></svg></button>
    </div>
    <div class="field">
      <span>Players</span>
      <div class="seg" id="segMode">
        <button type="button" id="mode1" data-v="1">1</button>
        <button type="button" id="mode2" data-v="2">2</button>
        <button type="button" id="mode3" data-v="3">3</button>
        <button type="button" id="mode4" data-v="4">4</button>
        <button type="button" id="mode5" data-v="5">1v1 ×2</button>
        <button type="button" id="mode6" data-v="6" aria-label="Archenemy">AE</button>
      </div>
    </div>
    <div class="field" id="aeField">
      <span>AE</span>
      <div class="seg" id="segAe">
        <button type="button" data-v="0"></button>
        <button type="button" data-v="1"></button>
        <button type="button" data-v="2"></button>
        <button type="button" data-v="3"></button>
      </div>
    </div>
    <div class="field" id="schemesField">
      <span>Schemes</span>
      <div class="seg" id="segSchemes">
        <button type="button" data-v="app">App's deck</button>
        <button type="button" data-v="cards">Our cards</button>
      </div>
      <p class="speaker-note" id="schemesNote"></p>
    </div>
    <div class="field" id="pairsField">
      <span id="pairsLabel">Rand plays</span>
      <div class="seg" id="segPairs">
        <button type="button" data-v="1"></button>
        <button type="button" data-v="2"></button>
        <button type="button" data-v="3"></button>
      </div>
    </div>
    <div class="field" id="sitoutField">
      <span>Sitting out</span>
      <div class="seg" id="segSitout">
        <button type="button" data-v="0"></button>
        <button type="button" data-v="1"></button>
        <button type="button" data-v="2"></button>
        <button type="button" data-v="3"></button>
      </div>
    </div>
    <!-- v1.53 order (the user's ask): Players, Layout, Starting life with New game and Pick who goes
         first, then the rest. Concede is gone. -->
    <div class="field" id="layout4Field">
      <span>Layout</span>
      <div class="seg" id="segLayout4">
        <button type="button" data-v="spot">Spotlight</button>
        <button type="button" data-v="table">Table</button>
        <button type="button" data-v="quad">Quadrants</button>
        <button type="button" data-v="ipad">iPad</button>
      </div>
    </div>
    <div class="field" id="layoutField">
      <span>1v1 layout</span>
      <div class="seg" id="segLayout">
        <button type="button" data-v="split">Side by side</button>
        <button type="button" data-v="classic">Classic</button>
        <button type="button" data-v="couch">Couch</button>
        <button type="button" data-v="ipad">iPad</button>
      </div>
    </div>
    <div class="field" id="startField">
      <span>Starting life</span>
      <div class="seg" id="segStart">
        <button type="button" id="start20" data-v="20">20</button>
        <button type="button" id="start30" data-v="30">30</button>
        <button type="button" id="start40" data-v="40">40</button>
      </div>
    </div>
    <button type="button" class="action primary" id="newGame">New game</button>
    <button type="button" class="action" id="pickFirst">Pick who goes first</button>
    <div class="field" id="sfyField">
      <span>Spotify remote</span>
      <div class="seg" id="segSpotify">
        <button type="button" data-v="on">On</button>
        <button type="button" data-v="off">Off</button>
      </div>
      <div class="who" id="sfyIdRow"><input id="sfyId" maxlength="64" autocomplete="off" spellcheck="false" aria-label="Spotify client ID" placeholder="Spotify client ID"></div>
      <button type="button" class="action" id="sfyConnect">Connect Spotify</button>
      <p class="speaker-note" id="sfyNote"></p>
    </div>
    <!-- Sound and Speaker fold away (v1.32): set once, rarely touched. The summary shows the setting. -->
    <details class="field" id="soundField">
      <summary>Sound<span class="sum-v" id="soundNow"></span></summary>
      <div class="seg" id="segSound">
        <button type="button" data-v="all">All</button>
        <button type="button" data-v="turn">Turn only</button>
        <button type="button" data-v="off">Off</button>
      </div>
    </details>
    <details class="field" id="speakerField">
      <summary>Speaker<span class="sum-v" id="speakerNow"></span></summary>
      <div class="seg" id="segSpeaker">
        <button type="button" data-v="each">Each phone</button>

    return isArch(k) && players[i].e !== state.ae ? opps.filter(o => o.color === state.ae) : opps;
  }
  const isAe = i => isArch(players[i].k) && players[i].e === state.ae;

  // Side by side, this phone's player takes the left column and the opponent the right: in the top
  // half, turned to face the opponent, that puts the opponent on their own left too.
  const duelSpots = i => i === mySeat() ? ['d-bl', 'd-tl'] : ['d-tr', 'd-br'];
  const quadSpot = i => {
    const p = players[i];
    return p.k === duelOf(state.me) ? (p.e === state.me ? 'd-bl' : 'd-br') : (p.j ? 'd-tl' : 'd-tr');
  };

  // The layout a three- or four-seat board uses here. Quadrants needs four seats; the spotlight needs
  // one turn order and a player to face, so a Center phone and the two 1v1s use the table instead.
  function layoutOf(n) {
    if (n < 3) return null;

    let lay = state.layout4;

  // Turns aren't tracked since v1.3, so the spotlight is this phone's player.
  const spotPlayer = () => mySeat();
  function build() {
    players = viewPlayers();
    const n = players.length;
    // Couch: one upright seat each, Rand (edge 0) on the left; in the two 1v1s only this phone's own 1v1 shows, this phone's player on the left, with no strip on top.
    // The iPad view (v1.61) at two players is Classic's button box with a much bigger button.
    const ipad2 = n === 2 && state.ipad;
    const couch = n === 2 && state.layout2 === 'couch' && !ipad2;

    const duel4 = sideBySide4();
    app.innerHTML = '';
    app.classList.toggle('has-mini', state.mode === SPLIT && state.me !== CENTER && !duel4 && !couch);
    if (app.classList.contains('has-mini')) {

      app.appendChild(mini);
    }
    const board = document.createElement('div');
    // 4-player Table with Spotify on is drawn as Big button, with the dock in the bottom seat (v1.37).
    const dock = sfy.on && n === 4 && ['table', 'hub'].includes(layoutOf(n));
    // At 3 players the iPad view with the Spotify bar is Table with the bar in the middle.
    const lay = dock ? 'hub' : sfy.on && n === 3 && layoutOf(n) === 'hub' ? 'table' : layoutOf(n);
    // Side by side with the Spotify bar keeps only the upright half (v1.36).
    const half = duel && sfy.on;
    board.className = couch ? 'board duel couch' : half ? 'board duel half' : duel || duel4 ? 'board duel'
      : 'board n' + n + (n > 1 ? ' table' : '') + (n > 1 && state.me !== CENTER ? ' upright' : '') + (lay === 'quad' ? ' quad' : '') + (lay === 'hub' ? ' hub' : '') + (lay === 'spot' ? ' spot' : '');
    // The Spotify remote, in every layout (v1.35): the grid gives it the top or the middle (see the styles).
    if (sfy.on && !dock) { board.classList.add('sfy'); board.appendChild(sfyBar()); }
    if (dock) board.classList.add('sfyp');
    // Classic and Side by side (not Couch) without the bar: the button box in the middle (v1.44).
    if (!sfy.on && !couch && (n === 2 || duel4)) {
      board.classList.add('boxed');
      if (ipad2) board.classList.add('ipad');
      const box = document.createElement('div');
      box.className = 'btn-box';
      board.appendChild(box);
    }
    // In the spotlight, this phone's player and then everyone after them, clockwise.
    builtSpot = lay === 'spot' ? spotPlayer() : null;
    const place = i => lay !== 'spot' ? 's' + posOf(i) : (builtSpot - i + n) % n ? 'sp-' + (builtSpot - i + n) % n : 'sp-main';
    seats = [];
    for (let i = 0; i < n; i++) {
      // No concede flag on the seats (v1.34, the user's pick): the menu's Concede does it.
      seats[i] = (couch ? [(state.mode === SPLIT ? i === mySeat() : edgeOf(i) === 0) ? 'd-cl' : 'd-cr'] : duel4 ? [quadSpot(i)] : half ? duelSpots(i).filter(s => s[2] === 'b') : duel ? duelSpots(i) : [place(i)]).map(spot => makeSeat(i, spot));
      seats[i].forEach(seat => board.appendChild(seat));
      deltas[i] = { sum: 0, t: null };
    }
    if (dock) { const bar = sfyBar(); bar.className = 'sfy-dock'; board.querySelector('.seat.s0').appendChild(bar); }
    app.appendChild(board);
    const mb = document.createElement('button');
    mb.type = 'button';
    mb.className = 'menu-btn';
    mb.setAttribute('aria-label', 'Menu');
    mb.innerHTML = ICON_MENU;
    mb.addEventListener('click', openMenu);
    // With the Spotify bar, the menu button sits in one of its corners.
    (board.querySelector(':scope > .sfy-bar') || app).appendChild(mb);
    const tb = document.createElement('button');
    tb.type = 'button';
    tb.className = 'turn-big';
    tb.setAttribute('aria-label', 'End turn');
    tb.innerHTML = ICON_TAP;
    tb.addEventListener('click', () => {
      tb.classList.remove('boing'); void tb.offsetWidth; tb.classList.add('boing');

    });
    app.appendChild(tb);
    seats.forEach((_, i) => update(i));
    paintMini();
    measure();
  }

  function makeSeat(i, spot) {
    const seat = document.createElement('section');
    const e = edgeOf(i);
    seat.className = `seat ${spot} k-${bgOf(e)}`;
    seat.style.setProperty('--art', `url(${artUrl(bgOf(e), 'art_crop')})`);
    seat.dataset.art = bgOf(e);
    // No commander damage in a 1v1 (v1.34, the user's pick: 2, 1v1 ×2, any 1v1 layout), so no dagger.
    const opps = oppsOf(i), dagger = SIZE[players[i].k] > 2;
    seat.innerHTML = `
      <div class="face">
        <button type="button" class="zone minus" aria-label="${nameOf(e)} lose 1 life"></button>
        <button type="button" class="zone plus" aria-label="${nameOf(e)} gain 1 life"></button>
        <div class="readout">
          <div class="name"></div>
          <div class="life"><span class="num"></span><span class="delta"></span></div>
        </div>
        <div class="badge" hidden>Goes first</div>
        <div class="badge win-badge" hidden>${ICON_CROWN}<span>Winner</span></div>
        ${dagger ? `<div class="tray">
          <div class="pop">
            ${opps.map(o => `<button type="button" class="chip k-${bgOf(o.color)}" data-slot="${o.slot}" aria-label="Mark commander damage from ${o.label}">${swatch(bgOf(o.color))}<span class="ct">${o.label}</span><b>0</b></button>`).join('')}
          </div>
          <button type="button" class="cmd-btn" aria-label="Commander damage" aria-expanded="false">${ICON_CMD}<b hidden></b></button>
        </div>` : ''}
        ${isAe(i) && state.schemes === 'app' ? `<button type="button" class="sch-btn" aria-label="Schemes">${ICON_SCHEME}<span></span></button>` : ''}
        ${SHOW_DECKS && state.mode > 1 ? `<div class="seat-mana" aria-hidden="true">${manaOf(colorOf(e).slice(2))}</div>` : ''}
      </div>`;
    bindZone(seat.querySelector('.minus'), i, -1);
    bindZone(seat.querySelector('.plus'), i, 1);
    seat.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {

    if (sb) sb.addEventListener('click', () => { buzz(); openSchemes(); });
    return seat;
  }

  // Size each seat and its face from the actual layout (see .face in the styles).
  function measure() {
    seats.flat().forEach(seat => {
      seat.style.setProperty('--sw', seat.clientWidth / 100 + 'px');
      seat.style.setProperty('--sh', seat.clientHeight / 100 + 'px');
      const face = seat.querySelector('.face');
      face.style.setProperty('--cqw', face.offsetWidth / 100 + 'px');
      face.style.setProperty('--cqh', face.offsetHeight / 100 + 'px');
    });

    fitNames();
    centerLife();
    placeTurn();
  }
  // Four seats around the edges (Table) have the side seats' totals in the middle of the phone, so
  // there the turn and menu buttons sit on the line above the bottom seat instead.
  // Big button: the turn button's center and radius, from the left seat's place on the board. Layout
  // offsets, not screen rects, so a pinned (turned) board measures the same.
  function hubGeom() {
    // With the Spotify bar in the middle, Big button is Table with the bar there (the turn button sits in it).
    const board = app.querySelector('.board.hub:not(.sfy)'), s1 = board && board.querySelector('.s1');
    if (!s1) return null;
    // 21% of the short side (v1.64 tried 25% at three seats; v1.65 went back, the user found it too big).
    const n3 = board.matches('.n3');
    const r = Math.round(Math.min(.21 * Math.min(innerWidth, innerHeight), .4 * s1.offsetHeight));
    let y = s1.offsetTop + s1.offsetHeight / 2;
    // Three seats (v1.63, the user: "off center"): the middle of the screen, not of the side seats,
    // as long as the button stays clear of the bottom seat.
    const s0 = n3 && board.querySelector('.s0');
    if (s0) y = Math.max(y, Math.min(board.offsetTop + board.offsetHeight / 2, s0.offsetTop - r - 14));
    return { x: board.offsetLeft + board.offsetWidth / 2, y, r };
  }
  // Big button: each side seat's total centers in the part of the seat the button leaves free. On a
  // player's phone that's the outer side of the seat; on a Center phone the side seats' tops face
  // the button, and their names sit at the bottom (see the styles).
  function hubLife() {
    seats.flat().forEach(seat => {
      const free = hubFree(seat);
      if (!free) return;
      const readout = seat.querySelector('.readout');
      readout.style.padding = '';
      Object.entries(free.pad).forEach(([side, px]) => { readout.style['padding' + side] = px + 'px'; });
    });
  }
  // The room a Big button side seat has for its total, in its face's own (unturned) layout: the
  // button's reach is cut off the side toward the middle (its top, on a Center phone, where the
  // name moves to the bottom). Null for any other seat.
  function hubFree(seat) {
    const hub = hubGeom();
    const side = !hub ? null : seat.classList.contains('s1') ? 'Right' : seat.classList.contains('s3') ? 'Left' : null;
    if (!side) return null;
    const face = seat.querySelector('.face'), name = seat.querySelector('.name');
    const cut = hub.r + 8 - 3; // half the 6px gap between the seats is free
    const nm = .07 * face.offsetHeight + name.offsetHeight + 6;
    const upright = !!app.querySelector('.board.upright');
    const beside = upright ? { pad: { [side]: cut }, w: face.offsetWidth - cut - 12, h: face.offsetHeight - 2 * nm }
      : { pad: { Top: cut, Bottom: nm }, w: .9 * face.offsetWidth, h: face.offsetHeight - cut - nm };
    // Three seats (v1.64): the button sits low in the side seats, so the part above it may hold a
    // bigger total than the strip beside it; whichever fits the bigger total wins. On a Center
    // phone the screen's bottom is the left seat's right side (its top faces the middle) and the
    // right seat's left side.
    if (!seat.closest('.n3')) return beside;
    const below = Math.max(0, seat.offsetTop + seat.offsetHeight - (hub.y - hub.r - 8));
    const above = upright ? { pad: { Top: nm, Bottom: below }, w: face.offsetWidth - 12, h: face.offsetHeight - below - nm }
      : { pad: { [side === 'Right' ? 'Right' : 'Left']: below, Bottom: nm }, w: face.offsetWidth - below - 12, h: face.offsetHeight - 2 * nm };
    const size = f => Math.min(f.w / 1.32, f.h);
    return size(above) > size(beside) ? above : beside;
  }
  function placeTurn() {
    const board = app.querySelector('.board'), btns = app.querySelectorAll('.turn-big, .menu-btn');
    btns.forEach(b => { b.style.top = b.style.left = b.style.width = b.style.height = b.style.margin = ''; });
    // Big button: the turn button sits where the side seats meet, the menu button on its rim.
    const hub = hubGeom();
    if (hub) {
      const tb = app.querySelector('.turn-big'), mb = app.querySelector('.menu-btn'), off = .72 * hub.r;
      Object.assign(tb.style, { left: hub.x + 'px', top: hub.y + 'px', width: 2 * hub.r + 'px', height: 2 * hub.r + 'px' });
      Object.assign(mb.style, { left: hub.x + off - 23 + 'px', top: hub.y + off - 23 + 'px' });
      // Three seats (v1.64, the user's ask): the menu button at the top middle, on the side seats' seam.
      const board = app.querySelector('.board');
      if (board.matches('.n3')) Object.assign(mb.style, { left: hub.x - mb.offsetWidth / 2 + 'px', top: board.offsetTop + 10 + 'px' });
      menuAtTop(mb);
      return;
    }
    // The button box (v1.44): the turn button as big as fits in its middle, the menu button in the
    // box's bottom-right corner (v1.45, the user's ask).
    const box = board && board.querySelector(':scope > .btn-box');
    if (box) {
      const tb = app.querySelector('.turn-big'), mb = app.querySelector('.menu-btn');
      const x0 = (box.offsetParent === board ? board.offsetLeft : 0) + box.offsetLeft;
      const y0 = (box.offsetParent === board ? board.offsetTop : 0) + box.offsetTop;
      const w = box.offsetWidth, h = box.offsetHeight, cx = x0 + w / 2, cy = y0 + h / 2;
      const big = board.classList.contains('ipad');
      const d = big ? Math.max(96, Math.min(.86 * h, .6 * w)) : Math.max(96, Math.min(200, .76 * h, .48 * w));
      const m = Math.max(46, Math.min(big ? 72 : 64, .3 * h));
      Object.assign(tb.style, { left: cx + 'px', top: cy + 'px', width: d + 'px', height: d + 'px', margin: '0' });
      // The menu button's styles lift it by half its height (translateY(-50%)), so top is its middle.
      Object.assign(mb.style, { left: x0 + w - 10 - m + 'px', top: y0 + h - 10 - m / 2 + 'px', width: m + 'px', height: m + 'px', margin: '0' });
      return;
    }
    // Spotify bar in the middle: the turn button sits in its hole, as big as fits (up to 200px), and
    // the menu button on its spot after play and next (v1.46).
    const hole = app.querySelector('.table:not(.spot) > .sfy-bar .sfy-hole');
    if (hole) {
      const bar = hole.closest('.sfy-bar'), tb = app.querySelector('.turn-big');
      const d = Math.max(56, Math.min(200, hole.offsetWidth - 8, hole.offsetHeight - 8));
      Object.assign(tb.style, { left: bar.offsetLeft + hole.offsetLeft + hole.offsetWidth / 2 + 'px', top: bar.offsetTop + hole.offsetTop + hole.offsetHeight / 2 + 'px', width: d + 'px', height: d + 'px', margin: '0' });
      const spot = bar.querySelector('.sfy-mspot'), mb = bar.querySelector('.menu-btn');
      if (spot && mb) Object.assign(mb.style, { left: spot.offsetLeft + 'px', top: spot.offsetTop - spot.parentNode.scrollTop + 'px' });
      sfyFit();
      return;
    }
    // Spotify bar on top: Side by side's halves and the spotlight's rows meet below the middle, so
    // the turn button follows the seam.
    const s0 = board && (board.matches('.n4.table:not(.quad):not(.spot)') ? board.querySelector('.s0')
      : board.matches('.duel.sfy:not(.couch):not(.half)') ? board.querySelector('.d-bl') : board.matches('.spot.sfy') ? board.querySelector('.sp-main') : null);
    const y = s0 ? (s0.offsetParent === board ? board.offsetTop : 0) + s0.offsetTop - 3 : 0;
    // The menu button in the Spotify bar keeps its corner.
    btns.forEach(b => { if (!b.closest('.sfy-bar')) b.style.top = s0 ? y + 'px' : ''; });
    const mb = app.querySelector('.menu-btn');
    if (mb && !mb.closest('.sfy-bar')) menuAtTop(mb);
  }
  // v1.57 (the user's ask): on a 4-player Table board (also Big button and the Spotify dock, on a
  // player's phone or a Center phone) the menu button sits where three seats' corners meet: the
  // top seat's bottom edge and the two side seats' top corners. It replaces v1.52's spot on the
  // bottom seam and the turn button's rim. Measured from the seats' boxes, so it holds on any
  // screen; the button's styles may lift it by half its height (translateY(-50%)).
  function menuAtTop(mb) {
    const board = app.querySelector('.board');
    if (!board || !board.matches('.n4.table:not(.quad):not(.spot)')) return false;
    const t = board.querySelector('.seat.s2'), l = board.querySelector('.seat.s1'), r = board.querySelector('.seat.s3');
    if (!t || !l || !r) return false;
    const P = (mb.offsetParent || document.body).getBoundingClientRect();
    const T = t.getBoundingClientRect(), L = l.getBoundingClientRect(), R = r.getBoundingClientRect();
    const x = (Math.min(L.right, R.right) + Math.max(L.left, R.left)) / 2 - P.left;
    const y = (T.bottom + Math.min(L.top, R.top)) / 2 - P.top;
    const half = getComputedStyle(mb).transform === 'none' ? mb.offsetHeight / 2 : 0;
    Object.assign(mb.style, { left: x - mb.offsetWidth / 2 + 'px', top: y - half + 'px', margin: '0' });
    return true;
  }
  // Each total sits centered in the open space between its seat's name and its turn symbol (v3.33),
  // measured in the face's own unturned layout, so a turned seat centers the same way. This replaces
  // the readout's lift from the styles. "Solo" has no turn symbol, so its space ends as far from
  // the bottom as the name starts from the top.
  const DOCK_H = 78; // the Spotify dock and its gap, kept clear of the bottom seat's total
  // v1.49: each background is cropped round its character's face (the user's ask), whatever shape
  // the seat is on this device: the face point goes as near the seat's middle as the crop allows.
  // Every art_crop is 626 × 457. Face points by eye, as fractions of the picture (x, y).
  const ART_W = 626, ART_H = 457;
  const FACES = {
    uw: [.6, .2], bu: [.5, .13], rb: [.5, .38], gr: [.63, .25], gw: [.4, .24], le: [.46, .35], le2: [.42, .2],
    em: [.52, .2], em2: [.33, .17], rt: [.72, .25], rt2: [.38, .2], bq: [.5, .22], lo: [.53, .16], pi: [.48, .2],
    ja: [.6, .22], sp: [.57, .38], ki: [.46, .15], wo: [.47, .2], ko: [.53, .13],
  };
  function placeArt(seat) {
    const f = FACES[seat.dataset.art], face = seat.querySelector('.face');
    if (!f || !face) return;
    // Measured in the face's own unturned layout, so a turned seat crops the same way for its player.
    const w = face.offsetWidth, h = face.offsetHeight, k = Math.max(w / ART_W, h / ART_H);
    const fit = (box, size, at) => Math.min(0, Math.max(box - size, box / 2 - at * size));
    seat.style.setProperty('--artpos', `${fit(w, ART_W * k, f[0])}px ${fit(h, ART_H * k, f[1])}px`);
  }
  function centerLife() {
    seats.flat().forEach(seat => {
      placeArt(seat);
      const face = seat.querySelector('.face'), readout = seat.querySelector('.readout');
      const name = seat.querySelector('.name'), nm = name.querySelector('.nm');
      const top = name.offsetTop + (nm ? nm.offsetTop + nm.offsetHeight : name.offsetHeight);
      const bottom = face.offsetHeight - name.offsetTop;
      // Padding, not top and bottom: the name is positioned inside the readout, and padding leaves
      // it where it is.
      readout.style.paddingTop = top + 'px';
      readout.style.paddingBottom = Math.max(0, face.offsetHeight - bottom) + (seat.querySelector('.sfy-dock') ? DOCK_H : 0) + 'px';
    });
    hubLife();
  }
  // One size for every total: each seat's own largest size (from the styles) is read, and all of
  // them take the smallest.
  function fitLife() {
    const board = app.querySelector('.board');
    if (!board) return;
    board.classList.remove('fitted');
    // 10% over the smallest seat's size (v3.33); the seats' own sizes leave that much room. The
    // spotlight's seat is sized on its own, the rest together (sizeGroup).
    groupBy(Array.from(board.querySelectorAll('.seat'))).forEach(group => {
      // Big button side seats also cap it to the room the button leaves them (three digits at
      // 0.75 size are about 1.32em wide).
      const caps = group.map(hubFree).filter(Boolean).map(f => Math.min(f.w / 1.32, f.h));
      // The seat with the Spotify dock gives its bottom to the dock.
      group.filter(seat => seat.querySelector('.sfy-dock')).forEach(seat => {
        const name = seat.querySelector('.name');
        caps.push(.8 * (seat.querySelector('.face').offsetHeight - name.offsetTop - name.offsetHeight - DOCK_H));
      });
      const px = Math.min(1.1 * Math.min(...group.map(seat => parseFloat(getComputedStyle(seat.querySelector('.life')).fontSize))), ...caps);
      group.forEach(seat => seat.style.setProperty('--life', px + 'px'));
    });
    board.classList.add('fitted');
  }
  // Every name on the board is drawn at one size: the largest at which each name still fits its
  // seat, so the side seats' names match the top and bottom ones. An "out" line too wide for its
  // seat shrinks on its own (--wfit). Layout widths, so a turned seat measures the same as an
  // upright one.
  // Seats sized together: all of them, except that the spotlight's big seat is a group of its own.
  function groupBy(seatEls) {
    const groups = {};
    seatEls.forEach(seat => { const g = seat.classList.contains('sp-main') ? 'main' : 'rest'; (groups[g] = groups[g] || []).push(seat); });
    return Object.values(groups);
  }
  function fitNames() {
    // Only names already filled in: during build() the later seats have none yet.
    const names = Array.from(app.querySelectorAll('.name')).filter(el => el.querySelector('.nm'));
    if (!names.length) return;
    names.forEach(el => { el.style.setProperty('--fit', 1); el.style.setProperty('--wfit', 1); });
    const room = el => parseFloat(getComputedStyle(el).maxWidth);
    const sizes = names.map(el => {
      const base = parseFloat(getComputedStyle(el).fontSize);
      return { el, base, px: base * Math.min(1, room(el) / el.querySelector('.nm').offsetWidth * .98) };
    });
    // The spotlight's player moves into the bottom row when the turn passes, so the row's names also
    // leave room for theirs (its width scales with its size), and keep one size turn after turn.
    const main = sizes.find(x => x.el.closest('.sp-main'));
    groupBy(Array.from(new Set(names.map(el => el.closest('.seat'))))).forEach(group => {
      const mine = sizes.filter(x => group.includes(x.el.closest('.seat')));
      const extra = main && !mine.includes(main)
        ? [room(mine[0].el) * main.base / main.el.querySelector('.nm').offsetWidth * .98] : [];
      const px = Math.min(...mine.map(x => x.px), ...extra);
      mine.forEach(({ el, base }) => el.style.setProperty('--fit', (px / base).toFixed(3)));
    });
    names.forEach(el => {
      const why = el.querySelector('.why .nm');
      if (why && why.offsetWidth > room(el)) el.style.setProperty('--wfit', (room(el) / why.offsetWidth * .98).toFixed(3));
    });
  }

  if (document.fonts) document.fonts.ready.then(() => { fitNames(); centerLife(); });
  if ('ResizeObserver' in window) new ResizeObserver(measure).observe(app);
  else addEventListener('resize', () => setTimeout(measure, 50));

  function outReason(p) {
    if (p.conceded) return 'conceded';
    if (p.cmd.some(c => c >= CMD_LETHAL)) return CMD_LETHAL + ' commander';
    if (p.life <= 0) return 'no life';
    return '';
  }

    const p = playerOf(i);
    const why = outReason(p);
    const label = state.mode === 1 ? 'Life' : (isAe(i) ? ICON_CROWN : '') + nameOf(edgeOf(i));
    let refit = false;
    seats[i].forEach(seat => {
      seat.querySelector('.num').textContent = p.life;

      if (name.innerHTML !== html) { name.innerHTML = html; refit = true; }

  // ---- changes ----

  // Each game (k) has its own clock, so the two 1v1s start, end and are logged on their own.
  function touch(k) {
    if (!untouched(k) || (state.turns[k] != null && state.meta[k].id)) return;

  // ---- the winner's party (v1.24) ----

  function paintWins() {

      const left = won ? w.at + CHEER_MS - Date.now() : 0;

    const i = all[0];

    // Archenemy's heroes win together: a burst from each of their seats.

    });

  // Confetti: one canvas over everything but the menu, drawn only while pieces are falling.

      bump[at + 'cmd/' + slot] = inc(p.cmd[slot] - was);
    }

    showDelta(i, d); update(i); save(); buzz();

  // v1.3 dropped the turn tracker for the turn button (see build()). Phones from before still sync

  // Tap = ±1, hold = ±10 then repeats.
  function bindZone(btn, i, sign) {

  // ---- Spotify remote (v1.31) ----
