<style>
/* Layout: summary, speaker chips and search, then one section per speaker: each line with its words, occasion and source. Same tokens as the clip list. */
:root{--bg:#f1efe9;--surface:#e4e1d8;--fg:#1d1b17;--muted:#6a665c;--accent:#9a5a00;--line:#cfcabd;--pres:#2c5c8a;
--f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;--pres:#7fb2e5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;--pres:#7fb2e5;color-scheme:dark}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-display);padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.4rem;margin:0 0 4px;text-wrap:balance}
.sub{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin:0 0 14px;max-width:65ch;line-height:1.5}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.bar button{font:inherit;font-size:.78rem;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.bar button:focus-visible,#q:focus-visible,.play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar .ct{font-family:var(--f-mono);font-size:.7rem;opacity:.75;margin-left:3px}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#q{flex:1 1 180px;min-width:0;font:inherit;font-size:.85rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
#count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin:0 0 6px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-size:.8rem;display:grid;place-items:center}
.play.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.noplay .play{display:none}.noplay li{grid-template-columns:minmax(0,1fr) auto}
.nm{font-weight:500;font-size:.92rem;overflow-wrap:anywhere}
.nm .pool{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-weight:400;margin-left:6px}
.q{display:block;font-size:.82rem;color:var(--pres);margin-top:2px;line-height:1.35}
.src{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.src a{color:inherit}
/* Random president: one big button, then the quote it played. */
.rnd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 16px}
#rnd{font:inherit;font-weight:700;font-size:1rem;color:var(--bg);background:var(--pres);border:0;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer}
#rnd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#rnd.on{background:var(--accent)}
#now{flex:1 1 200px;min-width:0;font-size:.85rem;color:var(--pres);line-height:1.35}
#now .src{color:var(--muted)}
.noplay .rnd{display:none}
.len{font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}

h2{font-size:1rem;margin:22px 0 6px;display:flex;gap:8px;align-items:baseline}
h2 .ct{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-weight:400}
.words{font-size:.95rem;line-height:1.35;color:var(--fg)}
.occ{display:block;font-size:.8rem;color:var(--pres);margin-top:3px;line-height:1.35}
.occ.none{color:var(--muted);font-style:italic}
.nav{font-family:var(--f-mono);font-size:.78rem;margin:0 0 12px}.nav a{color:var(--accent)}
</style></head><body>

:"long/trump-three-vaccines","d":5.6,"quote":"I came up with three vaccines, all very, very good.","who":"Donald Trump","src":"myinstants: Trump: 3 vax","url":"https://www.myinstants.com/media/sounds/trump-3-vax.mp3","grp":"Presidents"},{"f":"long/trump-tired-of-winning","d":10.5,"quote":"We're going to win so much, you may even get tired of winning. And you'll say, please, please, it's too much winning. We can't take it anymore.","who":"Donald Trump","from":"2016 campaign rallies","src":"myinstants: Trump Win Too Much","url":"https://www.myinstants.com/media/sounds/trump-win-too-much.mp3","grp":"Presidents"},{"f":"long/trump-turn-black","d":7.4,"quote":"She was always of Indian heritage... I didn't know she was black until a number of years ago, when she happened to turn black.","who":"Donald Trump","from":"National Association of Black Journalists convention, Chicago, July 31, 2024","src":"YouTube: \"donald trump being donald trump for 4 minutes and 5 seconds\" (Wurley)","url":"https://youtu.be/Hn9r6xNawoE","grp":"Presidents"},{"f":"long/trump-turn-off-the-lights","d":9.8,"quote":"Turn them off, they're too bright. Turn off the lights, turn off the lights.","who":"Donald Trump","src":"YouTube: \"donald trump being donald trump for 4 minutes and 5 seconds\" (Wurley)","url":"https://youtu.be/Hn9r6xNawoE","grp":"Presidents"},{"f":"long/trump-very-large-brain","d":8.5,"quote":"China has total respect for Donald Trump's very, very large brain.","who":"Donald Trump","src":"YouTube: \"donald trump being donald trump for 4 minutes and 5 seconds\" (Wurley)","url":"https://youtu.be/Hn9r6xNawoE","grp":"Presidents"},{"f":"long/trump-we-love-puerto-rico","d":8.8,"quote":"We love Puerto Rico. Puerto Rico. Ah! Ah!","who":"Donald Trump","src":"YouTube: \"donald trump being donald trump for 4 minutes and 5 seconds\" (Wurley)","url":"https://youtu.be/Hn9r6xNawoE","grp":"Presidents"},{"f":"long/trump-who-built-the-cages","d":9.8,"quote":"Who built the cages? I'd love you to ask that const $=id=>document.getElementById(id);
const canPlay=!location.hostname||/github\.io$|localhost|127\.0\.0\.1/.test(location.hostname);
if(!canPlay)document.body.classList.add('noplay');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Speakers in order of how many lines they have; the four NASA voices, the game voices and the announcer each stay one group. */
const grpOf=l=>l.grp==='Presidents'||l.f.replace(/^long\//,'').startsWith('jfk-')?l.who:l.grp==='NASA'?'NASA':l.grp==='Announcer'?'Announcer (text-to-speech)':'Game voice actors';
const groups=[...new Set(LINES.map(grpOf))].sort((a,b)=>LINES.filter(l=>grpOf(l)===b).length-LINES.filter(l=>grpOf(l)===a).length);
const F={who:'',q:''};
const known=LINES.filter(l=>l.from).length;
$('sum').textContent=`${LINES.length} lines with words in them, ${Math.round(LINES.reduce((a,l)=>a+l.d,0)/60)} minutes in all. Each shows who says it, the original occasion where it's well documented (${known} of them; the rest came as meme cuts or compilations with no occasion given), and where the clip came from.`+(canPlay?' Tap ▶ to hear one.':'');
$('who').innerHTML=[['','Everyone']].concat(groups.map(g=>[g,g])).map(([v,l])=>`<button type="button" data-v="${esc(v)}" aria-pressed="${F.who===v}">${esc(l)}<span class="ct">${LINES.filter(x=>!v||grpOf(x)===v).length}</span></button>`).join('');
$('who').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.who=b.dataset.v;$('who').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
$('q').oninput=e=>{F.q=e.target.value.toLowerCase();draw()};
function row(l){
 const who=grpOf(l)===l.who?'':esc(l.who)+' · ';
 return `<li><button class="play" type="button" data-f="${esc(l.f)}" aria-label="Play">▶</button><div><span class="words">“${esc(l.quote)}”</span>`+
  `<span class="occ${l.from?'':' none'}">${who}${l.from?esc(l.from):'Original occasion not recorded'}</span>`+
  `<span class="src">From ${l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.src)}</a>`:esc(l.src)}${l.note?' · '+esc(l.note):''}</span></div><span class="len">${l.d.toFixed(1)} s</span></li>`}
function draw(){
 const L=LINES.filter(l=>(!F.who||grpOf(l)===F.who)&&(!F.q||[l.quote,l.who,l.from||'',l.src,l.f].join(' ').toLowerCase().includes(F.q)));
 $('count').textContent=L.length===LINES.length?'':`${L.length} shown`;
 $('list').innerHTML=groups.map(g=>{const G=L.filter(l=>grpOf(l)===g).sort((a,b)=>a.quote.localeCompare(b.quote));
  return G.length?`<h2>${esc(g)}<span class="ct">${G.length}</span></h2><ul>${G.map(row).join('')}</ul>`:''}).join('')||'<p class="src">No lines match.</p>'}
let au=null,on=null;
$('list').onclick=e=>{const b=e.target.closest('.play');if(!b)return;
 if(on===b){au.pause();b.classList.remove('on');b.textContent='▶';on=null;return}
 if(au){au.pause();if(on){on.classList.remove('on');on.textContent='▶'}}
 au=new Audio(b.dataset.f+'.mp3');on=b;b.classList.add('on');b.textContent='■';
 au.onended=au.onerror=()=>{b.classList.remove('on');b.textContent='▶';if(on===b)on=null};au.play().catch(()=>au.onerror())};
draw();
</script>
</body></html>
