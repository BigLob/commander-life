  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* The same color pairs as Commander Life: the seat in the first color, the second laid over 30% of it. */
.k-gr { --seat: #2a6238; --seat-hi: #3f8a50; --accent: #c0442f; }
.k-uw { --seat: #1b4a84; --seat-hi: #2c69b3; --accent: #d9ccab; }
.k-rb { --seat: #8e2a1f; --seat-hi: #c0442f; --accent: #121014; }
.k-bu { --seat: #17161b; --seat-hi: #34303d; --accent: #2c69b3; }
.k-gw { --seat: #2a6238; --seat-hi: #3f8a50; --accent: #d9ccab; }

[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--table); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--table); color: var(--ink);
  font-family: var(--f-ui); font-size: 16px;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; touch-action: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--hot); outline-offset: -3px; }

#app {
  position: relative; height: 100%;
  padding-block: 6px;
  padding-left: max(6px, env(safe-area-inset-left, 0px));
  padding-right: max(6px, env(safe-area-inset-right, 0px));
}
.board { height: 100%; display: grid; gap: 6px; grid-template-rows: minmax(0, 24fr) minmax(0, 76fr); }
.heroes { display: grid; gap: 6px; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 0; }

.seat {
  position: relative; overflow: hidden; border-radius: 18px; min-height: 0;
  background: radial-gradient(120% 90% at 50% 45%, var(--seat-hi), var(--seat));
  transition: filter .3s;
}
.seat.out { filter: grayscale(.85) brightness(.7); }
.seat.marking::before {
  content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  border: 4px solid var(--ink); border-radius: inherit;
}
/* The second color, cut to the player's pattern. */
.tex {
  position: absolute; inset: 0; pointer-events: none; background: var(--accent);
  -webkit-mask: var(--pattern) 0 0 / 100% 100% no-repeat; mask: var(--pattern) 0 0 / 100% 100% no-repeat;
}
/* Script measures each face into --cqw/--cqh (1% of its width/height), standing in for container query units. */
.face { position: absolute; inset: 0; }
.seat.ae { display: grid; grid-template-rows: minmax(0, 30fr) minmax(0, 70fr); padding-bottom: 8px; }
.seat.ae .face { position: relative; }

.zone {
  position: absolute; top: 0; bottom: 0; width: 50%;
  border: 0; background: transparent; padding: 0;
  color: var(--ink-2); touch-action: none;
  font-family: var(--f-num); font-weight: 700; font-size: clamp(28px, calc(22 * var(--cqh, 1vh)), 64px);
  display: flex; align-items: center;
  transition: background .12s;
}
.zone.minus { left: 0; justify-content: flex-start; padding-left: calc(7 * var(--cqw, 1vw)); }
.zone.plus { right: 0; justify-content: flex-end; padding-right: calc(7 * var(--cqw, 1vw)); }
.zone.press { background: rgba(255, 255, 255, .1); transition: none; }
.hero .zone { font-size: clamp(20px, calc(16 * var(--cqw, 1vw)), 40px); padding-inline: calc(5 * var(--cqw, 1vw)); }

.readout {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.name {
  position: absolute; top: calc(7 * var(--cqh, 1vh)); left: 0; right: 0; padding-inline: 8px; text-align: center;
  font-size: clamp(15px, calc(11 * var(--cqh, 1vh)), 26px); font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  /* Same black outline as the life total, thicker for the small type. */
  -webkit-text-stroke: .14em #000; paint-order: stroke fill;
}
.hero .name { letter-spacing: .1em; font-size: clamp(14px, calc(10 * var(--cqh, 1vh)), 21px); }
.name .why { display: block; margin-top: .2em; font-size: .7em; color: var(--ink); }
.ae .name { left: calc(5 * var(--cqw, 1vw)); right: 64px; text-align: left; color: var(--gold); padding: 0; }
.crown { width: 1.3em; height: 1.3em; margin-right: .3em; vertical-align: -.25em; fill: var(--gold); stroke: #000; stroke-width: 2; stroke-linejoin: round; }
.life {
  position: relative;
  font-family: var(--f-num); font-weight: 800;
  font-size: min(calc(56 * var(--cqh, 1vh)), calc(44 * var(--cqw, 1vw))); line-height: .82;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  /* A black outline, drawn behind the fill, keeps the digits readable on any pattern. */
  -webkit-text-stroke: .06em #000; paint-order: stroke fill;
  text-shadow: 0 2px 18px rgba(0, 0, 0, .4);
}
.hero .life { font-size: min(calc(46 * var(--cqh, 1vh)), calc(40 * var(--cqw, 1vw))); }
.delta {
  -webkit-text-stroke-width: .08em;
  position: absolute; left: 100%; top: .06em; margin-left: .1em;
  font-size: .3em; font-weight: 700; letter-spacing: 0;
  opacity: 0; transition: opacity .25s;
}
.delta.show { opacity: .9; transition: none; }

.tray {
  /* Commander damage sits in the seat's bottom-right corner. */
  position: absolute; bottom: calc(6 * var(--cqh, 1vh)); right: calc(5 * var(--cqw, 1vw)); z-index: 2;
  display: flex; align-items: center; gap: .35em; white-space: nowrap;
  font-size: clamp(12px, min(calc(8.5 * var(--cqh, 1vh)), calc(4.3 * var(--cqw, 1vw))), 19px);
}
.hero .tray { font-size: 12px; }
.chip {
  display: flex; align-items: center; gap: .35em;
  background: rgba(0, 0, 0, .28); border: 1px solid var(--line); border-radius: 999px;
  padding: .3em .7em; font-size: 1em; font-weight: 600; letter-spacing: .04em;
  touch-action: manipulation;
}
.chip .ct { max-width: 5.5em; overflow: hidden; text-overflow: ellipsis; }
.ae .chip .ct { max-width: 4.2em; }
.chip b { font-family: var(--f-num); font-weight: 800; font-variant-numeric: tabular-nums; }
.chip.hot { border-color: var(--hot); color: var(--hot); }
.chip.on { background: var(--seat-hi); border-color: var(--ink); color: var(--ink); }
.sw { width: .7em; height: .7em; border-radius: 50%; background: linear-gradient(135deg, var(--seat-hi) 50%, var(--accent) 50%); flex: none; }
/* Commander damage: heroes only take it from the archenemy, so their dagger marks it straight away;
   the archenemy's dagger opens the three heroes above it. While one is marked, only their chip shows. */
.cmd-btn {
  position: relative; display: grid; place-items: center;
  width: 2.4em; height: 2.4em; padding: 0; border-radius: 50%;
  background: transparent; border: 0;
  touch-action: manipulation;
}
/* The mask cuts the dagger out of its ::before; the shadows on the wrapper trace it in black. */
.cmd-btn .blade {
  width: 2em; height: 2em;
  filter: drop-shadow(1.5px 0 0 #000) drop-shadow(-1.5px 0 0 #000) drop-shadow(0 1.5px 0 #000) drop-shadow(0 -1.5px 0 #000);
}
.cmd-btn .blade::before {
  content: ""; display: block; width: 100%; height: 100%; background: currentColor;
  -webkit-mask: var(--blade) center / contain no-repeat; mask: var(--blade) center / contain no-repeat;
}
.cmd-btn b {
  position: absolute; top: -.3em; right: -.6em; min-width: 1.6em; padding: .05em .3em;
  border-radius: 999px; background: var(--ink); color: var(--table);
  font-family: var(--f-num); font-size: .8em; font-weight: 800; font-variant-numeric: tabular-nums;
}
.cmd-btn.hot { color: var(--hot); }
.cmd-btn.hot b { background: var(--hot); }
.pop {
  position: absolute; bottom: calc(100% + .5em); right: 0;
  display: none; gap: .35em; width: max-content; padding: .35em;
  border-radius: 999px; background: var(--table); box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
}
.seat.open .pop { display: flex; }
.seat.marking .cmd-btn, .seat.marking .pop .chip:not(.on) { display: none; }
.seat.marking .pop { display: flex; position: static; padding: 0; background: none; box-shadow: none; }

.menu-btn {
  position: absolute; z-index: 10; top: calc(5 * var(--cqh, 1vh)); right: calc(4 * var(--cqw, 1vw));
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center; padding: 0;
  background: rgba(0, 0, 0, .3); border: 2px solid var(--line);
}
.menu-btn svg { width: 24px; height: 24px; }

/* The scheme card sits on the archenemy's seat, under their life. */
.scheme {
  position: relative; z-index: 3; margin: 0 8px; min-height: 0;
  display: flex; flex-direction: column;
  background: rgba(10, 11, 14, .9); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
  border-radius: 14px; overflow: hidden;
}
.sch-head {
  display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px 0;
  font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
}
.sch-head b { color: var(--gold); font-weight: 600; }
.sch-body {
  flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
  padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 16px;
}
.sch-foot { display: flex; gap: 8px; padding: 0 10px 10px; }
.sch-foot .action { flex: 1; }
.sch-foot .ghost { flex: none; }
.card { display: flex; flex-direction: column; gap: 10px; }
.card .type { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.card .nm { font-family: var(--f-num); font-weight: 800; font-size: 34px; line-height: 1; text-wrap: balance; }
.text { font-family: var(--f-text); font-weight: 500; font-size: 18px; line-height: 1.42; -webkit-user-select: text; user-select: text; }
.text p { margin: 0 0 .5em; }
.text p:last-child { margin-bottom: 0; }
.text i { color: var(--ink-2); }
.text.small { font-size: 15px; }
.sym {
  display: inline-block; min-width: 1.5em; padding: 0 .3em; border-radius: 999px; text-align: center;
  background: rgba(255, 255, 255, .12); border: 1px solid var(--line); font-size: .8em; font-weight: 600; line-height: 1.45;
}
.reveal { animation: reveal .5s ease-out; }
@keyframes reveal { from { transform: translateY(8px) scale(.98); opacity: .2; } to { transform: none; opacity: 1; } }
.wait { margin: auto 0; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.wait .big { font-family: var(--f-num); font-weight: 800; font-size: 26px; line-height: 1.05; text-wrap: balance; }
.note { font-family: var(--f-text); font-size: 14px; color: var(--ink-2); text-wrap: pretty; }
.motion {
  border: 0; border-radius: 14px; padding: 18px; width: 100%;
  background: var(--gold); color: #1a1306;
  font-family: var(--f-num); font-weight: 800; font-size: 36px; letter-spacing: .02em; text-transform: uppercase;
}
.og-list { display: flex; flex-direction: column; gap: 8px; }
.og-list > span { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.og { display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 10px 12px; border-left: 3px solid var(--gold); border-radius: 8px; background: rgba(255, 255, 255, .05); }
.og-head { display: flex; align-items: center; gap: 10px; }
.og .on-nm { flex: 1; min-width: 0; font-family: var(--f-num); font-weight: 800; font-size: 22px; line-height: 1.05; }
.og button { flex: none; border: 1px solid var(--line); border-radius: 10px; background: transparent; padding: 8px 12px; font-size: 16px; font-weight: 600; }

/* Menu and deck builder */
.menu {
  position: fixed; inset: 0; z-index: 20;
  display: grid; place-items: center; padding: 20px;
  background: rgba(0, 0, 0, .65); touch-action: manipulation;
}
.panel {
  width: min(100%, 360px); max-height: 100%; overflow-y: auto; touch-action: pan-y;
  display: flex; flex-direction: column; gap: 18px;
  padding: 22px 20px; border-radius: 20px;
  background: var(--panel); border: 1px solid var(--line);
}
.panel h2 {
  margin: 0; font-family: var(--f-num); font-weight: 800; font-size: 30px;
  letter-spacing: .04em; text-transform: uppercase; text-wrap: balance;
}
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255, 255, 255, .06); }
.seg button {
  border: 0; border-radius: 9px; background: transparent; padding: 10px 6px;
  font-size: 18px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.seg button.on { background: var(--ink); color: var(--table); }
.seg button.armed { background: var(--hot); color: var(--table); }
.action {
  border: 0; border-radius: 12px; padding: 14px; font-size: 19px; font-weight: 600;
  background: rgba(255, 255, 255, .1);
}
.action.primary { background: var(--ink); color: var(--table); }
.action.gold { background: var(--gold); color: #1a1306; }
.action.armed { background: var(--hot); color: var(--table); }

    "You Exist Only to Amuse": [0, "When you set this scheme in motion, choose one. If you control six or more lands, choose both instead.\n• Create three 1/1 red Devil creature tokens with \"When this token dies, it deals 1 damage to any target.\"\n• Until your next turn, creatures your opponents control have base power and toughness 1/1 and lose all abilities."],

    "Your Inescapable Doom": [1, "(An ongoing scheme remains face up.)\nAt the beginning of your end step, put a doom counter on this scheme, then this scheme deals damage equal to the number of doom counters on it to the opponent with the highest life total among your opponents. If two or more players are tied for highest life total, you choose one."],
    "Your Mistake Is My Triumph": [0, "When you set this scheme in motion, each player mills three cards. Then you put a permanent card from among the milled cards onto the battlefield under your control."],
    "Your Nightmares Are Delicious": [0, "When you set this scheme in motion, each opponent who has more than five cards in hand discards cards equal to the difference. Then if fewer than three cards were discarded this way, you draw three cards."],
    "Your Own Face Mocks You": [0, "When you set this scheme in motion, choose up to two target creatures your opponents control. For each one, create a token that's a copy of it. If you created fewer than two tokens this way, create a number of 4/4 colorless Scarecrow artifact creature tokens with vigilance equal to the difference."],
    "Your Plans Mean Nothing": [0, "When you set this scheme in motion, any number of target players each discard their hands. Each opponent draws cards equal to the number of cards that player discarded minus one. Then if you discarded a card this way, draw seven cards."],
    "Your Puny Minds Cannot Fathom": [0, "When you set this scheme in motion, draw four cards. You have no maximum hand size until your next turn."],
    "Your Will Is Not Your Own": [0, "When you set this scheme in motion, gain control of target creature an opponent controls until end of turn. Untap that creature. It gets +3/+3 and gains trample and haste until end of turn."]
  };
  // Everything printed in each set, reprints included (Duskmourn's 40 = its four preset decks).
  const SET_POOLS = Object.fromEntries(SETS.map(([t, names]) => [t, t.startsWith('Duskmourn') ? [...new Set([...names, ...Object.values(PRESETS).flat()])] : names]));
  const poolFor = sets => [...new Set(sets.flatMap(t => SET_POOLS[t] || []))];
  const isCard = n => typeof n === 'string' && Object.prototype.hasOwnProperty.call(CARDS, n);
  const isOngoing = n => isCard(n) && !!CARDS[n][0];

  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // Card text as paragraphs: reminder text in italics, {U}-style symbols as small tokens.
  const cardText = n => (isCard(n) ? CARDS[n][1] : '').split('\n').map(line =>
    '<p>' + esc(line).replace(/\(([^)]*)\)/g, '<i>($1)</i>').replace(/\{([^}]+)\}/g, '<span class="sym">$1</span>') + '</p>').join('');
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const r = new Uint32Array(1); crypto.getRandomValues(r);
      const j = r[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---- state ----
  // life[p] per person; cmd[v][a] is commander damage person v took from person a.
  // scheme is null until the archenemy shuffles a deck: { deck, current, ongoing, turn, log }.
  const startLife = ae => PEOPLE.map(p => p === ae ? AE_LIFE : HERO_LIFE);
  const zeroCmd = () => PEOPLE.map(() => [0, 0, 0, 0]);

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || typeof state !== 'object') state = {};
  if (!PEOPLE.includes(state.ae)) state.ae = 0;
  if (!PEOPLE.includes(state.me)) state.me = 0;
  if (!Array.isArray(state.names) || state.names.length !== 4) state.names = DEFAULT_NAMES.slice();
  if (!Array.isArray(state.colors) || state.colors.length !== 4) state.colors = DEFAULT_COLORS.slice();
  if (!Array.isArray(state.patterns) || state.patterns.length !== 4) state.patterns = ['marble', 'marble', 'marble', 'marble'];
  if (!Array.isArray(state.life) || state.life.length !== 4) state.life = startLife(state.ae);
  if (!Array.isArray(state.cmd) || state.cmd.length !== 4 || !state.cmd.every(r => Array.isArray(r) && r.length === 4)) state.cmd = zeroCmd();
  state.scheme = normScheme(state.scheme);
  // The deck builder's picks, kept on this phone only.
  if (!state.pick || !Array.isArray(state.pick.selected)) state.pick = { selected: PRESETS['Jump Scare'].slice(), sets: SETS.map(s => s[0]) };

  function normScheme(s) {
    if (!s || typeof s !== 'object') return null;
    const list = v => (Array.isArray(v) ? v : v && typeof v === 'object' ? Object.values(v) : []).filter(isCard);
    return {
      deck: list(s.deck), ongoing: list(s.ongoing),
      current: isCard(s.current) ? s.current : '',
      turn: Number.isInteger(s.turn) && s.turn >= 0 ? s.turn : 0,
      log: (Array.isArray(s.log) ? s.log : []).filter(l => typeof l === 'string').slice(0, 40),
    };
  }

  const nameOf = p => esc(state.names[p].trim() || DEFAULT_NAMES[p]);
  const plainName = p => state.names[p].trim() || DEFAULT_NAMES[p];
  const heroes = () => PEOPLE.filter(p => p !== state.ae);
  const colorOf = p => 'k-' + (SCHEMES[state.colors[p]] ? state.colors[p] : DEFAULT_COLORS[p]);
  const patternOf = p => PATTERNS[state.patterns[p]] ? state.patterns[p] : 'marble';
  // Heroes only take commander damage from the archenemy; the archenemy takes it from each hero.
  const attackersOf = p => p === state.ae ? heroes() : [state.ae];
  const iAmAe = () => state.me === state.ae;
  const untouched = () => PEOPLE.every(p => state.life[p] === (p === state.ae ? AE_LIFE : HERO_LIFE) &&
    state.cmd[p].every(c => c === 0)) && (!state.scheme || (!state.scheme.turn && !state.scheme.ongoing.length));

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const app = document.getElementById('app');
  let seats = {};
  const deltas = {};
  // Per person, the attacker whose commander damage is being marked (null when off).
  let marking = {};
  let undoStack = [];
  let justRevealed = false;

  // ---- wake lock & haptics ----
  let lock = null;
  async function wake() {
    if (lock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
    catch (e) {}
  }
  document.addEventListener('visibilitychange', wake);
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

  // ---- rendering ----
  function seatHtml(p) {
    const opps = attackersOf(p);
    return `
      <i class="tex"></i>
      <div class="face">
        <button type="button" class="zone minus" aria-label="${nameOf(p)} lose 1 life">&minus;</button>
        <button type="button" class="zone plus" aria-label="${nameOf(p)} gain 1 life">+</button>
        <div class="readout">
          <div class="name"></div>
          <div class="life"><span class="num"></span><span class="delta"></span></div>
        </div>
        <div class="tray">
          <div class="pop">
            ${opps.map(a => `<button type="button" class="chip ${colorOf(a)}" data-from="${a}" aria-label="Mark commander damage from ${nameOf(a)}"><i class="sw"></i><span class="ct">${nameOf(a)}</span><b>0</b></button>`).join('')}
          </div>
          <button type="button" class="cmd-btn" aria-label="Commander damage from ${p === state.ae ? 'a hero' : nameOf(state.ae)}" aria-expanded="false">${ICON_CMD}<b hidden></b></button>
        </div>
      </div>`;
  }

  function build() {
    app.innerHTML = '';
    seats = {};
    const board = document.createElement('div');
    board.className = 'board';
    const row = document.createElement('div');
    row.className = 'heroes';
    board.appendChild(row);
    PEOPLE.forEach(p => {
      const seat = document.createElement('section');
      const ae = p === state.ae;
      seat.className = `seat ${ae ? 'ae' : 'hero'} ${colorOf(p)}`;
      seat.style.setProperty('--pattern', patternUrl(patternOf(p)));
      seat.innerHTML = seatHtml(p);
      if (ae) {
        const sch = document.createElement('div');
        sch.className = 'scheme';
        sch.id = 'scheme';
        seat.appendChild(sch);
        const mb = document.createElement('button');
        mb.type = 'button';
        mb.className = 'menu-btn';
        mb.setAttribute('aria-label', 'Menu');
        mb.innerHTML = ICON_MENU;
        mb.addEventListener('click', openMenu);
        seat.querySelector('.face').appendChild(mb);
      }
      bindZone(seat.querySelector('.minus'), p, -1);
      bindZone(seat.querySelector('.plus'), p, 1);
      seat.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        seat.classList.remove('open');
        toggleMarking(p, +c.dataset.from);
      }));
      const cmdBtn = seat.querySelector('.cmd-btn');
      cmdBtn.addEventListener('click', () => {
        // A hero's only attacker is the archenemy, so their dagger marks straight away.
        if (!ae) return toggleMarking(p, state.ae);
        seat.classList.toggle('open');
        update(p); buzz();
      });
      seats[p] = seat;
      deltas[p] = deltas[p] || { sum: 0, t: null };
    });
    heroes().forEach(p => row.appendChild(seats[p]));
    board.appendChild(seats[state.ae]);
    app.appendChild(board);
    PEOPLE.forEach(update);
    renderScheme();
    measure();
  }

  function measure() {
    app.querySelectorAll('.face').forEach(face => {
      face.style.setProperty('--cqw', face.offsetWidth / 100 + 'px');
      face.style.setProperty('--cqh', face.offsetHeight / 100 + 'px');
    });
  }
  if ('ResizeObserver' in window) new ResizeObserver(measure).observe(app);
  else addEventListener('resize', () => setTimeout(measure, 50));

  function outReason(p) {
    if (state.cmd[p].some(c => c >= CMD_LETHAL)) return CMD_LETHAL + ' commander';
    if (state.life[p] <= 0) return 'no life';
    return '';
  }

  function update(p) {
    const seat = seats[p];
    if (!seat) return;
    seat.querySelector('.num').textContent = state.life[p];
    const why = outReason(p);
    seat.classList.toggle('out', !!why);
    const label = (p === state.ae ? ICON_CROWN : '') + nameOf(p);
    seat.querySelector('.name').innerHTML = why ? `${label}<span class="why">out</span>` : label;
    seat.classList.toggle('marking', marking[p] != null);
    seat.querySelectorAll('.chip').forEach(c => {
      const a = +c.dataset.from, v = state.cmd[p][a], on = marking[p] === a;
      c.querySelector('b').textContent = v;
      c.classList.toggle('on', on);
      c.classList.toggle('hot', !on && v >= CMD_LETHAL - 6);
      c.setAttribute('aria-pressed', on);
    });
    // The dagger carries the most commander damage taken from any one attacker.
    const most = Math.max(0, ...attackersOf(p).map(a => state.cmd[p][a]));
    const cmdBtn = seat.querySelector('.cmd-btn'), badge = cmdBtn.querySelector('b');
    badge.hidden = !most;
    badge.textContent = most;
    cmdBtn.classList.toggle('hot', most >= CMD_LETHAL - 6);
    cmdBtn.setAttribute('aria-expanded', seat.classList.contains('open'));
  }

  function showDelta(p, d) {
    const st = deltas[p], el = seats[p] && seats[p].querySelector('.delta');
    if (!el) return;
    st.sum += d;
    clearTimeout(st.t);
    el.textContent = st.sum > 0 ? '+' + st.sum : st.sum < 0 ? '−' + -st.sum : '±0';
    el.classList.add('show');
    st.t = setTimeout(() => { el.classList.remove('show'); st.sum = 0; }, 1600);
  }

  // The scheme panel: the archenemy's phone runs the deck; every other phone just shows it.
  function renderScheme() {
    const el = document.getElementById('scheme');
    if (!el) return;
    const s = state.scheme, mine = iAmAe(), ae = nameOf(state.ae);
    const head = s
      ? `<span>${s.turn ? 'Turn ' + s.turn : 'Scheme'}</span><span><b>${s.deck.length}</b> in deck${s.ongoing.length ? ` · <b>${s.ongoing.length}</b> ongoing` : ''}</span>`
      : '<span>Scheme</span><span></span>';
    let body = '', foot = '';
    if (!s) {
      body = mine
        ? `<div class="wait"><p class="big">Build your scheme deck</p><p class="note">Deal one at random, start from a Duskmourn deck, or pick your own. 10 or more.</p><button type="button" class="action gold" data-act="build">Build scheme deck</button></div>`
        : `<div class="wait"><p class="big">Waiting for ${ae} to build the scheme deck</p><p class="note">The scheme deck runs from ${ae}'s phone: in the menu, set This phone is to ${ae} there.</p></div>`;
    } else if (s.current) {
      body = `<article class="card${justRevealed ? ' reveal' : ''}">
          <div class="type">${isOngoing(s.current) ? 'Ongoing scheme' : 'Scheme'}</div>
          <div class="nm">${esc(s.current)}</div>
          <div class="text">${cardText(s.current)}</div>
        </article>`;
      if (mine) foot = isOngoing(s.current)
        ? '<button type="button" class="action gold" data-act="keep">Keep in play</button>'
        : '<button type="button" class="action gold" data-act="done">Done: to the bottom</button>';
    } else if (s.deck.length) {
      const first = s.turn === 0 ? (mine ? 'You go first. ' : `${ae} goes first. `) : '';
      body = mine
        ? `<div class="wait"><button type="button" class="motion" data-act="motion">Set in Motion</button><p class="note">${first}Tap at the start of your precombat main phase.</p></div>`
        : `<div class="wait"><p class="big">No scheme in motion</p><p class="note">${first}${ae} sets one in motion at the start of each of their turns.</p></div>`;
    } else {
      body = `<div class="wait"><p class="big">The scheme deck is empty</p><p class="note">Abandon an ongoing scheme to put it back.</p></div>`;
    }
    if (s && s.ongoing.length) {
      body += `<div class="og-list"><span>Ongoing</span>${s.ongoing.map((n, i) => `
        <div class="og"><div class="og-head"><div class="on-nm">${esc(n)}</div>${mine ? `<button type="button" data-abandon="${i}">Abandon</button>` : ''}</div><div class="text small">${cardText(n)}</div></div>`).join('')}</div>`;
    }
    if (mine && s) foot += `<button type="button" class="ghost" data-act="undo"${undoStack.length ? '' : ' disabled'}>Undo</button>`;
    el.innerHTML = `<div class="sch-head">${head}</div><div class="sch-body">${body}</div>${foot ? `<div class="sch-foot">${foot}</div>` : ''}`;
    justRevealed = false;
  }

  // ---- changes ----
  // While an attacker is toggled on, life lost is also tallied as their commander damage.
  function changeLife(p, d) {
    const a = marking[p], bump = { ['life/' + p]: inc(d) };
    state.life[p] += d;
    if (a != null) {
      const was = state.cmd[p][a];
      state.cmd[p][a] = Math.max(0, was - d);
      bump[`cmd/${p}/${a}`] = inc(state.cmd[p][a] - was);
    }
    send(bump);
    showDelta(p, d); update(p); save(); buzz();
  }
  function toggleMarking(p, a) {
    marking[p] = marking[p] === a ? null : a;
    update(p); buzz(); wake();
  }

  // Tap = ±1, hold = ±10 then repeats.
  function bindZone(btn, p, sign) {
    let timer = null, rep = null, long = false, active = false;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      active = true; long = false;
      btn.classList.add('press');
      wake();
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      timer = setTimeout(() => {
        long = true; changeLife(p, 10 * sign);
        rep = setInterval(() => changeLife(p, 10 * sign), 550);
      }, 450);
    });
    const end = apply => {
      if (!active) return;
      active = false;
      clearTimeout(timer); clearInterval(rep);
      btn.classList.remove('press');
      if (apply && !long) changeLife(p, sign);
    };
    btn.addEventListener('pointerup', () => end(true));
    btn.addEventListener('pointercancel', () => end(false));
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('click', e => { if (e.detail === 0) changeLife(p, sign); }); // keyboard
  }

  // Scheme moves, made on the archenemy's phone; each sends the whole scheme state.
  const clock = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  function schemeMove(fn) {
    const s = state.scheme;
    if (!s) return;
    undoStack.push(JSON.stringify(s));
    if (undoStack.length > 40) undoStack.shift();
    const line = fn(s);
    if (line) s.log.unshift(clock() + ' · ' + line);
    s.log = s.log.slice(0, 40);
    send({ scheme: s });
    save(); renderScheme(); buzz(); wake();
  }
  app.addEventListener('click', e => {
    const b = e.target.closest('#scheme button');
    if (!b || !iAmAe()) return;
    if (b.dataset.abandon != null) {
      const i = +b.dataset.abandon;
      return schemeMove(s => { const n = s.ongoing.splice(i, 1)[0]; if (!n) return ''; s.deck.push(n); return 'Abandoned ' + n + '.'; });
    }
    switch (b.dataset.act) {
      case 'build': return openDeck();
      case 'motion':
        justRevealed = true;
        return schemeMove(s => {
          if (s.current || !s.deck.length) return '';
          s.current = s.deck.shift(); s.turn++;
          return `Turn ${s.turn}: set ${s.current} in motion.`;
        });
      case 'done': return schemeMove(s => { const n = s.current; s.deck.push(n); s.current = ''; return n + ' went to the bottom.'; });
      case 'keep': return schemeMove(s => { const n = s.current; s.ongoing.push(n); s.current = ''; return n + ' stays in play.'; });
      case 'undo': {
        const prev = undoStack.pop();
        if (!prev) return;
        state.scheme = normScheme(JSON.parse(prev));
        send({ scheme: state.scheme });
        save(); renderScheme(); buzz();
      }
    }
  });

  function newGame() {
    state.life = startLife(state.ae);
    state.cmd = zeroCmd();
    state.scheme = null;
    marking = {}; undoStack = [];
  }

  // ---- deck builder (archenemy's phone) ----
  const deck = document.getElementById('deck');
  const deckBody = document.getElementById('deckBody');
  let filter = '';
  function renderDeck() {
    const pick = state.pick, sel = new Set(pick.selected), sets = new Set(pick.sets);
    const pool = poolFor(pick.sets), f = filter.trim().toLowerCase();
    const groups = SETS.map(([title, names]) => {
      const shown = names.filter(x => !f || x.toLowerCase().includes(f));
      if (!shown.length) return '';
      return `<div class="set-group"><h3>${esc(title)}<span>${names.filter(x => sel.has(x)).length} / ${names.length}</span></h3>${shown.map(x => `
        <label class="row${sel.has(x) ? ' on' : ''}"><input type="checkbox" data-pick="${esc(x)}"${sel.has(x) ? ' checked' : ''}><span>${esc(x)}${isOngoing(x) ? '<em>Ongoing</em>' : ''}</span></label>`).join('')}</div>`;
    }).join('');
    const top = deckBody.scrollTop;
    deckBody.innerHTML = `
      <h2 id="deckTitle">Scheme deck</h2>
      <div class="field">
        <span>Random from sets</span>
        <div class="chips">${SETS.map(([t]) => `<button type="button" data-set="${esc(t)}" aria-pressed="${sets.has(t)}">${esc(t)}<span>${SET_POOLS[t].length}</span></button>`).join('')}</div>
        <button type="button" class="action primary" data-deal${pool.length ? '' : ' disabled'}>Deal ${Math.min(DEAL, pool.length)} at random</button>
      </div>
      <div class="field">
        <span>Duskmourn Commander decks</span>
        <div class="chips">${Object.keys(PRESETS).map(p => `<button type="button" data-preset="${esc(p)}" aria-pressed="${PRESETS[p].length === sel.size && PRESETS[p].every(x => sel.has(x))}">${esc(p)}</button>`).join('')}<button type="button" data-preset="">Clear</button></div>
      </div>
      <div class="field">
        <span>Or pick your own</span>
        <input class="search" id="filter" type="search" placeholder="Filter by name" value="${esc(filter)}" autocomplete="off">
      </div>
      ${groups || `<p class="note">No scheme matches that.</p>`}`;
    deckBody.scrollTop = top;
    const n = sel.size;
    document.getElementById('deckCount').textContent = n >= MIN_DECK ? `${n} schemes` : `${n} of ${MIN_DECK}`;
    document.getElementById('deckStart').disabled = n < MIN_DECK;
  }
  function openDeck() { filter = ''; renderDeck(); deck.hidden = false; deckBody.scrollTop = 0; }
  deckBody.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const pick = state.pick;
    if (b.dataset.set) {
      const t = b.dataset.set, cur = new Set(pick.sets);
      cur.has(t) ? cur.delete(t) : cur.add(t);
      pick.sets = SETS.map(s => s[0]).filter(x => cur.has(x));
    } else if (b.dataset.preset != null) {
      pick.selected = b.dataset.preset ? PRESETS[b.dataset.preset].slice() : [];
    } else if (b.hasAttribute('data-deal')) {
      pick.selected = shuffle(poolFor(pick.sets)).slice(0, DEAL);
    } else return;
    save(); renderDeck();
  });
  deckBody.addEventListener('change', e => {
    const n = e.target.dataset.pick;
    if (!n) return;
    const pick = state.pick;
    pick.selected = e.target.checked ? [...new Set([...pick.selected, n])] : pick.selected.filter(x => x !== n);
    save(); renderDeck();
  });
  deckBody.addEventListener('input', e => {
    if (e.target.id !== 'filter') return;
    filter = e.target.value; renderDeck();
    const el = document.getElementById('filter');
    el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  });
  document.getElementById('deckClose').addEventListener('click', () => { deck.hidden = true; });
  document.getElementById('deckStart').addEventListener('click', () => {
    const list = state.pick.selected.filter(isCard);
    if (list.length < MIN_DECK) return;
    state.scheme = { deck: shuffle(list), current: '', ongoing: [], turn: 0, log: [clock() + ' · Shuffled ' + list.length + ' schemes.'] };
    undoStack = [];
    send({ scheme: state.scheme });
    save(); deck.hidden = true; renderScheme(); wake();
  });

  // ---- menu ----
  const menu = document.getElementById('menu');
  const newGameBtn = document.getElementById('newGame');
  let armTimer = null, armedAe = null;

  function syncMenu() {
    document.getElementById('segAe').innerHTML = PEOPLE.map(p =>
      `<button type="button" data-v="${p}" class="${p === state.ae ? 'on' : p === armedAe ? 'armed' : ''}">${nameOf(p)}</button>`).join('');
    document.getElementById('meLabel').textContent = 'This phone is ' + plainName(state.me);
    document.querySelectorAll('#who .pick').forEach(pick => {
      const p = +pick.dataset.v;
      pick.classList.toggle('on', p === state.me);
      pick.setAttribute('aria-pressed', p === state.me);
      pick.setAttribute('aria-label', 'This phone is ' + plainName(p));
    });
    PEOPLE.forEach(p => {
      const input = document.getElementById('name' + p);
      if (input !== document.activeElement) input.value = state.names[p];
    });
    const me = state.me;
    document.getElementById('colorLabel').textContent = plainName(me) + "'s colors";
    document.getElementById('colors').innerHTML = Object.keys(SCHEMES).map(k =>
      `<button type="button" class="k-${k}${colorOf(me) === 'k-' + k ? ' on' : ''}" data-v="${k}" aria-label="${SCHEMES[k]}" title="${SCHEMES[k]}"></button>`).join('');
    document.getElementById('patterns').innerHTML = PATTERN_LIST.map(([k, name, n]) =>
      `<button type="button" class="${colorOf(me)}${patternOf(me) === k ? ' on' : ''}" style="--pattern: ${patternUrl(k)}" data-v="${k}" aria-label="${name}" title="${n}. ${name}"></button>`).join('');
    const log = state.scheme ? state.scheme.log : [];
    document.getElementById('logField').hidden = !log.length;
    document.getElementById('log').innerHTML = log.map(l => `<li>${esc(l)}</li>`).join('');
    if (!newGameBtn.classList.contains('armed')) newGameBtn.textContent = 'New game';
  }
  function disarm() {
    clearTimeout(armTimer);
    armedAe = null;
    newGameBtn.classList.remove('armed');
    newGameBtn.textContent = 'New game';
  }
  // A tap that would wipe a game in progress has to be made twice.
  function arm(after) { clearTimeout(armTimer); armTimer = setTimeout(() => { disarm(); syncMenu(); }, 3000); after(); }
  function openMenu() { disarm(); syncMenu(); menu.hidden = false; }
  function closeMenu() { menu.hidden = true; disarm(); }

  menu.addEventListener('click', e => { if (e.target === menu) closeMenu(); });
  document.getElementById('closeMenu').addEventListener('click', closeMenu);
  document.getElementById('segAe').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const p = +b.dataset.v;
    if (p === state.ae) return;
    if (!untouched() && armedAe !== p) {
      newGameBtn.classList.remove('armed');
      return arm(() => { armedAe = p; syncMenu(); });
    }
    disarm();
    state.ae = p;
    newGame();
    send({ ae: state.ae, life: state.life, cmd: state.cmd, scheme: null });
    save(); build(); syncMenu();
  });
  document.getElementById('who').addEventListener('click', e => {
    const b = e.target.closest('.pick');
    if (!b) return;
    state.me = +b.dataset.v; undoStack = []; save(); build(); syncMenu();
  });
  PEOPLE.forEach(p => document.getElementById('name' + p).addEventListener('input', e => {
    state.names[p] = e.target.value; send({ ['names/' + p]: state.names[p] }); save(); build(); syncMenu();
  }));
  document.getElementById('colors').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    state.colors[state.me] = b.dataset.v;
    send({ ['colors/' + state.me]: b.dataset.v });
    save(); build(); syncMenu();
  });
  document.getElementById('patterns').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    state.patterns[state.me] = b.dataset.v;
    send({ ['patterns/' + state.me]: b.dataset.v });
    save(); build(); syncMenu();
  });
  newGameBtn.addEventListener('click', () => {
    if (untouched() || newGameBtn.classList.contains('armed')) {
      disarm();
      newGame();
      send({ life: state.life, cmd: state.cmd, scheme: null });
      save(); build(); closeMenu();
      return;
    }
    armedAe = null;
    arm(() => { newGameBtn.classList.add('armed'); newGameBtn.textContent = 'Tap again to reset everyone'; syncMenu(); });
  });

  // ---- live sync ----
  // Every phone shares one table in the Firebase Realtime Database Commander Life uses, under its own
  // key so the two pages never touch each other's games. A server-sent event stream delivers the table
  // and every change; taps go up as server-side increments so taps on two phones at once both count.
  // The scheme state is only written by the archenemy's phone (and cleared by New game), so it goes up whole.
  const DB = 'https://commander-life-39708-default-rtdb.firebaseio.com';
  const TABLE_URL = DB + '/tables/t7q2xm4k-ae.json';

  const inc = d => ({ '.sv': { increment: d } });
  const allPaths = () => ['ae'].concat(...PEOPLE.map(p => [`names/${p}`, `colors/${p}`, `patterns/${p}`, `life/${p}`]),
    ...PEOPLE.map(v => PEOPLE.map(a => `cmd/${v}/${a}`)));
  const getAt = (root, path) => path.split('/').reduce((o, k) => o == null ? undefined : o[k], root);
  function setAt(path, v) {
    const keys = path.split('/'), last = keys.pop();
    keys.reduce((o, k) => o[k], state)[last] = v;
  }
  const shared = () => ({ ae: state.ae, names: state.names, colors: state.colors, patterns: state.patterns, life: state.life, cmd: state.cmd, scheme: state.scheme });

  let sentSchemes = [];
  // Increments fall back to plain values if the database refuses them.
  function send(patch) {
    if (!DB) return;
    if ('scheme' in patch) {
      sentSchemes = sentSchemes.filter(x => Date.now() - x.at < 8000).concat({ json: JSON.stringify(normScheme(patch.scheme)), at: Date.now() });
    }
    const body = JSON.stringify(patch);
    const plain = {};
    Object.keys(patch).forEach(k => { plain[k] = patch[k] && patch[k]['.sv'] ? getAt(state, k) : patch[k]; });
    fetch(TABLE_URL, { method: 'PATCH', body })
      .then(res => {
        if (!res.ok && body !== JSON.stringify(plain)) return fetch(TABLE_URL, { method: 'PATCH', body: JSON.stringify(plain) });
      })
      .catch(() => {});
  }

  function validValue(p, v) {
    if (p === 'ae') return PEOPLE.includes(v);
    if (p.startsWith('names/')) return typeof v === 'string' && v.length <= 12;
    if (p.startsWith('colors/')) return Object.prototype.hasOwnProperty.call(SCHEMES, v);
    if (p.startsWith('patterns/')) return Object.prototype.hasOwnProperty.call(PATTERNS, v);
    return typeof v === 'number' && isFinite(v) && Math.abs(v) < 1e6;
  }
  // Write `data` into the local copy of the table at `path`; null removes it.
  let mirror = null;
  function putIn(path, data) {
    const keys = path.split('/').filter(Boolean);
    if (!keys.length) { mirror = data; return; }
    if (!mirror || typeof mirror !== 'object') mirror = {};
    const last = keys.pop();
    const parent = keys.reduce((o, k) => (o[k] = o[k] && typeof o[k] === 'object' ? o[k] : {}), mirror);
    if (data === null) delete parent[last]; else parent[last] = data;
  }

  // Take every value the table holds over this phone's own.
  function adopt() {
    const changed = [];
    allPaths().forEach(p => {
      const v = getAt(mirror, p), was = getAt(state, p);
      if (v !== undefined && v !== was && validValue(p, v)) { setAt(p, v); changed.push({ p, was }); }
    });
    const sch = normScheme(mirror && mirror.scheme), schJson = JSON.stringify(sch);
    // Echoes of this phone's own earlier moves can land after a newer one; they're not news.
    const stale = sentSchemes.some(x => x.json === schJson && Date.now() - x.at < 8000);
    const schemeChanged = !stale && schJson !== JSON.stringify(state.scheme);
    if (schemeChanged) {
      const was = state.scheme;
      state.scheme = sch;
      // A move this phone didn't make (a new game, say) ends its undo history.
      undoStack = [];
      justRevealed = !!(sch && sch.current && (!was || was.current !== sch.current));
    }
    if (!changed.length && !schemeChanged) return;
    save();
    if (changed.some(x => !/^(life|cmd)\//.test(x.p))) {
      if (changed.some(x => x.p === 'ae')) { marking = {}; undoStack = []; }
      build();
      if (!menu.hidden) syncMenu();
      return;
    }
    if (schemeChanged) { renderScheme(); if (!menu.hidden) syncMenu(); }
    const touched = new Set();
    changed.forEach(({ p, was }) => {
      const [f, v] = p.split('/');
      if (f === 'life') showDelta(+v, state.life[+v] - was);
      touched.add(+v);
    });
    touched.forEach(update);
  }

  function setLive(on) {
    document.getElementById('ver').textContent =
      'v' + VERSION + ' · ' + (on ? 'Sharing live with this table' : 'Offline, this phone only');
  }
  let stream = null;
  function connect() {
    if (stream) stream.close();
    stream = new EventSource(TABLE_URL);
    stream.onopen = () => setLive(true);
    stream.onerror = () => setLive(stream.readyState === EventSource.OPEN); // it reconnects by itself
    stream.addEventListener('put', e => {
      const { path, data } = JSON.parse(e.data);
      // The first device here starts the table from its own game.
      if (path === '/' && data === null) {
        fetch(TABLE_URL, { method: 'PUT', body: JSON.stringify(shared()) }).catch(() => {});
        return;
      }
      putIn(path, data);
      adopt();
    });
    stream.addEventListener('patch', e => {
      const { path, data } = JSON.parse(e.data);
      Object.keys(data).forEach(k => putIn(path + '/' + k, data[k]));
      adopt();
    });
    // The database ended the stream (its rules changed): carry on alone.
    stream.addEventListener('cancel', () => { stream.close(); setLive(false); });
  }
  setLive(false);
  if (DB && 'EventSource' in window) {
    connect();
    // A phone that slept may hold a dead stream; a fresh one brings the whole table back.
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') connect(); });
  }

  build();
})();
</script>
</body>
</html>
