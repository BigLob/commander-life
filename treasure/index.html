<style>
/* Layout (cuts): the deck carousel cut to a precon's 15 most-removed cards, with EDHREC's cut share and links under each card. One full-height stage; a snap-scrolling card carousel with a header and a position bar; tap a card for a pan/zoom viewer. */
:root{--bg:#f1efe9;--surface:#e4e1d8;--fg:#1d1b17;--muted:#6a665c;--accent:#9a5a00;--line:#cfcabd;--shade:#0b0c0e;
--f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;--shade:#0b0c0e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;--shade:#0b0c0e;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);margin:0;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;overflow-x:hidden}
header{padding-block:14px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;font-weight:700;text-wrap:balance}
.total{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.back{flex:none;font-family:var(--f-mono);font-size:.85rem;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:9px 14px;touch-action:manipulation}
.total b{color:var(--accent);font-weight:500}
.seg{padding-top:4px;display:flex;flex-wrap:wrap;gap:4px;padding-bottom:6px}
.seg button{font:inherit;font-size:.72rem;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:6px}
.bar #fbtn,#f-reset{font:inherit;font-size:.76rem;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.bar #fbtn.on{border-color:var(--accent);color:var(--accent)}
#fpanel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-bottom:8px}
#fpanel label{display:flex;flex-direction:column;gap:3px;font-size:.68rem;color:var(--muted);font-family:var(--f-mono);min-width:0}
#fpanel select{font:inherit;font-size:.8rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 4px;min-width:0;width:100%}
.share{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;font-size:.68rem;color:var(--muted);font-family:var(--f-mono)}
.share div{display:flex;gap:6px}
.share input{flex:1;min-width:0;font:inherit;font-size:.8rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.share button{font:inherit;font-size:.76rem;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#f-reset{align-self:end}
.seg .ct{color:var(--muted);margin-left:3px;font-size:.68rem;font-family:var(--f-mono)}
.seg button[aria-pressed="true"] .ct{color:inherit;opacity:.8}
.favtot{margin-left:auto;align-self:center;color:var(--accent);font-family:var(--f-mono);font-size:.85rem;font-weight:500;white-space:nowrap}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail{flex:1;min-height:0;display:flex;align-items:center;position:relative}
.track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;height:100%;align-items:center;padding-inline:calc(50% - var(--w)/2);box-sizing:border-box;--w:200px}
.track::-webkit-scrollbar{display:none}
figure{margin:0;flex:0 0 var(--w);scroll-snap-align:center;display:flex;flex-direction:column;gap:10px}
figure .zb{all:unset;cursor:zoom-in;display:block;border-radius:4.5%/3.2%;aspect-ratio:488/680;background:var(--surface)}
figure .zb:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
figure img{width:100%;height:100%;display:block;border-radius:4.5%/3.2%;box-shadow:0 8px 24px rgba(0,0,0,.35)}
/* per-card actions */
.acts{display:flex;gap:8px}
.acts button{flex:1;font:inherit;font-size:.8rem;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 6px;cursor:pointer;touch-action:manipulation}
.acts button:focus-visible{outline:2px solid var(--accent)}
.acts button.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
figure.fav .zb img{box-shadow:0 0 0 3px var(--accent),0 8px 24px rgba(0,0,0,.35)}
.empty{margin:0 auto;max-width:260px;text-align:center;color:var(--muted);font-size:.9rem}
figcaption{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;line-height:1.25}
figcaption .nm{min-width:0;font-weight:500}
figcaption .pr{font-family:var(--f-mono);color:var(--accent);white-space:nowrap}
figcaption small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.7rem}
.nav{position:absolute;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:1.2rem;cursor:pointer;z-index:2;opacity:.9}
.nav.l{left:-6px}.nav.r{right:-6px}
.nav:focus-visible{outline:2px solid var(--accent)}
@media (max-width:600px){.nav{display:none}}
/* the user is left-handed, so Back sits in the bottom-left corner, in the footer row under the cards */
footer{padding-block:10px 14px;display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
footer input{flex:1;accent-color:var(--accent);min-width:0}
/* zoom viewer */
#zoom{touch-action:none;overscroll-behavior:none;position:fixed;inset:0;background:var(--shade);z-index:20;display:none;flex-direction:column;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px)}
#zoom.on{display:flex}
#stage{flex:1;min-height:0;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;cursor:grab}
#zimg{max-width:100%;max-height:100%;border-radius:4.5%/3.2%;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none;image-rendering:auto}
.zbar #zt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;color:#ece8dd;font-size:.9rem}
.zbar button{touch-action:manipulation;background:#2b3038;color:#ece8dd;border:1px solid #444b55;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.zbar button:focus-visible{outline:2px solid #e8b44a}
.zbar .g{display:flex;gap:6px}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}}
.why{margin:0;font-size:.78rem;line-height:1.3}
.why b{color:var(--accent);font-weight:500}
.cite b{color:var(--accent);font-weight:500}
.cite{margin:0;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);line-height:1.4}
.cite a,.srcs a{color:var(--accent)}
.srcs{font-size:.78rem;padding-bottom:6px}
.srcs summary{cursor:pointer;color:var(--accent);font-family:var(--f-mono);font-size:.72rem}
.srcs div{color:var(--muted);line-height:1.45;padding-top:4px}
.srcs p{margin:4px 0}
figure{gap:7px}
/* Phone on its side (the user, Nov 26, 2026: "I can't see anything", then "start it at the tabs"): the title, subtitle
   and sources are hidden, the tabs and sort bar share one row, and each card sits beside its text and buttons instead of
   above them, so the card gets the full height of the rail. fit() sizes --iw and --w. */
@media (orientation:landscape) and (max-height:560px){
 body{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:14px}
 header,.srcs{display:none}
 .seg{grid-area:1/1;padding-block:8px 4px}.bar{grid-area:1/2;padding-block:8px 4px}
 #fpanel{grid-column:1/-1;grid-row:2;grid-template-columns:repeat(6,minmax(0,1fr))}
 .rail{grid-column:1/-1;grid-row:3}footer{grid-column:1/-1;grid-row:4;padding-block:4px 8px}
 figure{display:grid;grid-template-columns:var(--iw) minmax(0,1fr);grid-auto-rows:min-content;column-gap:14px;row-gap:6px;align-content:center}
 figure .zb{grid-row:1/span 5;height:calc(var(--iw)*680/488)}
 .nav{display:none}
}

<script>
/* A precon's 15 most-cut cards, built by tools/carousel/cuts.py from EDHREC's precon page (Cards to Cut plus Lands to Cut) and the card data on decks/<slug>.html.
   Images load from Scryfall's CDN. Extra fields: k [Spell or Land], r rank (1 = most cut), x share of EDHREC's decks from this precon that cut it, u Scryfall page. */
const CFG={"slug": "treasure", "deck": "Top 25 Treasure commanders for the Ferengi", "set": "Commander-legal", "cmd": "Any", "alt": "", "decks": 25, "edh": "https://edhrec.com/tags/treasure", "srcs": "<p><b>Only commanders that can run every Ferengi Treasure card:</b> Grand Nagus Zek, Quark, Humble Proprietor, Rom and Leeta, Unlikely Pair, Savvy Profiteer are black or red, so the list keeps commanders whose colors include both. Quark stops you sacrificing Treasures (so they make no mana while he is out): he suits decks that count Treasures, not ones that spend them. Quark and Savvy Profiteer are Rogues (outlaws); Zek, Quark and Rom and Leeta are legendary. Each card says how well it fits (Strong, Good, Some; filter by it under Keyword).</p><p><b>Trek tab:</b> every card in the Star Trek set and the Star Trek Commander decks that mentions Treasure, and every Ferengi card (Scryfall search <code>(e:trk or e:trc) (o:treasure or t:ferengi or o:ferengi)</code>): Ferengi Treasure cards first, then other Treasure cards, then Ferengi without Treasure, most played first.</p><p><b>Source:</b> EDHREC's Treasure theme page and its color pages, read Nov 27, 2026: ranked by the number of decks EDHREC tags Treasure for each commander. Card data from Scryfall. Left out: Breeches, Brazen Plunderer // Malcolm, Keen-Eyed Navigator, Kediss, Emberclaw Familiar // Malcolm, Keen-Eyed Navigator, Ganax, Astral Hunter // Acolyte of Bahamut, Ganax, Astral Hunter // Feywild Visitor, Burakos, Party Leader // Folk Hero, Francisco, Fowl Marauder // Malcolm, Keen-Eyed Navigator (partner pairings or not Commander-legal; commanders without both black and red are left out too). The gameplay lines are our own summaries of each card's text.</p>", "sub": "The 25 most-played black-red Treasure commanders · how each works with the Ferengi"};

const F={sort:'',type:'',col:'',cost:'',kw:'',fav:''};
const TYPES=['Creature','Planeswalker','Artifact','Enchantment','Instant','Sorcery','Land'];
const COLS='WUBRG';
const typeOf=c=>{const i=TYPES.findIndex(t=>c.t.includes(t));return i<0?99:i};
const colOf=c=>c.c.length==1?COLS.indexOf(c.c):c.c.length>1?5:6;
function sortFilter(list){
 let r=list.filter(c=>(!F.type||c.t.includes(F.type))&&(!F.col||(F.col=='M'?c.c.length>1:F.col=='C'?!c.c.length:c.c.includes(F.col)))&&(!F.kw||c.k.includes(F.kw))&&(!F.fav||favs[c.n])&&(!F.cost||(F.cost=='6'?c.m>=6:F.cost=='0'?c.m<=1:c.m==+F.cost)));
 const S={cl:(a,b)=>a.m-b.m||pv(b)-pv(a),ch:(a,b)=>b.m-a.m||pv(b)-pv(a),ph:(a,b)=>pv(b)-pv(a),pl:(a,b)=>pv(a)-pv(b),n:(a,b)=>a.n.localeCompare(b.n),t:(a,b)=>typeOf(a)-typeOf(b)||b.m-a.m,c:(a,b)=>colOf(a)-colOf(b)||b.m-a.m}[F.sort];
 return S?r.slice().sort(S):r}
const TABS={deck:'Deck',trek:'Trek',fav:'Fav',bench:'Bench',trash:'Trash'};
function view(k){if(k=='fav')return EVERY.filter(c=>favs[c.n]&&!mark[c.n]);if(k=='deck')return ALL.filter(c=>!mark[c.n]);if(k=='trek')return TREK.filter(c=>!mark[c.n]);
 return EVERY.filter(c=>mark[c.n]==k).sort((a,b)=>b.m-a.m||pv(b)-pv(a))}
const $=id=>document.getElementById(id), tr=$('track');
$('h1').textContent=CFG.deck;
/* the deck list lives beside the page on the live site; a claude.ai artifact has no neighbours */
if(location.hostname&&!location.hostname.endsWith('github.io'))$('back').hidden=true;$('sub').innerHTML=CFG.sub;$('srcs').innerHTML=CFG.srcs;
document.querySelector('.srcs').addEventListener('toggle',()=>{fit();go(cur())});
/* each card's rank and the share of EDHREC's decks built from this precon that cut it, with links to the source and the card */
const pct=x=>Math.round(x*100)+'%';
function why(c){if(c.trek)return `<p class="cite"><b>${c.k.join(' · ')}</b> · Star Trek (${c.sc.toUpperCase()} ${c.cn})</p><p class="cite" style="text-transform:none;letter-spacing:0">${c.y} · <a href="${c.u}" target="_blank" rel="noopener">card text</a></p>`;return `<p class="cite"><b>#${c.r} of 25</b> · ${c.d.toLocaleString('en-US')} Treasure decks</p><p class="cite" style="text-transform:none;letter-spacing:0">${c.y}</p><p class="cite" style="text-transform:none;letter-spacing:0"><b>Ferengi: ${c.f}.</b> ${c.g} · <a href="${CFG.edh}" target="_blank" rel="noopener">EDHREC</a> · <a href="${c.u}" target="_blank" rel="noopener">card text</a></p>`}
// Mana cost as Scryfall's symbols, right-aligned on the name line (the user's ask, Nov 24, 2026).
function manaCost(s){return s?'<span class="mc" title="'+s+'">'+s.split(' // ').map(h=>(h.match(/\{[^}]+\}/g)||[]).map(t=>'<img src="https://svgs.scryfall.io/card-symbols/'+t.slice(1,-1).replace(/\//g,'')+'.svg" alt="'+t+'" draggable="false">').join('')).join('<b>//</b>')+'</span>':''}
const money=v=>v==null?'no price':'$'+v.toFixed(2);
const SIDE=matchMedia('(orientation:landscape) and (max-height:560px)');
function fit(){if(SIDE.matches){const iw=Math.max(90,Math.min((tr.clientHeight-8)*488/680,300));tr.style.setProperty('--iw',iw+'px');tr.style.setProperty('--w',Math.min(tr.clientWidth*.92,iw+330)+'px');return}
 const w=Math.max(120,Math.min(innerWidth*.8,(tr.clientHeight-165)*488/680,340));tr.style.setProperty('--w',w+'px')}
addEventListener('resize',()=>{fit();go(cur())});
let figs=[];
function btns(c){const home='Deck';
 const fl=c.b?'<button data-a="flip">Flip</button>':'';
 if(favs[c.n]&&!mark[c.n])return `<button class="on" data-a="unfav">★ Favorite · tap to undo</button>${fl}`;
 return fl+btns2(c,home)}
function btns2(c,home){
 if(tab=='bench')return `<button data-a="">Back to ${home}</button><button data-a="trash">Trash</button>`;
 if(tab=='trash')return `<button data-a="">Back to ${home}</button><button data-a="bench">Bench</button>`;
 return `<button data-a="fav">Fav</button><button data-a="bench">Bench</button><button data-a="trash">Trash</button>`}
function render(keep){D=sortFilter(view(tab));fit();
 for(const k in TABS){const b=document.querySelector('#seg [data-v='+k+']');b.innerHTML=TABS[k]+'<span class="ct">'+view(k).reduce((a,c)=>a+c.q,0)+'</span>';b.setAttribute('aria-pressed',k==tab)}
 const fv=EVERY.filter(c=>favs[c.n]&&!mark[c.n]);$('favtot').textContent='★ '+fv.reduce((a,c)=>a+c.q,0)+' · '+money(fv.reduce((a,c)=>a+pv(c)*c.q,0))+' / '+money(DECK_TOTAL);
  tr.innerHTML=D.length?D.map((c,i)=>`<figure class="${favs[c.n]&&!mark[c.n]?'fav':''}" data-i="${i}" data-n="${c.n.replace(/"/g,'&quot;')}"><button class="zb" aria-label="Zoom ${c.n}"><img src="${face(c)}" alt="${c.n}" loading="lazy" draggable="false" referrerpolicy="no-referrer"></button><figcaption><span class="nm">${c.n}<small>MV ${c.m} · ${c.q>1?c.q+' copies · ':''}${c.s}${c.n==CFG.cmd?' · commander':c.n==CFG.alt?' · alt commander':''}${c.note?'<br>'+c.note:''}</small></span><span class="pr">${manaCost(c.mc)}${money(c.p)}${c.q>1&&c.p!=null?' ea':''}</span></figcaption>${why(c)}<div class="acts">${btns(c)}</div></figure>`).join(''):'<p class="empty">'+(view(tab).length?'No cards match these filters.':tab=='fav'?'No favorites yet. Tap Fav on a card.':'Nothing here yet. Use the Fav, Bench and Trash buttons on a card to send it here.')+'</p>';
 figs=[...tr.querySelectorAll('figure')];sc.max=Math.max(0,D.length-1);tr.scrollLeft=0;if(keep!=null&&figs.length){const f=figs[Math.min(keep,figs.length-1)];tr.scrollLeft=f.offsetLeft+f.offsetWidth/2-tr.clientWidth/2}upd()}
const sc=$('scrub'); /* hidden since Nov 26, 2026 (the user swipes the cards instead); still kept in step */
function cur(){const m=tr.scrollLeft+tr.clientWidth/2;let b=0,bd=1e9;figs.forEach((f,i)=>{const d=Math.abs(f.offsetLeft+f.offsetWidth/2-m);if(d<bd){bd=d;b=i}});return b}
function go(i){i=Math.max(0,Math.min(D.length-1,i));const f=figs[i];if(!f)return;tr.scrollTo({left:f.offsetLeft+f.offsetWidth/2-tr.clientWidth/2,behavior:'smooth'})}
function upd(){const i=cur();sc.value=i;$('pos').textContent=D.length?(i+1)+' / '+D.length:'0 / 0'}
tr.addEventListener('scroll',()=>requestAnimationFrame(upd));
render();
const fsel={sort:'f-sort',type:'f-type',col:'f-col',cost:'f-cost',kw:'f-kw',fav:'f-fav'};
TYPES.forEach(t=>$('f-type').add(new Option(t,t)));
[...new Set(EVERY.flatMap(c=>c.k))].sort().forEach(k=>$('f-kw').add(new Option(k,k)));
function syncF(){const n=Object.keys(F).filter(k=>F[k]).length;$('fbtn').classList.toggle('on',n>0);$('f-reset').hidden=!n;$('fbtn').textContent=n?'Sort & filter · '+n:'Sort & filter'}
for(const k in fsel)$(fsel[k]).onchange=e=>{F[k]=e.target.value;syncF();render()};
$('f-reset').onclick=()=>{for(const k in fsel){F[k]='';$(fsel[k]).value=''}syncF();render()};
/* Browsers keep storage per site, so picks made on the artifact don't reach the github.io page. A code carries them across. */
const msg=m=>{$('f-msg').textContent=m};
$('f-copy').onclick=()=>{const code=btoa(JSON.stringify({f:Object.keys(favs),b:Object.keys(mark).filter(k=>mark[k]=='bench'),t:Object.keys(mark).filter(k=>mark[k]=='trash')}));
 $('f-code').value=code;$('f-code').select();
 (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>msg('Copied. Paste it into Load on the other page.'),()=>msg('Select the code above and copy it.'))};
$('f-load').onclick=()=>{try{const o=JSON.parse(atob($('f-code').value.trim())),ok=new Set(EVERY.map(c=>c.n));
 favs={};mark={};(o.f||[]).forEach(n=>{if(ok.has(n))favs[n]=1});(o.b||[]).forEach(n=>{if(ok.has(n))mark[n]='bench'});(o.t||[]).forEach(n=>{if(ok.has(n))mark[n]='trash'});
 saveFavs();saveMarks();render();msg('Loaded '+Object.keys(favs).length+' favorites, '+Object.keys(mark).length+' benched or trashed.')}catch(e){msg('That code did not work. Copy it again.')}};
$('fbtn').onclick=()=>{const h=$('fpanel').hidden;$('fpanel').hidden=!h;$('fbtn').setAttribute('aria-expanded',h);fit();go(cur())};
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{tab=b.dataset.v;render()});
tr.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){const f=a.closest('figure'),i=+f.dataset.i,n=f.dataset.n;
 if(a.dataset.a=='flip'){const c=D[i];flip[n]=!flip[n];f.querySelector('img').src=face(c);return}
 if(a.dataset.a=='fav'||a.dataset.a=='unfav'){if(a.dataset.a=='fav')favs[n]=1;else delete favs[n];saveFavs();render(i);return}
 if(a.dataset.a)mark[f.dataset.n]=a.dataset.a;else delete mark[f.dataset.n];saveMarks();render(i);return}
 const z=e.target.closest('.zb');if(z)open(+z.closest('figure').dataset.i)});

$('prev').onclick=()=>go(cur()-1);$('next').onclick=()=>go(cur()+1);
sc.oninput=()=>{const f=figs[+sc.value];if(!f)return;tr.scrollTo({left:f.offsetLeft+f.offsetWidth/2-tr.clientWidth/2})};
tr.addEventListener('keydown',e=>{if(e.key=='ArrowRight'){go(cur()+1);e.preventDefault()}if(e.key=='ArrowLeft'){go(cur()-1);e.preventDefault()}});
document.addEventListener('gesturestart',e=>e.preventDefault());
/* zoom viewer: scale + pan with pointer events (two pointers pinch) */
const z=$('zoom'),zi=$('zimg'),st=$('stage');let zc=0,s=1,x=0,y=0;const ptrs=new Map();let pd=0;
function clamp(){const mx=(s-1)*zi.offsetWidth/2,my=(s-1)*zi.offsetHeight/2;x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y))}
function apply(){if(s<=1.001){s=1;x=y=0}else clamp();zi.style.transform=`translate(${x}px,${y}px) scale(${s})`}
function setS(n,cx,cy){n=Math.max(1,Math.min(3,n));const r=st.getBoundingClientRect();const px=(cx??r.left+r.width/2)-(r.left+r.width/2),py=(cy??r.top+r.height/2)-(r.top+r.height/2);x=px-(px-x)*n/s;y=py-(py-y)*n/s;s=n;apply()}
function show(i){zc=Math.max(0,Math.min(D.length-1,i));const c=D[zc];zi.src=face(c);zi.alt=c.n;$('zfl').hidden=!c.b;$('zt').textContent=c.n+' · '+money(c.p);s=1;apply()}
function open(i){z.classList.add('on');show(i)}
function close(){z.classList.remove('on');go(zc)}

$('zx').onclick=close;$('zi').onclick=()=>setS(s*1.35);$('zo').onclick=()=>setS(s/1.35);$('zf').onclick=()=>setS(1);$('zfl').onclick=()=>{const c=D[zc];flip[c.n]=!flip[c.n];zi.src=face(c)};
$('zp').onclick=()=>show(zc-1);$('zn').onclick=()=>show(zc+1);
st.addEventListener('wheel',e=>{e.preventDefault();setS(s*(e.deltaY<0?1.15:1/1.15),e.clientX,e.clientY)},{passive:false});
let tapOk=false,t0=0,lastTap=0,sx=0,sy=0;
const dist=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size==1){tapOk=true;t0=Date.now();sx=e.clientX;sy=e.clientY}else{tapOk=false;pd=dist()}});
st.addEventListener('pointermove',e=>{const o=ptrs.get(e.pointerId);if(!o)return;
 if(tapOk&&Math.hypot(e.clientX-sx,e.clientY-sy)>8)tapOk=false;
 ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size==2){const d=dist(),[a,b]=[...ptrs.values()];if(pd)setS(s*Math.pow(d/pd,.8),(a[0]+b[0])/2,(a[1]+b[1])/2);pd=d}
 else if(ptrs.size==1&&s>1){x+=e.clientX-o[0];y+=e.clientY-o[1];apply()}});
function up(e){const was=ptrs.size;ptrs.delete(e.pointerId);pd=0;
 if(e.type=='pointerup'&&was==1&&tapOk&&Date.now()-t0<300){const n=Date.now();if(n-lastTap<350){lastTap=0;s>1?setS(1):setS(2,e.clientX,e.clientY)}else lastTap=n}
 if(ptrs.size==1){const [k,v]=[...ptrs][0];ptrs.set(k,v)}}
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
document.addEventListener('keydown',e=>{if(!z.classList.contains('on'))return;if(e.key=='Escape')close();if(e.key=='ArrowRight')show(zc+1);if(e.key=='ArrowLeft')show(zc-1);if(e.key=='+'||e.key=='=')setS(s*1.35);if(e.key=='-')setS(s/1.35)});
</script>

</body></html>
