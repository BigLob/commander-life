<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xenagos Tokens</title>
<!-- app-board-link: the installed app has no address bar, so every page links the board's manifest (installing from here still opens the board) and, inside the app, shows a Board button back to it. -->
<link rel="manifest" href="/commander-life/app/manifest.json">
<script>addEventListener('DOMContentLoaded',function(){if(!(matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches||navigator.standalone))return;var a=document.createElement('a');a.href='/commander-life/';a.textContent='\u{1F0CF} Board';a.setAttribute('style','position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:9999;padding:9px 14px;border-radius:999px;background:#0c0e11;color:#f3e3b0;border:1px solid #c9a24a;font:600 15px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.5)');document.body.appendChild(a)})</script>
<style>
/* 3 x 3 cards of 2.5 x 3.5 in, centred on Letter (0.5 in sides, 0.25 in top and bottom), so the
   margins match on both sides of the sheet and a back lines up with its front. Cut along the grey lines. */
@page{size:letter;margin:0}
html{background:#ccc}body{margin:0}
.pg{width:8.5in;height:11in;box-sizing:border-box;padding:.25in .5in;background:#fff;margin:16px auto;position:relative;
  display:grid;grid-template-columns:repeat(3,2.5in);grid-template-rows:repeat(3,3.5in);align-content:start;break-after:page}
.pg img,.pg i{width:2.5in;height:3.5in;display:block;outline:.5px solid #999;outline-offset:-.25px}
.pg i{outline:none}
.pg b{position:absolute;left:.5in;bottom:.06in;font:600 8pt system-ui,sans-serif;color:#999}
@media print{html{background:#fff}.pg{margin:0}.pg:last-child{break-after:auto}a[href="/commander-life/"]{display:none!important}}
