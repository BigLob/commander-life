<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Approve Theme Picks</title>
<!-- app-board-link: the installed app has no address bar, so every page links the board's manifest (installing from here still opens the board) and, inside the app, shows a Board button back to it. -->
<link rel="manifest" href="/commander-life/app/manifest.json">
<script>addEventListener('DOMContentLoaded',function(){if(!(matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches||navigator.standalone))return;var a=document.createElement('a');a.href='/commander-life/';a.textContent='\u{1F0CF} Board';a.setAttribute('style','position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:9999;padding:9px 14px;border-radius:999px;background:#0c0e11;color:#f3e3b0;border:1px solid #c9a24a;font:600 15px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.5)');var b=document.getElementById('back');if(b){a.style.position='static';a.style.flex='none';b.after(a)}else document.body.appendChild(a)})</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Approve the theme picks, every card in a section in one scroll, two per row. Front: which deck next. Then the adds (the 15, then the options), the
   cuts (the 15, then more), the land version (10 nonbasics for 10 basics), the maybes in one grid, and a summary to
   copy back to Claude. Decisions are saved to the shared table (Firebase tables/t7q2xm4k-theme), so every phone
   sees them; a deck with no answers anywhere that Claude has locked in (theme/<slug>-review.json) starts from that.
   Controls sit bottom-left (the user is left-handed). Same tokens as the theme pages. */
:root{--bg:#f1efe9;--surface:#e4e1d8;--fg:#1d1b17;--muted:#6a665c;--accent:#9a5a00;--line:#cfcabd;--yes:#2e7d32;--no:#b3261e;--maybe:#8a6d00;
--f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;--yes:#7bd88f;--no:#ff8a80;--maybe:#e8c54a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;--yes:#7bd88f;--no:#ff8a80;--maybe:#e8c54a;color-scheme:dark}
html{background:var(--bg)}
body{margin:0 auto;max-width:620px;background:var(--bg);color:var(--fg);font-family:var(--f-display);line-height:1.4;padding-block:14px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
a{color:var(--accent)}
h1{font-size:1.35rem;margin:0 0 2px;text-wrap:balance}
.sub{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
/* Front: the deck list */
.decks{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.deck{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.deck img{width:54px;aspect-ratio:488/680;border-radius:4px;flex:none;object-fit:cover;background:var(--bg)}
.deck .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.deck b{font-size:.98rem}
.deck .d{font-size:.8rem;color:var(--muted)}
.st{font-family:var(--f-mono);font-size:.68rem;color:var(--accent)}
.deck.off{opacity:.62}
.ask{margin:6px 0 0;font-size:.84rem;border:1px dashed var(--accent);border-radius:10px;padding:8px 10px}
.ask p{margin:0 0 6px}
.ask q{display:block;font-family:var(--f-mono);font-size:.76rem;margin:0 0 8px}
.pill{background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.85rem}
.pill.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
/* Review */
.tally{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}
.tally span{font-family:var(--f-mono);font-size:.66rem;border:1px solid var(--line);border-radius:999px;padding:3px 6px}
.tally .full{border-color:var(--yes);color:var(--yes)}.tally .over{border-color:var(--no);color:var(--no)}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.tabs button{flex:1 1 22%;min-width:0;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 2px;font-size:.78rem}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.where{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin:0 0 8px}
.note{font-size:.84rem;border:1px solid var(--yes);border-radius:10px;padding:8px 10px;margin:0 0 10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;transition:opacity .18s}
.pair.fade{opacity:0}
.pair.all{row-gap:18px}
.grp{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);margin:14px 0 6px;grid-column:1/-1}
.card{display:flex;flex-direction:column;gap:4px;min-width:0}
.zb{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:4.75%/3.5%;overflow:hidden;outline-offset:2px}
.zb img{display:block;width:100%;height:auto;aspect-ratio:488/680;background:var(--surface)}
.card.y .zb{outline:3px solid var(--yes)}.card.n .zb{outline:3px solid var(--no);opacity:.55}.card.m .zb{outline:3px solid var(--maybe)}
.nm{font-weight:700;font-size:.86rem;line-height:1.2;overflow-wrap:anywhere}
.job{font-size:.72rem;color:var(--accent);line-height:1.2}
.num{font-family:var(--f-mono);font-size:.64rem;color:var(--muted);line-height:1.3}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips i{font-style:normal;font-family:var(--f-mono);font-size:.6rem;border:1px solid var(--line);border-radius:999px;padding:1px 6px}
.chips i.top{border-color:var(--accent);color:var(--accent)}.chips i.gc{border-color:var(--no);color:var(--no)}
.yn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:2px}
.yn button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 0;font-size:.8rem;font-weight:700}
.yn .y[aria-pressed="true"]{background:var(--yes);border-color:var(--yes);color:var(--bg)}
.yn .m[aria-pressed="true"]{background:var(--maybe);border-color:var(--maybe);color:var(--bg)}
.yn .n[aria-pressed="true"]{background:var(--no);border-color:var(--no);color:var(--bg)}
.empty{font-size:.9rem;color:var(--muted);text-align:center;padding:30px 0}
/* Summary */
h2{font-size:1.02rem;margin:18px 0 6px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rows li{display:flex;align-items:center;gap:8px;font-size:.86rem;border-bottom:1px solid var(--line);padding:3px 0}
.rows li span{flex:1;min-width:0;overflow-wrap:anywhere}
.rows .yn{grid-template-columns:repeat(3,38px);margin:0}
.rows .yn button{padding:6px 0;font-size:.74rem}
.sync{font-family:var(--f-mono);font-size:.66rem;color:var(--yes);margin:0 0 8px;min-height:1em}
.sync.off{color:var(--no)}
.warn{font-size:.84rem;color:var(--no);margin:6px 0}
.ok{font-size:.84rem;color:var(--yes);margin:6px 0}
/* Finalize: the panel on Done, and a finalized deck's locked buttons */
.fin{border:2px solid var(--accent);border-radius:12px;padding:10px 12px;margin:10px 0}
.fin h2{margin:0 0 4px}.fin p{margin:4px 0;font-size:.86rem}
.fin.done{border-color:var(--yes)}
.locked .yn button{pointer-events:none;opacity:.55}
pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:.7rem;background:var(--surface);border-radius:8px;padding:8px;margin:8px 0;max-height:180px;overflow:auto}
/* Bottom-left controls */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;z-index:5}
.foot button{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:9px 14px;font-family:var(--f-mono);font-size:.82rem;flex:none}
.foot button:disabled{opacity:.4}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;z-index:50}
#zoom.on{display:flex}
#zoom img{max-width:min(92vw,488px);max-height:70vh;border-radius:4.75%/3.5%}
#zoom p{color:#ece8dd;font-size:.84rem;max-width:488px;margin:0}
#zoom a{color:#e8b44a}
#zoom button{background:#e8b44a;color:#14161a;border:0;border-radius:999px;padding:8px 16px}
</style>
</head>
<body>
<main id="front">
  <h1>Approve theme picks</h1>
  <p class="sub">Yes, maybe or no on each card, two per row. Pick a deck.</p>
  <p class="sync" data-sync></p>
  <ul class="decks" id="decks"></ul>
</main>
<main id="rev" hidden>
  <h1 id="rt"></h1>
  <p class="sub" id="rs"></p>
  <div class="tally" id="tally"></div>
  <p class="sync" data-sync></p>
  <div class="tabs" id="tabs"><button data-p="adds">Adds</button><button data-p="cuts">Cuts</button><button data-p="lands">Lands</button><button data-p="tutors">Tutors</button><button data-p="gcs" aria-label="Game Changers">GCs</button><button data-p="wins">Wincons</button><button data-p="maybes">Maybes</button><button data-p="sum">Done</button></div>
  <div id="stage"></div>
</main>
<div class="foot" id="foot" hidden><button id="back" type="button">‹ Decks</button><button id="undo" type="button">Undo</button></div>
<div id="zoom" role="dialog" aria-modal="true" aria-label="Card"><img alt=""><p></p><button type="button">Close</button></div>
<script>
const $=id=>document.getElementById(id), E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>Math.round(v*100)+'%';
// Phases: adds (15), cuts (15), lands (10 nonbasics for 10 basics), then three lists with no target count (Nov 21,
// 2026): every tutor, Game Changer and alternate wincon in the deck's colors that isn't in the box (theme_extras.py),
// most played with the commander first; then maybes (everything marked maybe) and the summary. x marks the extras.
const PH={adds:{p:'a:',k:'adds',goal:15,word:'add',next:'cuts'},cuts:{p:'c:',k:'cuts',goal:15,word:'cut',next:'lands'},lands:{p:'l:',k:'lands',goal:10,word:'land',next:'tutors'},
  tutors:{p:'t:',k:'tutors',word:'tutor',next:'gcs',x:1,h:'Tutors',what:'every tutor for a nonland card'},
  gcs:{p:'g:',k:'gcs',word:'Game Changer',next:'wins',x:1,h:'Game Changers',what:'every Game Changer'},
  wins:{p:'w:',k:'wins',word:'wincon',next:'maybes',x:1,h:'Wincons',what:'alt wins and the 40 most-played finishers'}};
let decks=[], D=null, S=null, phase='adds', pos={adds:0,cuts:0,lands:0,tutors:0,gcs:0,wins:0}, snap=[];
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const key=s=>'theme-review-'+s;
// Answers live on the shared table (Firebase, under tables/ like Commander Life), so they follow the user to any phone
// and Claude can read them. localStorage is only this phone's cache for when the table can't be reached. Each answer
// is one PATCH; writes wait in a queue (kept in localStorage) until the table takes them, so an offline tap isn't lost.
// Card names can hold / or . (split cards), which Firebase keys can't, so keys are %-escaped.
const DB='https://commander-life-39708-default-rtdb.firebaseio.com/tables/t7q2xm4k-theme';
const enc=k=>k.replace(/[.$#\[\]\/%]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0'));
const dec=k=>k.replace(/%([0-9A-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
const decD=o=>{const d={};for(const k in o||{})d[dec(k)]=o[k];return d};
let remote=null;   // the whole table's answers from the last pull, or null when it couldn't be reached
function send(path,body){const q=store.get('theme-review-queue')||[];q.push([path,body]);store.set('theme-review-queue',q);flush()}
let flushing=null;
// One flush at a time; `finally` clears the flag only after it's set (an empty queue finishes synchronously otherwise).
function flush(){if(!flushing)flushing=(async()=>{
  for(;;){const q=store.get('theme-review-queue')||[];if(!q.length)break;const [path,body]=q[0];
    try{const r=await fetch(DB+'/'+path+'.json',{method:'PATCH',body:JSON.stringify(body)});if(!r.ok)throw 0}catch(e){showSync(false);break}
    const q2=store.get('theme-review-queue')||[];q2.shift();store.set('theme-review-queue',q2)}
  const left=(store.get('theme-review-queue')||[]).length;if(!left)showSync(true)})().finally(()=>{flushing=null});return flushing}
async function pull(){await flush();try{const r=await fetch(DB+'.json',{cache:'no-store'});if(!r.ok)throw 0;remote=(await r.json())||{};showSync(true)}catch(e){remote=null;showSync(false)}return remote}
function showSync(ok){const n=(store.get('theme-review-queue')||[]).length, good=ok&&!n;
  for(const el of document.querySelectorAll('[data-sync]')){el.textContent=good?'✓ Synced to every phone':'Offline: saved here'+(n?`, ${n} to send`:'');el.classList.toggle('off',!good)}}
// Answers made on a phone before they were shared: send this phone's ones the table doesn't have, once per deck.
function migrate(slug){
  if(!remote||store.get('theme-review-up-'+slug))return;
  const s=store.get(key(slug)), rd=(remote[slug]&&remote[slug].d)||{}, up={};
  for(const k in (s&&s.d)||{})if(!(enc(k) in rd))up[enc(k)]=s.d[k];
  if(Object.keys(up).length){send(slug+'/d',up);remote[slug]={...(remote[slug]||{}),d:{...rd,...up}}}
  store.set('theme-review-up-'+slug,1)}
// One deck's answers: the table's when it was reached, else this phone's cache. Undo history stays per phone.
function answers(slug){const s=store.get(key(slug));
  if(remote){const R=remote[slug]||{};return R.d?{...(s||{h:[]}),d:decD(R.d),h:(s&&s.h)||[],t:R.t||(s&&s.t)}:null}
  return s}
const list=p=>D[PH[p].k]||[];
// Scroll view (Nov 22, 2026, the user's ask; tried on Chaos Incarnate, then every deck): each section is one column of
// cards, two per row, scrolled down instead of paged two at a time. Answering a card changes only that card, so the page
// never jumps. The old two-at-a-time paging stays below for any slug put in PAGED.
const PAGED=new Set([]);
const scroll=()=>!!D&&!PAGED.has(D.slug);
// Finalize (Nov 21, 2026): once a deck is finalized, its yeses and maybes (adds, lands, tutors, GCs, wincons; no count
// limit) are written to the table as <slug>/fin, the buy list page (../buylist.html) lists them by deck, and the deck's
// answers lock until it is reopened. fin lives beside d, so every phone sees it; the phone that finalized keeps a copy
// until the queue sends it.
const finOf=slug=>(remote&&remote[slug]&&remote[slug].fin)||store.get('theme-fin-'+slug)||null;
const KIND={a:'Add',l:'Land',t:'Tutor',g:'Game Changer',w:'Wincon'};
function buyList(){const m={};
  for(const p of ['adds','lands','tutors','gcs','wins'])for(const x of list(p)){const v=S.d[PH[p].p+x.n];if(v!=='y'&&v!=='m')continue;
    const o=m[x.n]||(m[x.n]={n:x.n,k:[],a:'m',usd:x.usd||null,url:x.url,img:x.img});o.k.push(KIND[PH[p].p[0]]);if(v==='y')o.a='y'}
  return Object.values(m).sort((a,b)=>(a.a===b.a?0:a.a==='y'?-1:1)||a.n.localeCompare(b.n))}
const item=k=>{for(const p in PH){if(k.startsWith(PH[p].p)){return list(p).find(x=>PH[p].p+x.n===k)}}};

// Front: every deck in the user's order. A deck not built yet gives a line to send Claude, so the next run is one paste.
async function front(){
  $('rev').hidden=true;$('foot').hidden=true;$('front').hidden=false;
  if(!decks.length){try{decks=await (await fetch('index.json',{cache:'no-store'})).json()}catch(e){$('decks').innerHTML='<li class="empty">Couldn\'t load the deck list.</li>';return}}
  await pull();for(const d of decks)if(d.ready)migrate(d.slug);
  $('decks').innerHTML=decks.map((d,i)=>{
    const s=answers(d.slug), c=s?count(s):null;
    const f=finOf(d.slug);
    const st=f?`✓ Finalized ${new Date(f.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${Object.keys(f.cards||{}).length} on the buy list`:d.ready?(c&&c.total?`In ${c.a.y}/15 · out ${c.c.y}/15 · lands ${c.l.y}/10${c.t.y+c.g.y+c.w.y?` · tutors ${c.t.y} · GCs ${c.g.y} · wins ${c.w.y}`:''} · ${c.left} to see`:'Ready to review'):d.direction?'Not built yet: tap to ask Claude':'No direction chosen yet: tap to ask Claude';
    return `<li><button class="deck${d.ready?'':' off'}" data-i="${i}"><img src="${E(d.img.replace('/normal/','/small/'))}" alt="" loading="lazy" referrerpolicy="no-referrer"><span class="t"><b>${E(d.name)}</b><span class="d">${E(d.cmd)}${d.direction?' · '+E(d.direction):''}</span><span class="st">${st}</span></span></button><div class="ask" id="ask${i}" hidden></div></li>`}).join('');
  scrollTo(0,0);
}
$('decks').addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');if(cp){copy(cp.dataset.copy,cp);return}
  const b=e.target.closest('.deck');if(!b)return;const d=decks[+b.dataset.i];
  if(d.ready){open(d);return}
  const a=$('ask'+b.dataset.i), msg=d.direction?`Theme picks next: ${d.name} (${d.direction}).`:`Theme picks next: ${d.name}. Its direction isn't picked yet; show me the options from decks/angles.html.`;
  a.innerHTML=`<p>${d.direction?'Not built yet. Send Claude this to build it next:':'No direction chosen yet. Send Claude this to choose one:'}</p><q>${E(msg)}</q><button class="pill" data-copy="${E(msg)}">Copy</button>`;
  a.hidden=!a.hidden;
});
async function copy(t,btn){try{await navigator.clipboard.writeText(t);btn.textContent='Copied'}catch(e){const r=document.createRange();const el=btn.previousElementSibling;r.selectNodeContents(el);getSelection().removeAllRanges();getSelection().addRange(r);btn.textContent='Selected: copy it'}}

// Review: one deck.
async function open(d){
  try{D=await (await fetch(d.slug+'.json',{cache:'no-store'})).json()}catch(e){alert('Couldn\'t load '+d.name);return}
  await pull();migrate(d.slug);
  S=answers(d.slug);
  if(!S){S={d:{},h:[]};   // no answers anywhere yet: start from the list Claude locked in, if there is one
    try{const r=await fetch(d.slug+'-review.json',{cache:'no-store'});if(r.ok){const L=await r.json();
      for(const [k,p,v] of [['in','a:','y'],['out','c:','y'],['lands','l:','y'],['maybe_in','a:','m'],['maybe_out','c:','m'],['maybe_lands','l:','m']])for(const n of L[k]||[])S.d[p+n]=v;
      for(const p of ['adds','cuts','lands'])for(const x of list(p))if(!S.d[PH[p].p+x.n])S.d[PH[p].p+x.n]='n';   // the extras stay open
      const up={};for(const k in S.d)up[enc(k)]=S.d[k];send(d.slug+'/d',up)}}catch(e){}}
  D.name=d.name;const t=Object.keys(PH).reduce((n,p)=>n+list(p).length,0);
  if(!remote||!remote[d.slug]||remote[d.slug].t!==t)send(d.slug,{t});   // so a new phone's deck list can say how many are left
  S.t=t;
  $('rt').textContent=d.name+': '+D.direction;
  $('rs').innerHTML=`${E(D.cmd)} · <a href="${E(D.slug)}.html">full page and sources ›</a>`;
  for(const p in PH)pos[p]=openFrom(p,0);
  go(S.p||'adds');
  $('front').hidden=true;$('rev').hidden=false;$('foot').hidden=false;
}
function openFrom(p,from){const L=list(p);for(let i=from;i<L.length;i++)if(!S.d[PH[p].p+L[i].n])return i-i%2;return L.length}
function count(s){const c={total:0};for(const p in PH)c[PH[p].p[0]]={y:0,m:0};for(const k in s.d){c.total++;const g=c[k[0]];if(g&&g[s.d[k]]!=null)g[s.d[k]]++}
  c.m=Object.values(PH).reduce((n,P)=>n+c[P.p[0]].m,0);c.left=Math.max(0,(s.t||0)-c.total);return c}
// Game Changers in the deck as answered so far: the box's, plus every yes (adds, lands, tutors, the GC tab) that is one.
function gcIn(){const n=new Set(D.box_gcs||[]);for(const k in S.d){const x=S.d[k]==='y'&&k[1]===':'&&'altg'.includes(k[0])&&item(k);if(x&&x.gc)n.add(x.n)}return n}
function save(){S.p=phase;store.set(key(D.slug),S)}
function go(p){phase=p;if(p==='maybes')snap=Object.keys(S.d).filter(k=>S.d[k]==='m'&&item(k));save();render();scrollTo(0,0)}

function tally(c){const g=gcIn().size;
  $('tally').innerHTML=`<span class="${c.a.y>=15?'full':''}">In ${c.a.y}/15</span><span class="${c.c.y>=15?'full':''}">Out ${c.c.y}/15</span><span class="${c.l.y>=10?'full':''}">Lands ${c.l.y}/10</span><span>Tutors ${c.t.y}</span><span class="${g>3?'over':''}">GCs ${g}/3</span><span>Wins ${c.w.y}</span><span>Maybe ${c.m}</span>`}
function render(){
  const c=count(S);tally(c);
  for(const b of $('tabs').children)b.setAttribute('aria-pressed',b.dataset.p===phase);
  const F=finOf(D.slug);$('rev').classList.toggle('locked',!!F);
  $('undo').disabled=!S.h.length||!!F;
  if(phase==='sum')return summary(c);
  if(F)setTimeout(()=>$('stage').insertAdjacentHTML('afterbegin',`<p class="where">✓ Finalized: answers locked. Reopen it on Done to change them.</p>`));
  if(phase==='maybes')return maybes();
  const P=PH[phase], L=list(phase), i=pos[phase];
  const nextLabel={cuts:'On to the cuts',lands:'On to the lands',tutors:'On to the tutors',gcs:'On to the Game Changers',wins:'On to the wincons',maybes:'Go over the maybes'}[P.next];
  if(scroll())return all(P,L,nextLabel);
  if(i>=L.length){$('stage').innerHTML=`<p class="empty">That's every ${P.word}.</p><p style="text-align:center"><button class="pill" data-go="${P.next}">${nextLabel}</button></p>`;return}
  if(P.x)return extra(P,L,i,nextLabel);
  const full=c[P.p[0]].y>=P.goal, topN=L.filter(x=>x.top).length;
  $('stage').innerHTML=(phase==='lands'?`<p class="where">Each replaces a basic (${E(D.basics||'')}).</p>`:'')
    +(full?`<div class="note"><span>${P.goal} ${phase==='adds'?'in':phase==='cuts'?'out':'lands'}.</span><button class="pill" data-go="${P.next}">Next ›</button></div>`:'')
    +`<p class="where">${i+1}${L[i+1]?'–'+(i+2):''} of ${L.length} · ${i<topN?'picked':'options'}</p>`
    +`<div class="pair" id="pair">${L.slice(i,i+2).map(x=>tile(x,P.p)).join('')}</div>`;
}
// Tutors, Game Changers, Wincons: no target count, just yes, maybe or no on each, most played with the commander first.
function extra(P,L,i,nextLabel){
  const box=D['box_'+P.k]||[], g=gcIn();
  const head=`<p class="where">${E(P.what[0].toUpperCase()+P.what.slice(1))} not in the box, most played with ${E(D.cmd.split(',')[0])} first.${box.length?' In the box: '+E(box.join(', '))+'.':''}`
    +(P.k==='gcs'?` Deck: ${g.size} of 3${g.size?' ('+E([...g].join(', '))+')':''}.`:'')+`</p>`;
  if(!L.length){$('stage').innerHTML=head+`<p class="empty">None in these colors.</p><p style="text-align:center"><button class="pill" data-go="${P.next}">${nextLabel}</button></p>`;return}
  if(i>=L.length){$('stage').innerHTML=head+`<p class="empty">That's every ${P.word}.</p><p style="text-align:center"><button class="pill" data-go="${P.next}">${nextLabel}</button></p>`;return}
  $('stage').innerHTML=head+`<p class="where">${i+1}${L[i+1]?'–'+(i+2):''} of ${L.length} · <button class="pill ghost" data-go="${P.next}" style="padding:3px 10px;font-size:.72rem">Skip ›</button></p>`
    +`<div class="pair" id="pair">${L.slice(i,i+2).map(x=>tile(x,P.p)).join('')}</div>`;
}
// Scroll view: the whole section, two per row. Adds, cuts and lands split into the picks and the options.
function all(P,L,nextLabel){
  const box=P.x?D['box_'+P.k]||[]:[], g=gcIn(), n=L.filter(x=>S.d[P.p+x.n]).length;
  const head=(phase==='lands'?`<p class="where">Each replaces a basic (${E(D.basics||'')}).</p>`:'')
    +(P.x?`<p class="where">${E(P.what[0].toUpperCase()+P.what.slice(1))} not in the box, most played with ${E(D.cmd.split(',')[0])} first.${box.length?' In the box: '+E(box.join(', '))+'.':''}`+(P.k==='gcs'?` Deck: ${g.size} of 3${g.size?' ('+E([...g].join(', '))+')':''}.`:'')+`</p>`:'')
    +`<p class="where" id="seen">${n} of ${L.length} answered · scroll down</p>`;
  const top=P.x?[]:L.filter(x=>x.top), rest=P.x?L:L.filter(x=>!x.top);
  const lab=phase==='lands'?'The 10 picked':'The 15 picked';
  const body=L.length?`<div class="pair all">${top.length?`<p class="grp">${lab}</p>`:''}${top.map(x=>tile(x,P.p)).join('')}${top.length&&rest.length?`<p class="grp">More options (${rest.length})</p>`:''}${rest.map(x=>tile(x,P.p)).join('')}</div>`
    :`<p class="empty">None in these colors.</p>`;
  $('stage').innerHTML=head+body+`<p style="text-align:center;margin-top:18px"><button class="pill" data-go="${P.next}">${nextLabel} ›</button></p>`;
}
// Scroll view: after an answer, repaint that card's buttons and the counts, nothing else.
function paintTile(k){const v=S.d[k]||'';
  for(const el of document.querySelectorAll('#stage .card[data-k]')){if(el.dataset.k!==k)continue;
    el.className='card '+v;for(const b of el.querySelectorAll('[data-v]'))b.setAttribute('aria-pressed',b.dataset.v===v)}
  const c=count(S);tally(c);$('undo').disabled=!S.h.length;
  const P=PH[phase];if(P&&$('seen')){const L=list(phase);$('seen').textContent=`${L.filter(x=>S.d[P.p+x.n]).length} of ${L.length} answered · scroll down`}}
// Maybes: every card marked maybe when the tab opened, two to a row, so they can be settled in one place.
function maybes(){
  if(!snap.length){$('stage').innerHTML=`<p class="empty">No maybes.</p><p style="text-align:center"><button class="pill" data-go="sum">See the summary</button></p>`;return}
  const grp=[['Maybe in','a:'],['Maybe out','c:'],['Maybe lands','l:'],['Maybe tutors','t:'],['Maybe Game Changers','g:'],['Maybe wincons','w:']];
  $('stage').innerHTML=grp.map(([h,p])=>{const ks=snap.filter(k=>k.startsWith(p));return ks.length?`<h2>${h} (${ks.length})</h2><div class="pair">${ks.map(k=>tile(item(k),p)).join('')}</div>`:''}).join('')
    +`<p style="text-align:center;margin-top:16px"><button class="pill" data-go="sum">See the summary</button></p>`;
}
function tile(x,P){
  const v=S.d[P+x.n]||'', add=P!=='c:', ex='tgw'.includes(P[0]);
  // One line of what it does, one of numbers: play share (theme decks, or all of the commander's for the extras), guides, price.
  const $p=x.usd?' · $'+x.usd.toFixed(x.usd<10?2:0):'';
  const info=ex?`<span class="job">${E(x.job)}</span><span class="num">${x.e?pct(x.e):'<5%'} of ${E(D.cmd.split(',')[0])} decks${$p}</span>`
    :add?`<span class="job">${E(x.job)}</span><span class="num">${pct(x.a)} of theme decks${x.src.length?' · '+x.src.length+' guide'+(x.src.length>1?'s':''):''}${$p}</span>`
    :`<span class="job">Cut by ${pct(x.out)} of theme decks</span>`;
  // Chips: where the card already stands, what in the deck it ties to (the theme test it passes), and GC.
  const chips=(ex?[x.pick?'<i class="top">In the 15</i>':'',x.theme?`<i class="top">Fits: ${E(x.theme)}</i>`:'',x.gc&&P!=='g:'?'<i class="gc">GC</i>':'']
    :[x.top?`<i class="top">${P==='l:'?'In the 10':'In the 15'}</i>`:'',P==='l:'&&x.theme?'<i class="top">On theme</i>':'',x.gc?'<i class="gc">GC</i>':'']).join('');
  return `<div class="card ${v}" data-k="${E(P+x.n)}"><button class="zb" type="button" aria-label="Zoom ${E(x.n)}"><img src="${E(x.img)}" alt="${E(x.n)}" referrerpolicy="no-referrer"${scroll()?' loading="lazy"':''}></button>
    <span class="nm">${E(x.n)}</span>${info}${chips?`<span class="chips">${chips}</span>`:''}
    <div class="yn">${btn('y','Yes',v)}${btn('m','Maybe',v)}${btn('n','No',v)}</div></div>`;
}
const btn=(c,l,v)=>`<button class="${c}" data-v="${c}" aria-pressed="${v===c}">${l}</button>`;

function decide(k,v){
  if(finOf(D.slug))return;   // finalized: reopen it on Done first
  S.h.push([k,S.d[k]||null]);S.d[k]=v;save();send(D.slug+'/d',{[enc(k)]:v});
  if(scroll()&&PH[phase]){paintTile(k);return}
  if(!PH[phase]){render();return}
  const P=PH[phase],L=list(phase),i=pos[phase];
  const done=L.slice(i,i+2).every(x=>S.d[P.p+x.n]);
  render();
  if(done){const pr=$('pair');if(pr)pr.classList.add('fade');setTimeout(()=>{pos[phase]=Math.max(pos[phase],openFrom(phase,i+2));render();scrollTo(0,0)},260)}
}
$('undo').onclick=()=>{if(finOf(D.slug))return;const h=S.h.pop();if(!h)return;const [k,prev]=h;if(prev)S.d[k]=prev;else delete S.d[k];send(D.slug+'/d',{[enc(k)]:prev||null});
  const p=Object.keys(PH).find(p=>k.startsWith(PH[p].p)),ix=list(p).findIndex(x=>PH[p].p+x.n===k), was=phase;
  if(PH[phase]){phase=p;pos[p]=ix-ix%2}save();
  if(scroll()&&PH[phase]&&was===p&&document.querySelector('#stage .card')){paintTile(k);return}
  render();
  if(scroll()&&PH[phase]){const el=[...document.querySelectorAll('#stage .card[data-k]')].find(el=>el.dataset.k===k);if(el)el.scrollIntoView({block:'center'})}};
$('back').onclick=()=>{if(D)save();D=null;front()};

function summary(c){
  const row=(x,P)=>`<li data-k="${E(P+x.n)}"><span>${E(x.n)}</span><div class="yn">${btn('y','Y',S.d[P+x.n])}${btn('m','?',S.d[P+x.n])}${btn('n','N',S.d[P+x.n])}</div></li>`;
  const grp=(p,v)=>list(p).filter(x=>S.d[PH[p].p+x.n]===v);
  const ai=grp('adds','y'),co=grp('cuts','y'),li=grp('lands','y'),am=grp('adds','m'),cm=grp('cuts','m'),lm=grp('lands','m');
  const ti=grp('tutors','y'),gi=grp('gcs','y'),wi=grp('wins','y'),tm=grp('tutors','m'),gm=grp('gcs','m'),wm=grp('wins','m'),gset=gcIn();
  const unseen=p=>list(p).filter(x=>x.top&&!S.d[PH[p].p+x.n]).length;
  const msgs=[];
  if(c.a.y!==c.c.y)msgs.push(`${c.a.y} in, ${c.c.y} out: should match.`);
  if(unseen('adds')||unseen('cuts')||unseen('lands'))msgs.push(`Unseen: ${unseen('adds')} adds, ${unseen('cuts')} cuts, ${unseen('lands')} lands.`);
  if(gset.size>3)msgs.push(`${gset.size} GCs (${[...gset].join(', ')}): Bracket 3 allows 3.`);
  if(c.t.y+c.g.y+c.w.y)msgs.push(`Each yes on a tutor, GC or wincon needs its own cut.`);
  if(c.m)msgs.push(`${c.m} maybe${c.m>1?'s':''} open.`);
  const L=a=>a.map(x=>x.n).join('; ');
  const text=`Theme picks reviewed: ${D.name} (${D.direction})\nIN (${ai.length}): ${L(ai)||'none'}\nOUT (${co.length}): ${L(co)||'none'}\nLANDS (${li.length}, each for a basic): ${L(li)||'none'}`
    +`\nTUTORS (${ti.length}): ${L(ti)||'none'}\nGAME CHANGERS (${gi.length}): ${L(gi)||'none'}\nWINCONS (${wi.length}): ${L(wi)||'none'}`
    +(am.length?`\nMAYBE IN (${am.length}): ${L(am)}`:'')+(cm.length?`\nMAYBE OUT (${cm.length}): ${L(cm)}`:'')+(lm.length?`\nMAYBE LANDS (${lm.length}): ${L(lm)}`:'')
    +(tm.length?`\nMAYBE TUTORS (${tm.length}): ${L(tm)}`:'')+(gm.length?`\nMAYBE GAME CHANGERS (${gm.length}): ${L(gm)}`:'')+(wm.length?`\nMAYBE WINCONS (${wm.length}): ${L(wm)}`:'');
  const F=finOf(D.slug), buy=buyList(), by=t=>buy.filter(x=>x.k.includes(t)).length, left=unseen('adds')+unseen('cuts')+unseen('lands');
  const cost=buy.reduce((t,x)=>t+(x.usd||0),0), ny=buy.filter(x=>x.a==='y').length;
  const finBox=F?`<div class="fin done"><h2>✓ Finalized ${E(new Date(F.at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}))}</h2><p>${Object.keys(F.cards||{}).length} cards on the buy list for ${E(D.name)}. Answers are locked.</p><p><a class="pill" href="../buylist.html#${E(D.slug)}" style="text-decoration:none;display:inline-block">Buy list ›</a> <button class="pill ghost" id="reopen">Reopen</button></p></div>`
    :`<div class="fin"><h2>Next: Final review</h2><p>${left?`Answer the rest of the picks first (${left} left), then go`:'Go'} over every yes and maybe again in Final review, with the deck's tutors, basics swapped, spells, Game Changers and combos counted live. Finalize is there now.</p><p><a class="pill" href="final.html" style="text-decoration:none;display:inline-block">Final review ›</a></p></div>`;
  $('stage').innerHTML=finBox+(msgs.length?msgs.map(m=>`<p class="warn">${E(m)}</p>`).join(''):`<p class="ok">${c.a.y} in, ${c.c.y} out, ${c.l.y} lands, ${c.t.y} tutors, ${c.g.y} Game Changers, ${c.w.y} wincons. All settled.</p>`)
    +`<p class="where">Tell Claude "lock in ${E(D.name)}", or copy:</p><pre id="out">${E(text)}</pre><p><button class="pill" data-copy-out>Copy for Claude</button></p>`
    +[['In',ai,'a:'],['Out',co,'c:'],['Lands (for basics)',li,'l:'],['Tutors',ti,'t:'],['Game Changers',gi,'g:'],['Wincons',wi,'w:'],['Maybe in',am,'a:'],['Maybe out',cm,'c:'],['Maybe lands',lm,'l:'],['Maybe tutors',tm,'t:'],['Maybe Game Changers',gm,'g:'],['Maybe wincons',wm,'w:']].filter(g=>g[1].length||!g[0].startsWith('Maybe'))
      .map(([h,Ls,P])=>`<h2>${h} (${Ls.length})</h2><ul class="rows">${Ls.map(x=>row(x,P)).join('')||'<li><span class="st">none yet</span></li>'}</ul>`).join('')
    +`<h2>Start over</h2><p><button class="pill ghost" id="reset">Clear this deck's answers</button></p>`;
}
document.addEventListener('click',e=>{
  if($('rev').hidden)return;
  const z=e.target.closest('.zb');if(z){const k=z.closest('[data-k]').dataset.k;zoom(item(k),k[0]);return}
  const v=e.target.closest('[data-v]');if(v){decide(v.closest('[data-k]').dataset.k,v.dataset.v);return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const t=e.target.closest('#tabs button');if(t){go(t.dataset.p);return}
  if(e.target.closest('[data-copy-out]')){copy($('out').textContent,e.target);return}
  const fz=e.target.closest('#finalize');
  if(fz){if(!fz.dataset.sure){fz.dataset.sure=1;fz.textContent='Tap again to finalize';return}
    const cards={};for(const x of buyList())cards[enc(x.n)]=x;
    const F={at:Date.now(),deck:D.name,cmd:D.cmd,direction:D.direction,cards,out:list('cuts').filter(x=>S.d['c:'+x.n]==='y').map(x=>x.n)};
    store.set('theme-fin-'+D.slug,F);if(remote)(remote[D.slug]=remote[D.slug]||{}).fin=F;send(D.slug,{fin:F});render();return}
  const ro=e.target.closest('#reopen');
  if(ro){if(!ro.dataset.sure){ro.dataset.sure=1;ro.textContent='Tap again: takes it off the buy list';return}
    store.set('theme-fin-'+D.slug,null);if(remote&&remote[D.slug])remote[D.slug].fin=null;send(D.slug,{fin:null});render();return}
  const r=e.target.closest('#reset');if(r&&!finOf(D.slug)){if(r.dataset.sure){S={d:{},h:[],t:S.t};send(D.slug,{d:null});for(const p in PH)pos[p]=0;go('adds')}else{r.dataset.sure=1;r.textContent='Tap again to clear'}}
});
function zoom(x,p){const Z=$('zoom');Z.querySelector('img').src=x.img;Z.querySelector('img').alt=x.n;
  const add='a' in x;
  // The zoom holds the detail the tiles leave out: both shares, which guides add it, and what the card ties to.
  const cmd=D.cmd.split(',')[0];
  Z.querySelector('p').innerHTML=E('tgw'.includes(p)?`${x.job}. ${x.e?pct(x.e):'Under 5%'} of EDHREC's ${(D.cedn||0).toLocaleString()} ${cmd} decks.`+(x.theme?` Fits the theme: ${x.theme}.`:'')+(x.gc?' Game Changer.':'')
    :add?`${x.job}. ${pct(x.a)} of ${D.nd.toLocaleString()} Archidekt theme decks, ${pct(x.b)} of EDHREC's ${D.edn.toLocaleString()}. `+(x.src.length?'Guides: '+x.src.join(', ')+'.':'No guide adds it.')
    :`Cut by ${pct(x.out)} of ${D.nd.toLocaleString()} Archidekt theme decks; EDHREC cut ${pct(x.ed)}.`)+`<br><a href="${E(x.url)}" target="_blank" rel="noopener">${E(x.n)} on Scryfall (text, prices) ↗</a>`;
  Z.classList.add('on')}
$('zoom').addEventListener('click',e=>{if(!e.target.closest('a'))$('zoom').classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('zoom').classList.remove('on')});
front();
</script>
</body>
</html>
