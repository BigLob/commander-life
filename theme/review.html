<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Approve Theme Picks</title>
<!-- app-board-link: the installed app has no address bar, so every page links the board's manifest (installing from here still opens the board) and, inside the app, shows a Board button back to it. -->
<link rel="manifest" href="/commander-life/app/manifest.json">
<script>addEventListener('DOMContentLoaded',function(){if(!(matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches||navigator.standalone))return;var a=document.createElement('a');a.href='/commander-life/';a.textContent='\u{1F0CF} Board';a.setAttribute('style','position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:9999;padding:9px 14px;border-radius:999px;background:#0c0e11;color:#f3e3b0;border:1px solid #c9a24a;font:600 15px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.5)');var b=document.getElementById('back');if(b){a.style.position='static';a.style.flex='none';b.after(a)}else document.body.appendChild(a)})</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Approve the theme picks two cards at a time. Front: which deck next. Then the adds (the 15, then the options), the
   cuts (the 15, then more), the land version (10 nonbasics for 10 basics), the maybes in one grid, and a summary to
   copy back to Claude. Decisions stay on this phone (localStorage) until
   they're sent; a deck whose list Claude has locked in (theme/<slug>-review.json) starts from that.
   Controls sit bottom-left (the user is left-handed). Same tokens as the theme pages. */
:root{--bg:#f1efe9;--surface:#e4e1d8;--fg:#1d1b17;--muted:#6a665c;--accent:#9a5a00;--line:#cfcabd;--yes:#2e7d32;--no:#b3261e;--maybe:#8a6d00;
--f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;--yes:#7bd88f;--no:#ff8a80;--maybe:#e8c54a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;--yes:#7bd88f;--no:#ff8a80;--maybe:#e8c54a;color-scheme:dark}
html{background:var(--bg)}
body{margin:0 auto;max-width:620px;background:var(--bg);color:var(--fg);font-family:var(--f-display);line-height:1.4;padding-block:14px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
a{color:var(--accent)}
h1{font-size:1.35rem;margin:0 0 2px;text-wrap:balance}
.sub{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
/* Front: the deck list */
.decks{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.deck{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.deck img{width:54px;aspect-ratio:488/680;border-radius:4px;flex:none;object-fit:cover;background:var(--bg)}
.deck .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.deck b{font-size:.98rem}
.deck .d{font-size:.8rem;color:var(--muted)}
.st{font-family:var(--f-mono);font-size:.68rem;color:var(--accent)}
.deck.off{opacity:.62}
.ask{margin:6px 0 0;font-size:.84rem;border:1px dashed var(--accent);border-radius:10px;padding:8px 10px}
.ask p{margin:0 0 6px}
.ask q{display:block;font-family:var(--f-mono);font-size:.76rem;margin:0 0 8px}
.pill{background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.85rem}
.pill.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
/* Review */
.tally{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}
.tally span{font-family:var(--f-mono);font-size:.66rem;border:1px solid var(--line);border-radius:999px;padding:3px 6px}
.tally .full{border-color:var(--yes);color:var(--yes)}
.tabs{display:flex;gap:5px;margin:0 0 10px}
.tabs button{flex:1;min-width:0;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 2px;font-size:.78rem}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.where{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin:0 0 8px}
.note{font-size:.84rem;border:1px solid var(--yes);border-radius:10px;padding:8px 10px;margin:0 0 10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;transition:opacity .18s}
.pair.fade{opacity:0}
.card{display:flex;flex-direction:column;gap:4px;min-width:0}
.zb{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:4.75%/3.5%;overflow:hidden;outline-offset:2px}
.zb img{display:block;width:100%;height:auto;aspect-ratio:488/680;background:var(--surface)}
.card.y .zb{outline:3px solid var(--yes)}.card.n .zb{outline:3px solid var(--no);opacity:.55}.card.m .zb{outline:3px solid var(--maybe)}
.nm{font-weight:700;font-size:.86rem;line-height:1.2;overflow-wrap:anywhere}
.job{font-size:.72rem;color:var(--accent);line-height:1.2}
.num{font-family:var(--f-mono);font-size:.64rem;color:var(--muted);line-height:1.3}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips i{font-style:normal;font-family:var(--f-mono);font-size:.6rem;border:1px solid var(--line);border-radius:999px;padding:1px 6px}
.chips i.top{border-color:var(--accent);color:var(--accent)}.chips i.gc{border-color:var(--no);color:var(--no)}
.yn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:2px}
.yn button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 0;font-size:.8rem;font-weight:700}
.yn .y[aria-pressed="true"]{background:var(--yes);border-color:var(--yes);color:var(--bg)}
.yn .m[aria-pressed="true"]{background:var(--maybe);border-color:var(--maybe);color:var(--bg)}
.yn .n[aria-pressed="true"]{background:var(--no);border-color:var(--no);color:var(--bg)}
.empty{font-size:.9rem;color:var(--muted);text-align:center;padding:30px 0}
/* Summary */
h2{font-size:1.02rem;margin:18px 0 6px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rows li{display:flex;align-items:center;gap:8px;font-size:.86rem;border-bottom:1px solid var(--line);padding:3px 0}
.rows li span{flex:1;min-width:0;overflow-wrap:anywhere}
.rows .yn{grid-template-columns:repeat(3,38px);margin:0}
.rows .yn button{padding:6px 0;font-size:.74rem}
.warn{font-size:.84rem;color:var(--no);margin:6px 0}
.ok{font-size:.84rem;color:var(--yes);margin:6px 0}
pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:.7rem;background:var(--surface);border-radius:8px;padding:8px;margin:8px 0;max-height:180px;overflow:auto}
/* Bottom-left controls */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;z-index:5}
.foot button{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:9px 14px;font-family:var(--f-mono);font-size:.82rem;flex:none}
.foot button:disabled{opacity:.4}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;z-index:50}
#zoom.on{display:flex}
#zoom img{max-width:min(92vw,488px);max-height:70vh;border-radius:4.75%/3.5%}
#zoom p{color:#ece8dd;font-size:.84rem;max-width:488px;margin:0}
#zoom a{color:#e8b44a}
#zoom button{background:#e8b44a;color:#14161a;border:0;border-radius:999px;padding:8px 16px}
</style>
</head>
<body>
<main id="front">
  <h1>Approve theme picks</h1>
  <p class="sub">Yes, maybe or no on each card, two at a time: the adds, the cuts, then a land version (10 nonbasics for 10 basics). Which deck next?</p>
  <ul class="decks" id="decks"></ul>
</main>
<main id="rev" hidden>
  <h1 id="rt"></h1>
  <p class="sub" id="rs"></p>
  <div class="tally" id="tally"></div>
  <div class="tabs" id="tabs"><button data-p="adds">Adds</button><button data-p="cuts">Cuts</button><button data-p="lands">Lands</button><button data-p="maybes">Maybes</button><button data-p="sum">Done</button></div>
  <div id="stage"></div>
</main>
<div class="foot" id="foot" hidden><button id="back" type="button">‹ Decks</button><button id="undo" type="button">Undo</button></div>
<div id="zoom" role="dialog" aria-modal="true" aria-label="Card"><img alt=""><p></p><button type="button">Close</button></div>
<script>
const $=id=>document.getElementById(id), E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>Math.round(v*100)+'%';
// Phases: adds (15), cuts (15), lands (10 nonbasics for 10 basics), maybes (everything marked maybe), summary.
const PH={adds:{p:'a:',k:'adds',goal:15,word:'add',next:'cuts'},cuts:{p:'c:',k:'cuts',goal:15,word:'cut',next:'lands'},lands:{p:'l:',k:'lands',goal:10,word:'land',next:'maybes'}};
let decks=[], D=null, S=null, phase='adds', pos={adds:0,cuts:0,lands:0}, snap=[];
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const key=s=>'theme-review-'+s;
const list=p=>D[PH[p].k]||[];
const item=k=>{for(const p in PH){if(k.startsWith(PH[p].p)){return list(p).find(x=>PH[p].p+x.n===k)}}};

// Front: every deck in the user's order. A deck not built yet gives a line to send Claude, so the next run is one paste.
async function front(){
  $('rev').hidden=true;$('foot').hidden=true;$('front').hidden=false;
  if(!decks.length){try{decks=await (await fetch('index.json',{cache:'no-store'})).json()}catch(e){$('decks').innerHTML='<li class="empty">Couldn\'t load the deck list.</li>';return}}
  $('decks').innerHTML=decks.map((d,i)=>{
    const s=store.get(key(d.slug)), c=s?count(s):null;
    const st=d.ready?(c&&c.total?`In ${c.a.y}/15 · out ${c.c.y}/15 · lands ${c.l.y}/10 · ${c.left} to see`:'Ready to review'):d.direction?'Not built yet: tap to ask Claude':'No direction chosen yet: tap to ask Claude';
    return `<li><button class="deck${d.ready?'':' off'}" data-i="${i}"><img src="${E(d.img.replace('/normal/','/small/'))}" alt="" loading="lazy" referrerpolicy="no-referrer"><span class="t"><b>${E(d.name)}</b><span class="d">${E(d.cmd)}${d.direction?' · '+E(d.direction):''}</span><span class="st">${st}</span></span></button><div class="ask" id="ask${i}" hidden></div></li>`}).join('');
  scrollTo(0,0);
}
$('decks').addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');if(cp){copy(cp.dataset.copy,cp);return}
  const b=e.target.closest('.deck');if(!b)return;const d=decks[+b.dataset.i];
  if(d.ready){open(d);return}
  const a=$('ask'+b.dataset.i), msg=d.direction?`Theme picks next: ${d.name} (${d.direction}).`:`Theme picks next: ${d.name}. Its direction isn't picked yet; show me the options from decks/angles.html.`;
  a.innerHTML=`<p>${d.direction?'Not built yet. Send Claude this to build it next:':'No direction chosen yet. Send Claude this to choose one:'}</p><q>${E(msg)}</q><button class="pill" data-copy="${E(msg)}">Copy</button>`;
  a.hidden=!a.hidden;
});
async function copy(t,btn){try{await navigator.clipboard.writeText(t);btn.textContent='Copied'}catch(e){const r=document.createRange();const el=btn.previousElementSibling;r.selectNodeContents(el);getSelection().removeAllRanges();getSelection().addRange(r);btn.textContent='Selected: copy it'}}

// Review: one deck.
async function open(d){
  try{D=await (await fetch(d.slug+'.json',{cache:'no-store'})).json()}catch(e){alert('Couldn\'t load '+d.name);return}
  S=store.get(key(d.slug));
  if(!S){S={d:{},h:[]};   // first time on this phone: start from the list Claude locked in, if there is one
    try{const r=await fetch(d.slug+'-review.json',{cache:'no-store'});if(r.ok){const L=await r.json();
      for(const [k,p,v] of [['in','a:','y'],['out','c:','y'],['lands','l:','y'],['maybe_in','a:','m'],['maybe_out','c:','m'],['maybe_lands','l:','m']])for(const n of L[k]||[])S.d[p+n]=v;
      for(const p in PH)for(const x of list(p))if(!S.d[PH[p].p+x.n])S.d[PH[p].p+x.n]='n'}}catch(e){}}
  D.name=d.name;S.t=D.adds.length+D.cuts.length+(D.lands||[]).length;
  $('rt').textContent=d.name+': '+D.direction;
  $('rs').innerHTML=`${E(D.cmd)} · ${D.nd.toLocaleString()} of ${D.n.toLocaleString()} Archidekt decks built this way · built ${E(D.date)} · <a href="${E(D.slug)}.html">full page and sources</a>`;
  for(const p in PH)pos[p]=openFrom(p,0);
  go(S.p||'adds');
  $('front').hidden=true;$('rev').hidden=false;$('foot').hidden=false;
}
function openFrom(p,from){const L=list(p);for(let i=from;i<L.length;i++)if(!S.d[PH[p].p+L[i].n])return i-i%2;return L.length}
function count(s){const c={a:{y:0,m:0},c:{y:0,m:0},l:{y:0,m:0},total:0};for(const k in s.d){c.total++;const g=c[k[0]];if(g&&g[s.d[k]]!=null)g[s.d[k]]++}
  c.m=c.a.m+c.c.m+c.l.m;c.left=Math.max(0,(s.t||0)-c.total);return c}
function save(){S.p=phase;store.set(key(D.slug),S)}
function go(p){phase=p;if(p==='maybes')snap=Object.keys(S.d).filter(k=>S.d[k]==='m'&&item(k));save();render();scrollTo(0,0)}

function render(){
  const c=count(S);
  $('tally').innerHTML=`<span class="${c.a.y>=15?'full':''}">In ✓ ${c.a.y}/15</span><span class="${c.c.y>=15?'full':''}">Out ✓ ${c.c.y}/15</span><span class="${c.l.y>=10?'full':''}">Lands ✓ ${c.l.y}/10</span><span>Maybe ${c.m}</span>`;
  for(const b of $('tabs').children)b.setAttribute('aria-pressed',b.dataset.p===phase);
  $('undo').disabled=!S.h.length;
  if(phase==='sum')return summary(c);
  if(phase==='maybes')return maybes();
  const P=PH[phase], L=list(phase), i=pos[phase];
  const nextLabel={cuts:'On to the cuts',lands:'On to the lands',maybes:'Go over the maybes'}[P.next];
  if(i>=L.length){$('stage').innerHTML=`<p class="empty">That's every ${P.word}.</p><p style="text-align:center"><button class="pill" data-go="${P.next}">${nextLabel}</button></p>`;return}
  const full=c[P.p[0]].y>=P.goal, topN=L.filter(x=>x.top).length;
  $('stage').innerHTML=(phase==='lands'?`<p class="where">Land version: each nonbasic land you take replaces a basic (${E(D.basics||'')} for all 10). On-theme lands come first.</p>`:'')
    +(full?`<div class="note"><span>${P.goal} ${phase==='adds'?'in':phase==='cuts'?'out':'lands'}. Keep going, or move on.</span><button class="pill" data-go="${P.next}">Next ›</button></div>`:'')
    +`<p class="where">${phase[0].toUpperCase()+phase.slice(1)} ${i+1}${L[i+1]?'–'+(i+2):''} of ${L.length} · ${i<topN?'the '+P.goal+' picked':'more options, best first'}</p>`
    +`<div class="pair" id="pair">${L.slice(i,i+2).map(x=>tile(x,P.p)).join('')}</div>`;
}
// Maybes: every card marked maybe when the tab opened, two to a row, so they can be settled in one place.
function maybes(){
  if(!snap.length){$('stage').innerHTML=`<p class="empty">No maybes.</p><p style="text-align:center"><button class="pill" data-go="sum">See the summary</button></p>`;return}
  const grp=[['Maybe in','a:'],['Maybe out','c:'],['Maybe lands','l:']];
  $('stage').innerHTML=grp.map(([h,p])=>{const ks=snap.filter(k=>k.startsWith(p));return ks.length?`<h2>${h} (${ks.length})</h2><div class="pair">${ks.map(k=>tile(item(k),p)).join('')}</div>`:''}).join('')
    +`<p style="text-align:center;margin-top:16px"><button class="pill" data-go="sum">See the summary</button></p>`;
}
function tile(x,P){
  const v=S.d[P+x.n]||'', add=P!=='c:';
  const info=add?`<span class="job">${E(x.job)}</span><span class="num">Built this way ${pct(x.a)} · EDHREC ${pct(x.b)}${x.src.length?' · '+x.src.length+' source'+(x.src.length>1?'s':''):''}${x.usd?' · $'+x.usd.toFixed(2):''}</span>`
    :`<span class="job">Left out of ${pct(x.out)} of decks built this way</span><span class="num">EDHREC cut ${pct(x.ed)}</span>`;
  const chips=[x.top?`<i class="top">${P==='l:'?'In the 10':'In the 15'}</i>`:'',P==='l:'&&x.theme?'<i class="top">On theme</i>':'',x.gc?'<i class="gc">Game Changer</i>':''].join('');
  return `<div class="card ${v}" data-k="${E(P+x.n)}"><button class="zb" type="button" aria-label="Zoom ${E(x.n)}"><img src="${E(x.img)}" alt="${E(x.n)}" referrerpolicy="no-referrer"></button>
    <span class="nm">${E(x.n)}</span>${info}${chips?`<span class="chips">${chips}</span>`:''}
    <div class="yn">${btn('y','Yes',v)}${btn('m','Maybe',v)}${btn('n','No',v)}</div></div>`;
}
const btn=(c,l,v)=>`<button class="${c}" data-v="${c}" aria-pressed="${v===c}">${l}</button>`;

function decide(k,v){
  S.h.push([k,S.d[k]||null]);S.d[k]=v;save();
  if(!PH[phase]){render();return}
  const P=PH[phase],L=list(phase),i=pos[phase];
  const done=L.slice(i,i+2).every(x=>S.d[P.p+x.n]);
  render();
  if(done){const pr=$('pair');if(pr)pr.classList.add('fade');setTimeout(()=>{pos[phase]=Math.max(pos[phase],openFrom(phase,i+2));render();scrollTo(0,0)},260)}
}
$('undo').onclick=()=>{const h=S.h.pop();if(!h)return;const [k,prev]=h;if(prev)S.d[k]=prev;else delete S.d[k];
  const p=Object.keys(PH).find(p=>k.startsWith(PH[p].p)),ix=list(p).findIndex(x=>PH[p].p+x.n===k);
  if(PH[phase]){phase=p;pos[p]=ix-ix%2}save();render()};
$('back').onclick=()=>{if(D)save();D=null;front()};

function summary(c){
  const row=(x,P)=>`<li data-k="${E(P+x.n)}"><span>${E(x.n)}</span><div class="yn">${btn('y','Y',S.d[P+x.n])}${btn('m','?',S.d[P+x.n])}${btn('n','N',S.d[P+x.n])}</div></li>`;
  const grp=(p,v)=>list(p).filter(x=>S.d[PH[p].p+x.n]===v);
  const ai=grp('adds','y'),co=grp('cuts','y'),li=grp('lands','y'),am=grp('adds','m'),cm=grp('cuts','m'),lm=grp('lands','m');
  const unseen=p=>list(p).filter(x=>x.top&&!S.d[PH[p].p+x.n]).length;
  const msgs=[];
  if(c.a.y!==c.c.y)msgs.push(`${c.a.y} in and ${c.c.y} out: the deck has to stay at 100, so they should match.`);
  if(unseen('adds')||unseen('cuts')||unseen('lands'))msgs.push(`Not seen yet: ${unseen('adds')} of the 15 adds, ${unseen('cuts')} of the 15 cuts, ${unseen('lands')} of the 10 lands.`);
  if(c.m)msgs.push(`${c.m} maybe${c.m>1?'s':''} still open (Maybes tab).`);
  const L=a=>a.map(x=>x.n).join('; ');
  const text=`Theme picks reviewed: ${D.name} (${D.direction})\nIN (${ai.length}): ${L(ai)||'none'}\nOUT (${co.length}): ${L(co)||'none'}\nLANDS (${li.length}, each for a basic): ${L(li)||'none'}`
    +(am.length?`\nMAYBE IN (${am.length}): ${L(am)}`:'')+(cm.length?`\nMAYBE OUT (${cm.length}): ${L(cm)}`:'')+(lm.length?`\nMAYBE LANDS (${lm.length}): ${L(lm)}`:'');
  $('stage').innerHTML=(msgs.length?msgs.map(m=>`<p class="warn">${E(m)}</p>`).join(''):`<p class="ok">${c.a.y} in, ${c.c.y} out, ${c.l.y} lands. All settled.</p>`)
    +`<p class="where">Send this to Claude to lock it in:</p><pre id="out">${E(text)}</pre><p><button class="pill" data-copy-out>Copy for Claude</button></p>`
    +[['In',ai,'a:'],['Out',co,'c:'],['Lands (for basics)',li,'l:'],['Maybe in',am,'a:'],['Maybe out',cm,'c:'],['Maybe lands',lm,'l:']].filter(g=>g[1].length||!g[0].startsWith('Maybe'))
      .map(([h,Ls,P])=>`<h2>${h} (${Ls.length})</h2><ul class="rows">${Ls.map(x=>row(x,P)).join('')||'<li><span class="st">none yet</span></li>'}</ul>`).join('')
    +`<h2>Start over</h2><p><button class="pill ghost" id="reset">Clear this deck's answers</button></p>`;
}
document.addEventListener('click',e=>{
  if($('rev').hidden)return;
  const z=e.target.closest('.zb');if(z){zoom(item(z.closest('[data-k]').dataset.k));return}
  const v=e.target.closest('[data-v]');if(v){decide(v.closest('[data-k]').dataset.k,v.dataset.v);return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const t=e.target.closest('#tabs button');if(t){go(t.dataset.p);return}
  if(e.target.closest('[data-copy-out]')){copy($('out').textContent,e.target);return}
  const r=e.target.closest('#reset');if(r){if(r.dataset.sure){S={d:{},h:[],t:S.t};for(const p in PH)pos[p]=0;go('adds')}else{r.dataset.sure=1;r.textContent='Tap again to clear'}}
});
function zoom(x){const Z=$('zoom');Z.querySelector('img').src=x.img;Z.querySelector('img').alt=x.n;
  const add='a' in x;
  Z.querySelector('p').innerHTML=E(add?`${x.n}: ${x.job} (${x.role}). Played by ${pct(x.a)} of the ${D.nd.toLocaleString()} Archidekt decks built this way and ${pct(x.b)} of EDHREC's ${D.edn.toLocaleString()} theme decks. `+(x.src.length?'Added by: '+x.src.join(', ')+'.':'No written source adds it.')
    :`${x.n}: left out of ${pct(x.out)} of the Archidekt decks built this way; EDHREC: cut from ${pct(x.ed)} of decks from this box.`)+` <a href="${E(x.url)}" target="_blank" rel="noopener">Scryfall</a>`;
  Z.classList.add('on')}
$('zoom').addEventListener('click',e=>{if(!e.target.closest('a'))$('zoom').classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('zoom').classList.remove('on')});
front();
</script>
</body>
</html>
