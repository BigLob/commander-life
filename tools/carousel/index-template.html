<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Precons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a list of the group's precons, grouped by product; each deck opens its card carousel. Same tokens as the carousels. */
:root{--bg:#f1efe9;--surface:#e4e1d8;--fg:#1d1b17;--muted:#6a665c;--accent:#9a5a00;--line:#cfcabd;
--f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--surface:#1f2329;--fg:#ece8dd;--muted:#9a978c;--accent:#e8b44a;--line:#2d333b;color-scheme:dark}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-display);padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.4rem;margin:0 0 4px;text-wrap:balance}
.sub{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin:0 0 18px}
section{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
h2{font-size:1rem;margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:.7rem;font-weight:400;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.deck{display:flex;flex-direction:column;gap:4px;color:inherit;text-decoration:none;min-width:0}
.deck img{width:100%;aspect-ratio:488/680;border-radius:4.5%/3.2%;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.3);display:block}
.deck:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.nm{font-weight:700;font-size:.95rem;margin-top:4px}
small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
small.pr{color:var(--accent)}
</style></head><body>
<h1>Our precons</h1>
<p class="sub">Tap a deck to swipe through its 100 cards. Fav, Bench and Trash marks stay on this phone.</p>
<!--DECKS-->
</body></html>
