<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sisko Proxies</title>
<!-- app-board-link: the installed app has no address bar, so every page links the board's manifest (installing from here still opens the board) and, inside the app, shows a Board button back to it. -->
<link rel="manifest" href="/commander-life/app/manifest.json">
<script>addEventListener('DOMContentLoaded',function(){if(!(matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches||navigator.standalone))return;var a=document.createElement('a');a.href='/commander-life/';a.textContent='\u{1F0CF} Board';a.setAttribute('style','position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:9999;padding:9px 14px;border-radius:999px;background:#0c0e11;color:#f3e3b0;border:1px solid #c9a24a;font:600 15px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.5)');document.body.appendChild(a)})</script>
<style>
/* 3 x 3 cards of 2.5 x 3.5 in fill 7.5 x 10.5 in, centred on Letter: 0.5 in sides, 0.25 in top and bottom.
   Cards touch, so one straight cut along each grey line separates them. Back pages stay empty. */
@page{size:letter;margin:0}
html{background:#ccc}body{margin:0}
.pg{width:8.5in;height:11in;box-sizing:border-box;padding:.25in .5in;background:#fff;margin:16px auto;
  display:grid;grid-template-columns:repeat(3,2.5in);grid-template-rows:repeat(3,3.5in);align-content:start;
  position:relative;break-after:page}
.pg img{width:2.5in;height:3.5in;display:block;outline:.5px solid #999;outline-offset:-.25px}
@media screen{.pg.back{display:none}}
@media print{html{background:#fff}.pg{margin:0}.pg:last-child{break-after:auto}a[href="/commander-life/"]{display:none!important}}
</style></head><body><section class="pg"><img src="https://cards.scryfall.io/large/front/a/7/a785dcd0-2df5-4d31-a01a-61fa7a1f1806.jpg?1793273928" alt=""><img src="https://cards.scryfall.io/large/front/c/d/cd424080-e8ad-4a56-a820-20d8534fba31.jpg?1793447127" alt=""><img src="https://cards.scryfall.io/large/front/1/a/1a027761-84e7-4cbf-a629-ae9bd3d8467b.jpg?1793100632" alt=""><img src="https://cards.scryfall.io/large/front/d/1/d17ea45c-7f9c-411f-b7d3-ca7100ffe53b.jpg?1784036788" alt=""></section><section class="pg back"></section></body></html>
